<title>AZ Carpool Aalsmeer</title>
<style>
/* ============================================================
   Design tokens — AZ Carpool Aalsmeer Design System v2.0.0
   ============================================================ */
:root{
  /* AZ brand */
  --az-red:#dc2626; --az-red-dark:#991b1b; --az-red-light:#fee2e2; --az-red-muted:#991b1b;
  /* fonts */
  --font-sans:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  /* radius scale */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:9999px;
  /* shadow */
  --shadow-card:0 2px 8px rgba(15,23,42,0.06);

  /* Light mode surface tokens */
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --accent:var(--az-red); --accent2:var(--az-red-light);
  /* Color language: green = ok / you're driving · amber = a change · neutral = labels.
     --ok and --warn-text are dark enough for small text (>= 4.5:1 on white and on their tints). */
  --ok:#047857; --ok2:#d1fae5; --warn:#d97706; --warn2:#fef3c7; --warn-text:#92400e;
  --danger:#b91c1c;
  --backup:#64748b; --info:#2563eb; --info2:#dbeafe; --pill:#334155; --pill2:#f1f5f9;

  /* Bottom safe-area inset, used everywhere via var(--sab). Firefox for Android reports the
     gesture-bar inset even in a normal browser tab, where its own toolbar already covers that
     area, so the inset got added twice (white gap under the nav). The <head> script sets
     .no-bottom-inset in exactly that case (Firefox Android, not installed), making it 0. */
  --sab:env(safe-area-inset-bottom,0px);

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:var(--sab);
}
:root.no-bottom-inset{--sab:0px}
:root[data-theme="dark"]{
  --bg:#020617; --card:#0f172a; --text:#f8fafc; --muted:#94a3b8; --border:#1e293b;
  --accent:var(--az-red); --accent2:#3a1414;
  --ok:#34d399; --ok2:#0f2b21; --warn:#fbbf24; --warn2:#3a2e0f; --warn-text:#fbbf24;
  --backup:#94a3b8; --info:#60a5fa; --info2:#122036; --pill:#cbd5e1; --pill2:#1e293b;
  --danger:#f87171;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow:hidden}
/* ---------- Flex-shell layout (deliberately NOT position:fixed for header/nav) ----------
   Firefox for Android has a confirmed, still-open bug where position:fixed elements ride up
   and down with the page during its own dynamic address-bar show/hide animation, then "snap"
   back (Mozilla bugzilla #1760924, #1712280, and others — still reproducing in current Firefox
   versions as of this writing). The robust fix is architectural, not a CSS value tweak: make
   header/nav normal flex children of a 100dvh column instead of fixed overlays, with ONLY the
   middle content area scrolling internally. Since nothing here is fixed anymore, Firefox's
   buggy fixed-position-during-toolbar-transition code path never gets involved at all. */
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#topbar{flex-shrink:0}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(135deg,var(--az-red),var(--az-red-dark));color:#fff}
header h1{margin:0;font-size:20px;font-weight:800;white-space:nowrap}
header p{margin:2px 0 0;font-size:12px;opacity:.95}
#themeToggle{width:40px;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0}
/* ---------- Bottom tab bar (flex item, safe-area aware, thumb-reachable) ---------- */
#bottomnav{flex-shrink:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:var(--sab);height:calc(56px + var(--sab));box-sizing:border-box}
.navtab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;padding:0 4px;height:56px;cursor:pointer;color:var(--muted);position:relative}
.navtab .navicon{font-size:19px;line-height:1}
.navtab .navicon svg{width:22px;height:22px}
.navtab .navicon .ph-fill{display:none}
.navtab.active .navicon .ph-regular{display:none}
.navtab.active .navicon .ph-fill{display:inline}
.navtab .navlabel{font-size:10px;font-weight:600;white-space:nowrap}
.navtab.active{color:var(--accent)}
.navtab.active .navlabel{font-weight:700}
.navbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:var(--radius-full);background:var(--accent);color:#fff;font-size:10px;font-weight:800;line-height:17px;text-align:center}
.card.timeChangeCard{border-color:var(--warn);border-left:4px solid var(--warn)}
.timeChangeFam{padding:8px 0;border-top:1px solid var(--border)}
.timeChangeFam:first-of-type{border-top:none}
.timeChangeLine{font-size:13px;font-family:var(--font-mono);margin-top:2px}
.navtab.active::after{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:var(--radius-full);background:var(--accent)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;max-width:760px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.card h2{margin:0 0 10px;font-size:15px;font-weight:800}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=tel],input[type=number],select{width:100%;padding:9px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:14px;min-height:38px;font-family:var(--font-sans)}
input[type=time]{padding:8px 7px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:13px;width:100%;min-height:38px;font-family:var(--font-mono);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid5>button{min-width:0;padding:8px 4px;font-size:12px;white-space:normal;word-break:break-word;line-height:1.2}
/* ---------- Mijn gezin: day tabs, capacity stepper, drive-toggle buttons ---------- */
.dayTabBtn{min-width:0;padding:10px 2px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;min-height:40px}
.dayTabBtn.active{background:var(--card);color:var(--accent);border-color:var(--accent)}
.dayFormCard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-top:8px}
.stepperCard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-top:6px}
.stepperInfo{display:flex;align-items:center;gap:10px}
.stepperInfo svg{width:22px;height:22px;color:var(--accent);flex-shrink:0}
.stepperTitle{font-size:13px;font-weight:700}
.stepperSub{font-size:11px;color:var(--muted)}
.stepperControls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.stepperBtn{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.stepperValue{font-size:16px;font-weight:800;font-family:var(--font-mono);min-width:1.5em;text-align:center}
.driveToggleInput{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.driveToggleGroup{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.driveToggleBtn{display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:600;cursor:pointer;min-height:44px;color:var(--text)}
.driveToggleCheck{width:18px;height:18px;border-radius:5px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg)}
.driveToggleCheck svg{width:12px;height:12px;color:transparent}
/* Back-up keeps its own look (blue, dashed, round box) so it never reads as "Beschikbaar",
   but shows a real check mark when selected, just like Beschikbaar does. */
.driveToggleBtn-backup .driveToggleCheck{border-style:dashed;border-radius:50%}
.driveToggleInput:checked+.driveToggleBtn-standard{border-color:var(--ok);background:var(--ok2);color:var(--ok)}
.driveToggleInput:checked+.driveToggleBtn-standard .driveToggleCheck{background:var(--ok);border-color:var(--ok)}
.driveToggleInput:checked+.driveToggleBtn-standard .driveToggleCheck svg{color:#fff}
.driveToggleInput:checked+.driveToggleBtn-backup{border-color:var(--info);background:var(--info2);color:var(--info)}
.driveToggleInput:checked+.driveToggleBtn-backup .driveToggleCheck{background:var(--info);border-color:var(--info);border-style:solid}
.driveToggleInput:checked+.driveToggleBtn-backup .driveToggleCheck svg{color:#fff}
.driveToggleInput:focus-visible+.driveToggleBtn{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:var(--muted)}
.chk input{min-height:18px}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;min-height:40px;font-family:var(--font-sans)}
button.btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
button.btn.small{padding:8px 12px;font-size:12.5px;margin:0;min-height:36px}
button.btn:disabled{opacity:.35;cursor:default}
/* Button roles: primary = solid red (.btn) · destructive = red outline + red text (.danger)
   · everything else = secondary (.btn.secondary). */
button.btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--danger)}
.iconbtn.danger{color:var(--danger);border-color:var(--danger);display:inline-flex;align-items:center;justify-content:center;background:var(--card)}
.linkbtn{background:none;border:none;padding:8px 0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--danger)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center}
.iconbtn:disabled{opacity:.35;cursor:default}
/* Neutral direction label: "Heen · Aalsmeer → Alkmaar" */
.dirLabel{display:inline-flex;align-items:center;gap:6px;background:var(--pill2);color:var(--pill);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--radius-full)}
.changedTag{display:inline-flex;align-items:center;gap:4px;background:var(--warn2);color:var(--warn-text);font-size:11px;font-weight:800;padding:3px 8px;border-radius:var(--radius-full)}
/* Shared small square badge: weekday in Mijn week and the car number in Rooster */
.dayBadge{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--pill2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.dayBadge.accent{background:var(--accent);color:#fff}
/* Segmented control (Rooster: Deze week / Standaardrooster) */
.segmented{display:flex;background:var(--pill2);border-radius:var(--radius-full);padding:3px;margin-bottom:12px}
.segmented button{flex:1;border:none;background:none;padding:8px 6px;border-radius:var(--radius-full);font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;min-height:36px}
.segmented button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-card)}
/* Alert for rides without a car */
.unplacedAlert{background:var(--accent2);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px;color:var(--text)}
.unplacedAlert .ttl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--danger)}
.unplacedAlert .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(185,28,28,.2);font-size:13px}
.unplacedAlert .row:first-of-type{border-top:none}
/* Bottom sheet (Rooster: tap a passenger to move her) */
.sheetOverlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:520px;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:16px 16px calc(16px + var(--sab));box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sheet .sheetItem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font:inherit;font-size:14px;cursor:pointer;min-height:48px}
.sheet .sheetItem .sub{font-size:12px;color:var(--muted)}
/* ---------- Day-pill carousel (Rooster) ---------- */
.daypills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
.daypill{flex:0 0 auto;min-width:64px;min-height:48px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;padding:6px 10px;position:relative;font-family:var(--font-sans)}
.daypill .daypillTop{display:block;font-size:12px;font-weight:800}
.daypill .daypillSub{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.daypill.active{background:var(--accent);border-color:var(--accent)}
.daypill.active .daypillTop{color:#fff}
.daypill.active .daypillSub{color:var(--az-red-light)}
.daypill .daypillToday{position:absolute;top:5px;left:7px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.daypill.active .daypillToday{background:#fff}
.daypill .daypillAlert{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);background:var(--danger);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;border:2px solid var(--bg)}
.daypills{padding-top:8px;padding-right:8px}
.daysection>h3{font-size:14px;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:4px;font-weight:800}
.group{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius-lg);padding:12px;margin:8px 0;background:var(--card);box-shadow:var(--shadow-card)}
.group.confirmed{border-left-color:var(--info)}
.group.suggestion{border-left-color:var(--ok)}
.group.suggestion.primary{border-left-color:var(--ok);background:var(--ok2)}
.group.warning{border-left-color:var(--warn)}
.group .dir{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.group .time{font-size:18px;font-weight:800;font-family:var(--font-mono)}
.group .subtime{font-size:12px;color:var(--muted)}
.pill{display:inline-block;background:var(--pill2);color:var(--pill);border-radius:var(--radius-full);padding:5px 11px;font-size:12px;font-weight:600;margin:2px 3px 0 0;border:1px solid transparent;font-family:var(--font-sans)}
.pill.mine{background:var(--accent2);color:var(--danger);border-color:var(--accent);font-weight:800}
button.pill{cursor:pointer;min-height:32px}
button.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.driver{color:var(--text);font-weight:600;font-size:13px;margin-top:6px;display:flex;align-items:center;gap:6px}
.driver.me{color:var(--ok);font-weight:800}
.driver select{flex:1;min-height:36px;font-weight:600}
.cap{font-size:12px;color:var(--muted);font-weight:600}
.capbadge{display:inline-block;background:var(--pill2);color:var(--pill);font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--radius-full);white-space:nowrap}
.group.mineDriving{border-left-color:var(--ok)}
.timeBig{font-size:18px!important;font-weight:800;font-family:var(--font-mono);width:auto!important;min-height:36px!important;padding:4px 8px!important}
.tripReserve{font-size:12px;color:var(--muted);margin:2px 0 10px 2px}
/* Tap-to-WhatsApp names (Rooster "Deze week": chauffeur + reserve) */
a.waLink{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:3px;min-height:24px}
a.waLink:hover{text-decoration-style:solid}
a.waLink svg{width:13px;height:13px;flex-shrink:0}
.reserve{font-size:12px;color:var(--muted);margin-top:4px}
.girlchk{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.muted{color:var(--muted);font-size:12px}
.badge{background:var(--ok2);color:var(--ok);font-size:11px;padding:2px 7px;border-radius:var(--radius-full)}
.badge.rec{background:var(--accent2);color:var(--accent);font-weight:700}
.rowflex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fitok{color:var(--ok);font-size:12px;margin-top:4px;font-weight:700}
.fitbad{color:var(--warn-text);font-size:12px;margin-top:4px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:12px}
table.avail{width:100%;border-collapse:collapse;font-size:12px}
table.avail th,table.avail td{padding:6px 4px}
.dayBlock{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden}
.dayBlockHead{padding:10px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);background:var(--card)}
.dayBlockHead .sumInfo{font-weight:400;color:var(--muted);font-size:12px}
.dayDetailsBody{padding:10px 12px}
.iconbtn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);min-width:38px;min-height:38px;font-size:14px;cursor:pointer;color:var(--text)}
.availStd{display:inline-block;min-width:22px;padding:2px 4px;border-radius:6px;background:var(--ok);color:#fff;font-weight:800}
:root[data-theme="dark"] .availStd{color:#022c22}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
/* ---------- Mijn week hero card ---------- */
.heroCard{background:linear-gradient(135deg,var(--az-red),var(--az-red-dark));border-radius:var(--radius-xl);padding:18px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow-card)}
/* Compact hero: one row — daughter + parent on the left, WhatsApp icon button on the right */
.heroCard.compact{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-lg)}
.heroCard.compact .heroText{flex:1;min-width:0}
.heroCard.compact .heroName{font-size:17px;margin:0;line-height:1.25}
.heroCard.compact .heroSub{font-size:12px;color:#fff;opacity:.95;margin:2px 0 0}
.waIconBtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;padding:0}
.waIconBtn svg{margin:0!important;width:26px;height:26px}
.legendLine{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:4px 2px 12px}
.legendLine span{display:inline-flex;align-items:center;gap:4px}
.heroCard .heroTag{display:inline-block;background:rgba(255,255,255,.2);border-radius:var(--radius-full);padding:4px 10px;font-size:9px;font-weight:800;letter-spacing:.04em}
.heroCard .heroName{font-size:24px;font-weight:800;margin:10px 0 2px}
.heroCard .heroSub{font-size:12px;color:var(--az-red-light);margin:0}
.heroCard .heroLegend{border-top:1px solid rgba(255,255,255,.2);margin-top:14px;padding-top:10px;font-size:10px;font-weight:600;display:flex;flex-wrap:wrap;gap:10px}
.heroCard #wa-hero{background:#fff;color:var(--az-red-dark);border:none;margin-top:12px}
.dayCard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-card)}
.dayCard.today{border:2px solid var(--accent)}
.dayCard .dayCardHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dayCard .dayBadge{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--pill2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.dayCard.today .dayBadge{background:var(--accent);color:#fff}
.dayCard .dayCardTitle{font-size:14px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayCard .todayTag{background:var(--accent2);color:var(--accent);font-size:9px;font-weight:800;padding:3px 8px;border-radius:var(--radius-sm)}
.dayCard .dayTimes{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.subride{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;margin-top:6px}
.subride.driving{border-color:var(--ok);border-width:2px}
.subride .subrideHead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700}
.subride .subrideDep{font-family:var(--font-mono);color:var(--accent);font-weight:700}
.subride .subrideStatus{font-size:12px;color:var(--muted);margin-top:3px}
.subride .subrideStatus.driving{color:var(--ok);font-weight:700}
.subride.unplanned{border-color:var(--danger);border-width:2px;background:var(--accent2)}
.subride .subrideStatus.unplanned{color:var(--danger);font-weight:800;font-size:13px;display:flex;align-items:center;gap:4px}
.subride .subrideStatus.changed{color:var(--warn-text);font-weight:600}
/* ---------- Dagafwijking (amber "warning" theme) ---------- */
.devAlert{background:var(--warn2);border:1px solid #fcd34d;border-radius:var(--radius-xl);padding:14px 16px;margin-bottom:14px}
:root[data-theme="dark"] .devAlert{border-color:#78350f}
.devAlert .devAlertTitle{font-size:13px;font-weight:800;color:var(--warn-text);margin:0}
.devAlert .devAlertBody{font-size:11px;color:var(--warn-text);margin:4px 0 0}
.devCard{border-color:var(--warn) !important}
.devDayDot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.devDayBtn.changed{border-color:var(--warn)}
/* ---------- Wedstrijdcarpool (violet "match" theme + football icon) ----------
   Deliberately a different color family than the weekday carpool (red/green) and the
   Dagafwijking (amber), so a match ride is recognisable at a glance everywhere it shows up. */
:root{--match:#7c3aed;--match2:#ede9fe;--match-text:#5b21b6}
:root[data-theme="dark"]{--match:#a78bfa;--match2:#221a3a;--match-text:#c4b5fd}
.group.matchGroup{border-left-color:var(--match)}
.matchTitle{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.matchTitle .matchBall{color:var(--match);display:inline-flex}
.matchTag{display:inline-flex;align-items:center;gap:4px;background:var(--match2);color:var(--match-text);font-size:9px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:var(--radius-sm);text-transform:uppercase}
.matchCarRow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12.5px}
.matchCarRow .matchCarDep{font-family:var(--font-mono);font-weight:700;color:var(--match-text);flex-shrink:0}
.matchCarRow.mine{background:var(--match2);border-radius:var(--radius-sm);padding:6px 8px;border-top-color:transparent}
.matchCapWarn{color:var(--warn);font-size:12px;font-weight:700;margin-top:6px}
.subride.matchRide{background:var(--match2);border:2px solid var(--match)}
.subride.matchRide .subrideHead{color:var(--match-text)}
.subride.matchRide .subrideDep{color:var(--match-text)}
.subride.matchRide .subrideStatus{color:var(--match-text)}
.subride.matchRide .subrideStatus.driving{font-weight:700}
.dayCard.matchDay{border-color:var(--match)}
.dayCard.matchOnly .dayBadge{background:var(--match);color:#fff}
.trashBtn{color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>

// ISO week (e.g. "2026-W14") — deviations are tagged with this so they can never apply to
// any week but the one they were made for, regardless of when the app happens to be opened.
function getISOWeekKey(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const weekNum = 1+Math.round(((d-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return d.getUTCFullYear()+'-W'+String(weekNum).padStart(2,'0');
}
// NOT frozen at page load: a tab or installed PWA that stays open across a weekend must roll
// over to the new week. (A frozen key made such a stale tab treat the new week's deviations as
// "old" and delete them within seconds of anyone saving one.)
let currentWeekKey = getISOWeekKey(effectivePlanningDate());
function refreshWeekKey(){
  const k = getISOWeekKey(effectivePlanningDate());
  if(k===currentWeekKey) return false;
  currentWeekKey = k; return true;
}
// When a deviation for the current planning week stops mattering: Saturday 00:00 (local) of
// that week. Stored on the document as `expiresAt`; firestore.rules refuse deletes before it.
function deviationExpiryMs(){
  const s = startOfWeek(effectivePlanningDate()); s.setDate(s.getDate()+5); return s.getTime();
}
function deviationKey(day,direction){ return day+'_'+direction; }
function activeDeviation(day,direction){
  const dev = deviations[deviationKey(day,direction)];
  return (dev && dev.weekKey===currentWeekKey && dev.cars && dev.cars.length) ? dev : null;
}
// The single source of truth for "what cars actually run today" — the default Rooster groups,
// unless a still-current-week deviation overrides them. Used by Mijn week, the Wijzigen editor
// and Rooster's "Deze week" view. Rooster's "Standaardrooster" view shows the default groups,
// and deviations never touch those.
function effectiveCars(day,direction){
  const dev = activeDeviation(day,direction);
  if(dev) return dev.cars.map(c=>({...c}));
  return groupsFor(day,direction).map(([gid,g])=>({...g, baseGroupId:gid}));
}
async function purgeStaleDeviations(){
  refreshWeekKey();
  const now = Date.now();
  for(const [key,dev] of Object.entries(deviations)){
    // Only ever purge an OLDER week (ISO keys like "2026-W39" sort correctly as strings) and
    // only once its own expiry has passed — never a newer week's deviation.
    const olderWeek = !dev.weekKey || dev.weekKey < currentWeekKey;
    const expired = typeof dev.expiresAt!=='number' || dev.expiresAt <= now;
    if(olderWeek && expired){
      try{ await db.doc("deviations/"+key).delete(); }catch(e){}
    }
  }
}

// "capacity" as entered/stored is the TOTAL car capacity including the driver's own seat.

function shiftKeyOf(day,direction){ return day+'_'+direction; }
function shiftPriorityOf(day,direction,id){
  const map = shiftPriority[shiftKeyOf(day,direction)] || {};
  return map[id]!=null? map[id] : 999;
}
function sortByShiftPriority(day,direction,entries){
  return [...entries].sort((a,b)=>shiftPriorityOf(day,direction,a[0])-shiftPriorityOf(day,direction,b[0]));
}
// Standaard-beschikbaar drivers are preferred as a whole GROUP over back-up-only drivers when
// actually filling a shift — Selectievolgorde rank only decides order WITHIN each tier. This is
// deliberately separate from the reserve-list display, which stays pure Selectievolgorde order
// regardless of standaard/back-up (that distinction doesn't matter for "who could step in").
function sortByAvailabilityTier(day,direction,entries){
  return [...entries].sort((a,b)=>{
    const aTier = isStandaardAvailable(a[1],day,direction)? 0 : 1;
    const bTier = isStandaardAvailable(b[1],day,direction)? 0 : 1;
    if(aTier!==bTier) return aTier-bTier;
    return shiftPriorityOf(day,direction,a[0])-shiftPriorityOf(day,direction,b[0]);
  });
}
function backupField(direction){ return direction==='heen' ? 'backupHeen' : 'backupTerug'; }
function isStandaardAvailable(f,day,direction){
  const a=(f.availability&&f.availability[day])||{};
  return !!a[direction];
}
function isAvailable(f,day,direction){
  const a=(f.availability&&f.availability[day])||{};
  return !!(a[direction] || a[backupField(direction)]);
}

function twoStepConfirm(btn, confirmLabel, action){

function wireFamilyFormExtras(prefix, rerenderFn){
  DAYS.forEach(([k])=>{
    const btn=document.querySelector(`[data-daytab="${prefix}|${k}"]`);
    if(btn) btn.onclick=()=>{
      // Merge in whatever's currently typed (even not-yet-blurred edits) before switching
      // days, so a fast tab-switch can never silently discard an in-progress edit.
      try{
        const live = readFamilyForm(prefix);
        const targetId = prefix==='me'? myFamilyId() : coordEditId;
        if(targetId!=null && families[targetId]) families[targetId] = {...families[targetId], ...live};
      }catch(e){ /* nothing persisted yet to merge with (e.g. brand new family) — safe to skip */ }
      formSelectedDay[prefix]=k; hapticTap(); rerenderFn();
    };
  });
  const hidden=document.getElementById(`${prefix}_capacity`);
  const valueEl=document.getElementById(`${prefix}_capacityValue`);
  const titleEl=document.getElementById(`${prefix}_capacityTitle`);
  const hintEl=document.getElementById(`${prefix}_capacityHint`);
  function step(delta){
    let v=(parseInt(hidden.value)||4)+delta;
    v=Math.max(1,Math.min(9,v));
    hidden.value=v;
    if(valueEl) valueEl.textContent=v;
    if(titleEl) titleEl.textContent=v+' zitplaatsen totaal';
    if(hintEl) hintEl.textContent=Math.max(0,v-1);
    hapticTap();
    hidden.dispatchEvent(new Event('change',{bubbles:true}));
  }
  const downBtn=document.querySelector(`[data-stepdown="${prefix}"]`);
  const upBtn=document.querySelector(`[data-stepup="${prefix}"]`);
  if(downBtn) downBtn.onclick=()=>step(-1);
  if(upBtn) upBtn.onclick=()=>step(1);
}
// "Rijdt X" and "Back-up X" are mutually exclusive: ticking one unticks the other.
function wireExclusiveAvailability(prefix){
  DAYS.forEach(([k])=>{
    const heen=document.getElementById(`${prefix}_av_${k}_heen`);
    const bkH=document.getElementById(`${prefix}_bkH_${k}`);
    const terug=document.getElementById(`${prefix}_av_${k}_terug`);
    const bkT=document.getElementById(`${prefix}_bkT_${k}`);
    if(heen && bkH){
      heen.addEventListener('change', ()=>{ if(heen.checked) bkH.checked=false; });
      bkH.addEventListener('change', ()=>{ if(bkH.checked) heen.checked=false; });
    }
    if(terug && bkT){
      terug.addEventListener('change', ()=>{ if(terug.checked) bkT.checked=false; });
      bkT.addEventListener('change', ()=>{ if(bkT.checked) terug.checked=false; });
    }
  });
}
function readFamilyForm(prefix){
  const schedule={}, availability={};
  DAYS.forEach(([k])=>{
    schedule[k]={heen:document.getElementById(`${prefix}_sch_${k}_heen`).value, terug:document.getElementById(`${prefix}_sch_${k}_terug`).value};
    availability[k]={
      heen:document.getElementById(`${prefix}_av_${k}_heen`).checked,
      terug:document.getElementById(`${prefix}_av_${k}_terug`).checked,
      backupHeen:document.getElementById(`${prefix}_bkH_${k}`).checked,
      backupTerug:document.getElementById(`${prefix}_bkT_${k}`).checked
    };
  });
  return {
    parentName:document.getElementById(`${prefix}_parentName`).value.trim(),
    girlName:document.getElementById(`${prefix}_girlName`).value.trim(),
    parentPhone1:document.getElementById(`${prefix}_parentPhone1`).value.trim(),
    parentPhone2:document.getElementById(`${prefix}_parentPhone2`).value.trim(),
    capacity:parseInt(document.getElementById(`${prefix}_capacity`).value)||4,
    schedule, availability
  };
}

// Coordinator status is either tied to the original claiming browser (uid), or — once the
// coordinator designates one in Beheer — to whichever family is linked as "coordinator gezin",
// so it survives clearing browser data as long as that family re-verifies through the gate.
function recomputeCanEdit(){
  if(impersonateFamilyId){ canEdit=false; updateStatusLine(); return; } // testing as a parent always overrides real coordinator status
  if(!coordinatorConfig){ canEdit=false; updateStatusLine(); return; }
  if(coordinatorConfig.uid && coordinatorConfig.uid===me){ canEdit=true; updateStatusLine(); return; }
  if(coordinatorConfig.familyId && links[me] && links[me].familyId===coordinatorConfig.familyId){ canEdit=true; updateStatusLine(); return; }
  canEdit=false; updateStatusLine();
}
// Single source of truth for the header line, so it can never go stale relative to the real
// permission state — always recomputed together with canEdit, from wherever that changes.
function updateStatusLine(){
  const linked = !!(links[me] && links[me].familyId) || !!impersonateFamilyId;
  let text;
  if(linked){
    const f = fam(myFamilyId());
    text = (f.parentName||'Ouder') + (canEdit? ' (Coördinator)' : '');
  } else if(canEdit){
    text = 'Coördinator';
  } else if(me){
    text = 'Nog niet gekoppeld — ga naar Mijn gezin';
  } else {
    text = '';
  }
  setStatus(text);
}

async function submitGate(){
  if(!db||!me){ showToast("Geen verbinding. Herlaad de pagina."); return; }
  const phone=(document.getElementById('gatePhone').value||'').trim();
  const girlSel=document.getElementById('gateGirl');
  const girlId=girlSel? girlSel.value : null;
  const code=(document.getElementById('gateCode').value||'').trim();
  const msg=document.getElementById('gateMsg');
  if(!phone||!girlId||!code){ if(msg) msg.textContent="Vul alle velden in."; return; }
  const expectedCode=(fam(girlId).inviteCode||'').trim();
  const expectedPhone1=fam(girlId).parentPhone1||'';
  const expectedPhone2=fam(girlId).parentPhone2||'';
  if(!expectedCode||(!expectedPhone1&&!expectedPhone2)){ if(msg) msg.textContent="Voor dit gezin is nog geen code/telefoonnummer ingesteld. Vraag de coördinator."; return; }
  const enteredNorm=normalizePhone(phone);
  if(enteredNorm!==normalizePhone(expectedPhone1) && enteredNorm!==normalizePhone(expectedPhone2)){ if(msg) msg.textContent="Telefoonnummer komt niet overeen met dit gezin."; return; }
  if(code!==expectedCode){ if(msg) msg.textContent="Code klopt niet. Controleer en probeer opnieuw."; return; }
  try{
    await db.doc("links/"+me).set({familyId:girlId, phone});
    showToast("Toegang verleend ✓");
  }catch(e){ if(msg) msg.textContent="Mislukt: "+(e&&e.message||e); }
}
// Compares Dutch numbers regardless of 06.../ +316.../ 00316... formatting or stray spaces/dashes.
function normalizePhone(p){
  let digits=(p||'').replace(/[^\d]/g,'');
  if(digits.startsWith('0031')) digits='0'+digits.slice(4);
  else if(digits.startsWith('31') && digits.length>=11) digits='0'+digits.slice(2);
  return digits;
}

async function saveProfile(){
  if(!db){showToast("Geen verbinding met opslag. Herlaad de pagina en probeer opnieuw.");return;}
  if(!me){showToast("Je account kon niet herkend worden. Herlaad de pagina.");return;}
  const effId = myFamilyId();
  const data = readFamilyForm('me');
  // A parent (not the coordinator) changing their daughter's times gets flagged for the
  // coordinator, stored on the family doc itself as `timeChanges` until marked as seen.
  const timeChanges = canEdit? [] : diffSchedules(serverSchedules[effId], data.schedule);
  if(timeChanges.length){
    data.timeChanges = mergePendingChanges(fam(effId).timeChanges, timeChanges, {at:Date.now(), by:myDisplayInfo().name});
  }
  try{
    await db.doc("families/"+effId).set(data,{merge:true});
    serverSchedules[effId] = JSON.parse(JSON.stringify(data.schedule));
    if(data.timeChanges && families[effId]) families[effId] = {...families[effId], timeChanges:data.timeChanges};
    showToast(timeChanges.length? "Opgeslagen ✓ — de coördinator ziet je gewijzigde tijden" : "Opgeslagen ✓");
  }
  catch(e){showToast("Opslaan mislukt: "+(e&&e.message||e));}
}

// ---------- Mijn week: a compact, scroll-free view of just what a parent needs ----------
function renderMyWeek(){
  const box=document.getElementById('tab-myweek');
  if(!box) return;
  if(!me){ box.innerHTML=`<div class="card"><h2>Mijn week</h2><p class="muted">Kon je account niet herkennen. Herlaad de pagina.</p></div>`; return; }

  if(!linked){ box.innerHTML=`<div class="card"><h2>Mijn week</h2><p class="muted">Koppel eerst je dochter via 'Mijn gezin' om hier je weekoverzicht te zien.</p></div>`; return; }
  const myId = myFamilyId();
  const myFam = fam(myId);

  function subride(day,direction,label){
    const s = myFam.schedule && myFam.schedule[day] && myFam.schedule[day][direction];
    if(!s) return '';
    const cars = effectiveCars(day,direction);
    const daughterIdx = cars.findIndex(c=>c.girlIds.includes(myId));
    const drivingIdx = cars.findIndex(c=>c.driverFamilyId===myId);
    let dep = s, statusHtml, statusClass='';
    if(daughterIdx>=0){
      const g=cars[daughterIdx];
      dep = g.departureTime||s;
      const isMe = g.driverFamilyId===myId;
      if(isMe){
        // Full passenger list, including your own daughter — not just "everyone else".
        const passengers=g.girlIds.map(id=>girlName(id)).join(', ');
        statusHtml = `${phIcon('user')}${phIcon('car')} Jij rijdt${passengers? ` · ${passengers}`:''}`; statusClass='driving';
      } else {
        const driverName = g.driverFamilyId? esc(fam(g.driverFamilyId).parentName) : 'nog geen chauffeur';
        statusHtml = `${phIcon('user')} Rijdt mee met: ${driverName}`;
      }
    } else {
      statusHtml = `${phIcon('warning')} niet ingepland`; statusClass='unplanned';
    }
    // Own driving duty in a DIFFERENT car than the daughter's own ride — shown as a second line.
    let extraDriving='';
    if(drivingIdx>=0 && drivingIdx!==daughterIdx){
      const dg=cars[drivingIdx];
      const names=dg.girlIds.map(id=>girlName(id)).join(', ');
      extraDriving = `<div class="subrideStatus driving">${phIcon('car')} Jouw rijbeurt om ${dg.departureTime||'?'} · ${names}</div>`;
      statusClass = statusClass? statusClass : ''; // the driving BORDER below reflects the daughter's own car only, not this second one
    }
    const devTag = activeDeviation(day,direction)? `<div class="subrideStatus changed">${phIcon('lightning')} Wijziging actief</div>` : '';
    return `<div class="subride ${statusClass}">
      <div class="subrideHead"><span>${label}</span><span class="subrideDep">${dep}</span></div>
      <div class="subrideStatus ${statusClass}">${statusHtml}</div>
      ${extraDriving}${devTag}
    </div>`;
  }

  // Wedstrijdcarpool rides (spontaneous, per match) — violet + football so they never get
  // mistaken for the regular weekday carpool. Grouped per calendar date.
  const matchRidesByDate = {}, matchDateByKey = {};
  myMatchRides(myId).forEach(r=>{
    const d=new Date(r.doc.startMs); d.setHours(0,0,0,0); const k=d.toDateString();
    matchDateByKey[k]=d; (matchRidesByDate[k]=matchRidesByDate[k]||[]).push(r);
  });
  function matchRideHtml(r){
    const a = analyzeMatch(r.doc.summary||'');
    const kickoff = new Date(r.doc.startMs).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const homeAway = a.isHome===true? ' (Thuis)' : a.isHome===false? ' (Uit)' : '';
    const passengers = (r.car.girlIds||[]).map(id=>girlName(id)).join(', ');
    const status = r.driving
      ? `${r.daughter? phIcon('user'):''}${phIcon('car')} Jij rijdt${passengers? ` · ${passengers}`:''}`
      : `${phIcon('user')} Rijdt mee met: ${r.car.driverFamilyId? esc(fam(r.car.driverFamilyId).parentName) : 'nog geen chauffeur'}`;
    return `<div class="subride matchRide">
      <div class="subrideHead"><span style="display:inline-flex;align-items:center;gap:5px">${phIcon('soccer')} Wedstrijd: ${esc(matchLabel(r.doc))}${homeAway} vs ${esc(a.opponent)}</span><span class="subrideDep">${esc(r.car.departureTime||'--:--')}</span></div>
      <div class="subrideStatus ${r.driving?'driving':''}">${status}</div>
      <div class="subrideStatus" style="font-size:11px">Aftrap ${kickoff}${r.doc.location? ' · '+esc(r.doc.location):''}</div>
    </div>`;
  }
  function matchRidesFor(date){ return (matchRidesByDate[date.toDateString()]||[]).map(matchRideHtml).join(''); }
  const matchTagHtml = `<span class="matchTag">${phIcon('soccer')} Wedstrijd</span>`;
  const todayStr = new Date().toDateString();

  const weekdayDates = new Set(DAYS.map(([k])=>dateForWeekday(k).toDateString()));
  const dayCards = DAYS.map(([k,label])=>{
    const isToday = k===todayKey;
    const heenHtml = subride(k,'heen',DIR_TEXT.heen);
    const terugHtml = subride(k,'terug',DIR_TEXT.terug);
    const matchHtml = matchRidesFor(dateForWeekday(k));
    if(!heenHtml && !terugHtml && !matchHtml) return '';
    const heenTime = (myFam.schedule&&myFam.schedule[k]&&myFam.schedule[k].heen) || '';
    const terugTime = (myFam.schedule&&myFam.schedule[k]&&myFam.schedule[k].terug) || '';
    const dateLabel = dateForWeekday(k).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    const onlyMatch = !heenHtml && !terugHtml;
    return `<div class="dayCard ${isToday?'today':''} ${matchHtml?'matchDay':''} ${onlyMatch?'matchOnly':''}">
      <div class="dayCardHead">
        <span class="dayBadge">${dayUp(k)}</span>
        <span class="dayCardTitle">${dateLabel}</span>
        ${isToday? '<span class="todayTag">VANDAAG</span>' : ''}
        ${matchHtml? matchTagHtml : ''}
        ${onlyMatch? '' : `<span class="dayTimes">${heenTime||'–'} / ${terugTime||'–'}</span>`}
      </div>
      ${heenHtml}${terugHtml}${matchHtml}
    </div>`;
  });
  // Match rides on days outside Ma–Vr of the planning week (the weekend) get their own card.
  const extraCard = (key)=>{
    const d = matchDateByKey[key];
    const badge = d.toLocaleDateString('nl-NL',{weekday:'short'}).replace('.','');
    const dateLabel = d.toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    const isToday = key===todayStr;
    return `<div class="dayCard matchDay matchOnly ${isToday?'today':''}">
      <div class="dayCardHead">
        <span class="dayBadge">${esc(badge.slice(0,2).toUpperCase())}</span>
        <span class="dayCardTitle">${dateLabel}</span>
        ${isToday? '<span class="todayTag">VANDAAG</span>' : ''}
        ${matchTagHtml}
      </div>
      ${matchRidesFor(d)}
    </div>`;
  };
  const planningMonday = startOfWeek(effectivePlanningDate());
  const extraKeys = Object.keys(matchRidesByDate).filter(k=>!weekdayDates.has(k)).sort((a,b)=>matchDateByKey[a]-matchDateByKey[b]);
  const beforeCards = extraKeys.filter(k=>matchDateByKey[k]<planningMonday).map(extraCard).join('');
  const afterCards = extraKeys.filter(k=>matchDateByKey[k]>=planningMonday).map(extraCard).join('');
  const allDayCards = beforeCards + dayCards.join('') + afterCards;
  const dayCardsHtml = allDayCards || `<p class="muted">Geen dagen met een tijd ingesteld deze week.</p>`;

  const weekMatches = matchesThisWeek(currentMatchList());
  const matchStatusNote = matchesSource==='live'
    ? ''
    : (cachedMatchesAt? `<p class="muted" style="font-size:11px;margin-top:6px">Laatst opgehaald: ${new Date(cachedMatchesAt).toLocaleString('nl-NL')}</p>` : '');
  const matchFailNote = matchFetchFailedTeams.length? `<p class="fitbad" style="font-size:11px;margin-top:6px">Kon niet ophalen: ${esc(matchFetchFailedTeams.map(f=>f.label+' ('+f.error+')').join('; '))}</p>` : '';
  const weekMatchesHtml = weekMatches.length? weekMatches.map(m=>{
    const d = carpoolFor(m).doc;
    const cars = (d && d.cars) || [];
    const carsHtml = cars.length
      ? cars.map(c=>matchCarRowHtml(c,{highlightId:myId})).join('')
      : '<p class="muted" style="font-size:12px;margin:4px 0 0">Nog geen carpool ingesteld.</p>';
    return `<div class="group matchGroup">${matchInfoHtml(m)}${carsHtml}</div>`;
  }).join('') : '<p class="muted">Geen wedstrijden gevonden.</p>';
  const matchesCardHtml = `<div class="card">
    <div class="rowflex" style="align-items:center"><h2 style="margin:0">Wedstrijden deze week</h2>
      <button type="button" class="btn small secondary" data-gomatchcarpool="1">${phIcon('soccer')} Carpool regelen</button></div>
    <div style="margin-top:8px">${weekMatchesHtml}</div>
    ${matchFailNote}${matchStatusNote}
  </div>`;

  // Rides of the daughter that have no car yet — today first, then the rest of the week.
  const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
  const unplannedRows = [];
  DAYS.forEach(([k,label])=>{
    if(dateForWeekday(k) < todayMidnight) return; // days already past
    ['heen','terug'].forEach(direction=>{
      const s = myFam.schedule && myFam.schedule[k] && myFam.schedule[k][direction];
      if(!s) return;
      if(effectiveCars(k,direction).some(c=>(c.girlIds||[]).includes(myId))) return;
      const when = k===todayKey? 'Vandaag' : label;
      unplannedRows.push(`<div class="row"><span><strong>${when}</strong> · ${direction==='heen'?'Heen':'Terug'} (${s}): niet ingepland</span>
        <button type="button" class="btn small" data-gowijzig="${k}">Regelen</button></div>`);
    });
  });
  const unplannedHtml = unplannedRows.length? `<div class="unplacedAlert" role="alert">
      <div class="ttl">${phIcon('warning')} ${esc(myFam.girlName||'Je dochter')} heeft nog geen rit</div>
      ${unplannedRows.join('')}
    </div>` : '';

  box.innerHTML = `
    <div class="heroCard compact">
      <div class="heroText">
        <div class="heroName">${esc(myFam.girlName||'')}</div>
        <p class="heroSub">Ouder: ${esc(myFam.parentName||'')} · ${seats(myFam)} passagiersplekken</p>
      </div>
      <button type="button" class="waIconBtn" id="wa-hero" aria-label="Deel mijn week via WhatsApp" title="Deel via WhatsApp">${WHATSAPP_SVG}</button>
    </div>
    ${unplannedHtml}
    ${dayCardsHtml}
    <div class="legendLine"><span>${phIcon('user')} Rit dochter</span><span>${phIcon('car')} Jouw rijbeurt</span><span>${phIcon('lightning')} Wijziging</span><span>${phIcon('soccer')} Wedstrijdrit</span></div>
    ${matchesCardHtml}
    ${lastUpdateFooter([lastUpdateRooster,lastUpdateDeviation].filter(Boolean).sort((a,b)=>(b.at||0)-(a.at||0))[0])}
  `;
  wireWhatsAppButton('wa-hero', buildMyWeekWhatsAppMessage);
  box.querySelectorAll('[data-gowijzig]').forEach(b=>b.onclick=()=>goToWijzigen(b.dataset.gowijzig));
  box.querySelectorAll('[data-gomatchcarpool]').forEach(b=>b.onclick=()=>goToMatchCarpool());
}

let deviationDay=null;
async function saveDeviationCars(day,direction,cars){
  if(!db){showToast("Geen verbinding met opslag.");return false;}
  // Strip baseGroupId (an internal marker effectiveCars() adds when falling back to the default
  // schedule — it was never meant to be persisted into a deviation document) and any literal
  // `undefined` field, which Firestore's SDK rejects outright with a thrown error.
  const cleanCars = cars.map(c=>{
    const {baseGroupId, ...rest} = c;
    Object.keys(rest).forEach(k=>{ if(rest[k]===undefined) delete rest[k]; });
    return rest;
  });
  try{
    refreshWeekKey();
    await db.doc("deviations/"+deviationKey(day,direction)).set({day,direction,weekKey:currentWeekKey,expiresAt:deviationExpiryMs(),cars:cleanCars});
    lastDeviationEditDay = day;
    recordLastUpdate('Deviation');
    return true;
  }catch(e){ showToast("Opslaan mislukt: "+(e&&e.message||e)); return false; }
}

function plainGirlName(id){ const f=fam(id); return f.girlName||f.parentName||id; }
function plainDriverName(id){ return id? (fam(id).parentName||'?') : 'nog geen chauffeur'; }
function waDayLabel(k){ return dayUp(k)+' '+dateForWeekday(k).getDate(); }
// Generic fallback (used only when no specific day/family context is available).
function buildWhatsAppMessage(){
  // WhatsApp messages are plain text — there's no way to make "Mijn week" itself a hidden
  // hyperlink. The raw link is placed right after it and WhatsApp auto-linkifies it.
  return `Het schema is bijgewerkt voor ${activeDeviationDayLabel()}. Zie Mijn week voor de impact: ${APP_URL}#myweek`;
}
// Mijn week: one line per day for THIS family's daughter —
// "Ma 28 — heen: 07:15 met Jan | terug: 17:30 met Piet"
function buildMyWeekWhatsAppMessage(){
  const myId = myFamilyId();
  const myFam = fam(myId);
  function part(day,direction){
    const s = myFam.schedule && myFam.schedule[day] && myFam.schedule[day][direction];
    if(!s) return '–';
    const car = effectiveCars(day,direction).find(c=>c.girlIds.includes(myId));
    if(!car) return `${s} (nog niet ingepland)`;
    return `${car.departureTime||s} met ${plainDriverName(car.driverFamilyId)}`;
  }
  // Each line gets a sort key (its calendar date) so match rides land right under their own
  // day instead of in a block at the end; weekend matches naturally follow Friday.
  const entries = [];
  DAYS.forEach(([k])=>{
    const sch = myFam.schedule && myFam.schedule[k];
    if(!sch || (!sch.heen && !sch.terug)) return;
    const dev = (activeDeviation(k,'heen')||activeDeviation(k,'terug'))? ' (gewijzigd)' : '';
    const d = dateForWeekday(k); d.setHours(0,0,0,0);
    entries.push({sort:d.getTime(), order:0, text:`${waDayLabel(k)}${dev} — heen: ${part(k,'heen')} | terug: ${part(k,'terug')}`});
  });
  myMatchRides(myId).forEach(r=>{
    const d = new Date(r.doc.startMs);
    const wd = d.toLocaleDateString('nl-NL',{weekday:'short'}).replace('.','');
    const dl = wd.slice(0,2).toUpperCase()+' '+d.getDate();
    const a = analyzeMatch(r.doc.summary||'');
    const dayStart = new Date(d); dayStart.setHours(0,0,0,0);
    // Plain text only (no emoji): WhatsApp's share link doesn't reliably carry them.
    entries.push({sort:dayStart.getTime(), order:1+r.doc.startMs/1e13,
      text:`${dl} — wedstrijd ${matchLabel(r.doc)} vs ${a.opponent}: vertrek ${r.car.departureTime||'?'} met ${plainDriverName(r.car.driverFamilyId)}`});
  });
  entries.sort((x,y)=>x.sort-y.sort || x.order-y.order);
  const lines = entries.map(e=>e.text);
  const header = `Carpool deze week – ${myFam.girlName||myFam.parentName||''}:`;
  return [header, ...(lines.length? lines : ['Geen ritten ingesteld deze week.']), '', `${APP_URL}#myweek`].join('\n');
}
// Dagafwijking: the full (effective) schedule of one day — every car, its driver and passengers.
function buildDayWhatsAppMessage(day){
  const dayLabel = DAYS.find(([k])=>k===day)[1];
  const dateLabel = dateForWeekday(day).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
  function block(direction,title){
    const cars = effectiveCars(day,direction).filter(c=>c.girlIds && c.girlIds.length);
    const carLines = cars.length
      ? [...cars].sort((a,b)=>(a.departureTime||'').localeCompare(b.departureTime||'')).map(c=>
          `• ${c.departureTime||'--:--'} – ${plainDriverName(c.driverFamilyId)}: ${c.girlIds.map(plainGirlName).join(', ')}`)
      : ['• geen ritten'];
    return [`${title}${activeDeviation(day,direction)? ' (aangepast)' : ''}:`, ...carLines].join('\n');
  }
  return [
    `Aangepast schema ${dayLabel} ${dateLabel}:`,
    '',
    block('heen',DIR_TEXT.heen),
    '',
    block('terug',DIR_TEXT.terug),
    '',
    `${APP_URL}#myweek`
  ].join('\n');
}

function attachDeviationHandlers(){
 try{
  document.querySelectorAll('.devDriverSel').forEach(sel=>sel.onchange=async ()=>{
    const {day,direction,caridx}=sel.dataset; const idx=+caridx;
    const cars=effectiveCars(day,direction);
    cars[idx]={...cars[idx], driverFamilyId: sel.value||null};
    await saveDeviationCars(day,direction,cars);
  });
  document.querySelectorAll('.devDeptimeInp').forEach(inp=>inp.onchange=async ()=>{
    const {day,direction,caridx}=inp.dataset; const idx=+caridx;
    const cars=effectiveCars(day,direction);
    cars[idx]={...cars[idx], departureTime: inp.value};
    await saveDeviationCars(day,direction,cars);
  });
  document.querySelectorAll('.devRemoveBtn').forEach(btn=>btn.onclick=async ()=>{
    const {day,direction,caridx,girl}=btn.dataset; const idx=+caridx;
    const cars=effectiveCars(day,direction);
    const newGirlIds=cars[idx].girlIds.filter(id=>id!==girl);
    cars[idx]={...cars[idx], girlIds:newGirlIds, departureTime: computeDepartureTime(day,direction,newGirlIds)};
    const ok = await saveDeviationCars(day,direction,cars);
    if(ok) showToast(girlName(girl)+" verwijderd uit deze auto.");
  });
  document.querySelectorAll('.devSwapSel').forEach(sel=>sel.onchange=async ()=>{
    if(!sel.value) return;
    const {day,direction,caridx,girl}=sel.dataset; const fromIdx=+caridx; const toIdx=+sel.value;
    const cars=effectiveCars(day,direction);
    const newFrom=cars[fromIdx].girlIds.filter(id=>id!==girl);
    const newTo=[...cars[toIdx].girlIds, girl];
    const toSeatsAvail = cars[toIdx].driverFamilyId? seats(fam(cars[toIdx].driverFamilyId)) : null;
    const overfull = toSeatsAvail!=null && newTo.length>toSeatsAvail;
    cars[fromIdx]={...cars[fromIdx], girlIds:newFrom, departureTime: computeDepartureTime(day,direction,newFrom)};
    cars[toIdx]={...cars[toIdx], girlIds:newTo, departureTime: computeDepartureTime(day,direction,newTo)};
    const ok = await saveDeviationCars(day,direction,cars);
    if(ok){
      if(overfull) showToast(`Deze auto zit nu vol (${newTo.length}/${toSeatsAvail}) — verplaatsing is wel doorgevoerd.`, {icon:'warning'});
      else showToast(girlName(girl)+" verplaatst.");
    }
  });
  document.querySelectorAll('.devAddSel').forEach(sel=>sel.onchange=async ()=>{
    if(!sel.value) return;
    const {day,direction,girl}=sel.dataset; const toIdx=+sel.value;
    const cars=effectiveCars(day,direction);
    const newTo=[...cars[toIdx].girlIds, girl];
    const toSeatsAvail = cars[toIdx].driverFamilyId? seats(fam(cars[toIdx].driverFamilyId)) : null;
    const overfull = toSeatsAvail!=null && newTo.length>toSeatsAvail;
    cars[toIdx]={...cars[toIdx], girlIds:newTo, departureTime: computeDepartureTime(day,direction,newTo)};
    const ok = await saveDeviationCars(day,direction,cars);
    if(ok){
      if(overfull) showToast(`Deze auto zit nu vol (${newTo.length}/${toSeatsAvail}) — toevoeging is wel doorgevoerd.`, {icon:'warning'});
      else showToast(girlName(girl)+" toegevoegd.");
    }
  });
  document.querySelectorAll('[data-devreset]').forEach(btn=>btn.onclick=()=>twoStepConfirm(btn,"Zeker? Terug naar standaard rooster",async ()=>{
    const [day,direction]=btn.dataset.devreset.split('|');
    // Written as an empty deviation instead of a delete: activeDeviation() ignores empty `cars`,
    // and deletes of a current-week deviation are refused by firestore.rules until it expires.
    try{ refreshWeekKey(); await db.doc("deviations/"+deviationKey(day,direction)).set({day,direction,weekKey:currentWeekKey,expiresAt:deviationExpiryMs(),cars:[]}); lastDeviationEditDay = day; recordLastUpdate('Deviation'); showToast("Teruggezet naar standaard ✓"); }
    catch(e){ showToast("Mislukt: "+(e&&e.message||e)); }
  }));
 }catch(e){ showToast("Fout bij koppelen knoppen: "+(e&&e.message||e)); }
}

  const body = rows.map(([id,f])=>{
    const cells = DAYS.map(([k])=>{

      const cellFor = (isDefault,isBackup) => isDefault

function renderShiftPriorityRows(shiftKeyVal){
  const div=document.getElementById('shiftPriorityRows');
  if(!div) return;
  const [day,direction]=shiftKeyVal.split('_');
  const rows = sortByShiftPriority(day,direction, availableDrivers(day,direction));
  if(!rows.length){ div.innerHTML=`<p class="muted">Geen beschikbare chauffeurs voor deze shift.</p>`; return; }
  div.innerHTML = rows.map(([id,f],i)=>`
    <div class="rowflex" style="padding:8px 6px;border-bottom:1px solid var(--border)">
      <span>${i+1}. ${esc(f.parentName||'?')} <span class="muted">(${esc(f.girlName||'')}, ${seats(f)} pl.)</span></span>
      <span style="display:flex;gap:4px">
        <button type="button" class="iconbtn" data-prioup="${id}" aria-label="${esc(f.parentName||'chauffeur')} hoger in prioriteit" ${i===0?'disabled':''}>${phIcon('arrow-up')}</button>
        <button type="button" class="iconbtn" data-priodown="${id}" aria-label="${esc(f.parentName||'chauffeur')} lager in prioriteit" ${i===rows.length-1?'disabled':''}>${phIcon('arrow-down')}</button>
      </span>
    </div>`).join('');
  const ids=rows.map(([id])=>id);
  div.querySelectorAll('[data-prioup]').forEach(btn=>btn.onclick=()=>movePriority(shiftKeyVal,ids,btn.dataset.prioup,-1));
  div.querySelectorAll('[data-priodown]').forEach(btn=>btn.onclick=()=>movePriority(shiftKeyVal,ids,btn.dataset.priodown,1));
}
async function movePriority(shiftKeyVal,ids,id,delta){
  const idx=ids.indexOf(id);
  const newIdx=idx+delta;
  if(newIdx<0||newIdx>=ids.length) return;
  const newIds=[...ids];
  [newIds[idx],newIds[newIdx]]=[newIds[newIdx],newIds[idx]];
  const map={}; newIds.forEach((gid,i)=>map[gid]=i+1);
  if(!db){showToast("Geen verbinding met opslag.");return;}
  try{ await db.doc("settings/priority").set({...shiftPriority,[shiftKeyVal]:map}); showToast("Volgorde opgeslagen ✓"); }
  catch(e){ showToast("Mislukt: "+(e&&e.message||e)); }
}

async function seedFromPdf(){
  if(!db){showToast("Geen verbinding met opslag.");return;}
  const msg=document.getElementById('seedMsg');
  if(msg) msg.textContent="Bezig met wissen…";
  try{
    const famSnap = await db.collection("families").get();
    await Promise.all(famSnap.docs.map(d=>db.doc("families/"+d.id).delete()));
    const grpSnap = await db.collection("groups").get();
    await Promise.all(grpSnap.docs.map(d=>db.doc("groups/"+d.id).delete()));
    if(msg) msg.textContent="Bezig met invullen…";
    const emptyAvail={heen:false,terug:false,backupHeen:false,backupTerug:false};
    await Promise.all(PDF_SEED.map(g=>{
      const availability={}; DAYS.forEach(([k])=>availability[k]={...emptyAvail});
      return db.doc("families/"+slugify(g.girlName)).set({
        parentName:"Ouder van "+g.girlName, girlName:g.girlName, capacity:4, schedule:g.schedule, availability
      });
    }));
    const check = await db.collection("families").get();
    const docs = check.docs.map(d=>d.data());
    let ok = docs.length===8; let details=[];
    docs.forEach(f=>{
      DAYS.forEach(([k])=>{
        const has = f.schedule && f.schedule[k] && f.schedule[k].heen && f.schedule[k].terug;
        const expectMissing = (f.girlName==='Robbin' && k==='Wo');
        if(expectMissing && has) {ok=false; details.push(f.girlName+" "+k+" had wel een tijd (onverwacht)");}
        if(!expectMissing && !has){ok=false; details.push(f.girlName+" "+k+" mist een tijd");}
      });
    });
    if(msg) msg.innerHTML = ok
      ? `${phIcon('check-circle')} Klaar: ${docs.length} gezinnen aangemaakt, alle dagen ingevuld behalve Robbin/Woensdag (zoals verwacht).`
      : `${phIcon('warning')} ${docs.length} gezinnen aangemaakt, maar validatie vond afwijkingen: ${esc(details.join('; '))}`;

// ---------- Rooster tab ----------
function girlsFor(day,direction){
  return Object.entries(families).filter(([id,f])=>f.schedule && f.schedule[day] && f.schedule[day][direction]);
}
function groupsFor(day,direction){
  return Object.entries(groups).filter(([id,g])=>g.day===day && g.direction===direction);
}
function alreadyGrouped(day,direction){
  const ids=new Set();
  groupsFor(day,direction).forEach(([id,g])=>g.girlIds.forEach(gid=>ids.add(gid)));
  return ids;
}
function eligibleDrivers(day,direction,count){
  return sortByShiftPriority(day,direction, Object.entries(families).filter(([id,f])=>
    isAvailable(f,day,direction) && seats(f)>=count
  ));
}
function availableDrivers(day,direction){
  return Object.entries(families).filter(([id,f])=> isAvailable(f,day,direction));
}
// timeToMinutes/minutesToTime/computeDepartureTime/planClusters/planPrimaryOption/planOptions
// are now thin wrappers around the tested, standalone planning.js module (see that file's
// own test suite — planning.test.js — for the actual algorithm's correctness guarantees).
function timeToMinutes(t){ return pureTimeToMinutes(t); }
function minutesToTime(min){ return pureMinutesToTime(min); }
function computeDepartureTime(day,direction,girlIds){
  const minutesList = girlIds.map(id=>pureTimeToMinutes(fam(id).schedule[day] && fam(id).schedule[day][direction]));
  return pureComputeDepartureTime(direction, minutesList, settings.travelLeadMinutes||60);
}
function planClusters(day,direction,list){
  const girlsInput = list.map(([id,f])=>({id, min: pureTimeToMinutes(f.schedule[day][direction])}));
  const driverSeats = availableDrivers(day,direction).map(([id,f])=>seats(f));
  const togetherRules = (prefs.rules||[]).filter(r=>r.type==='together');
  const preferRules = (prefs.rules||[]).filter(r=>r.type==='prefer');
  const gapLimitMinutes = (settings.gapThresholdHours||3)*60;
  const prefWindowMinutes = settings.prefWindowMinutes!=null? settings.prefWindowMinutes : 30;
  return pureplanClusters({ girls: girlsInput, driverSeats, gapLimitMinutes, togetherRules, preferRules, prefWindowMinutes });
}
function planPrimaryOption(day,direction,list){
  const clusters = planClusters(day,direction,list);
  if(!clusters.length) return null;
  const priorityDrivers = sortByAvailabilityTier(day,direction, availableDrivers(day,direction))
    .map(([id,f])=>({id, seats: seats(f)}));
  const assignment = planPrimaryAssignment(clusters, priorityDrivers);
  if(!assignment) return null;
  const label = assignment.map(a=>esc(fam(a.driverId).parentName)).join(' &amp; ');
  return {label, assignment};
}
function planOptions(day,direction,list){
  const clusters = planClusters(day,direction,list);
  const availForAlts = availableDrivers(day,direction).map(([id,f])=>({id, seats: seats(f)}));
  const rawAlts = planAlternativeAssignments(clusters, availForAlts);
  let opts = rawAlts.map(assignment=>({
    label: assignment.map(a=>esc(fam(a.driverId).parentName)).join(' &amp; '),
    assignment
  }));
  opts.sort((a,b)=>{
    const pa=a.assignment.reduce((s,x)=>s+shiftPriorityOf(day,direction,x.driverId),0);
    const pb=b.assignment.reduce((s,x)=>s+shiftPriorityOf(day,direction,x.driverId),0);
    return pa-pb;
  });
  const primary = planPrimaryOption(day,direction,list);
  if(primary){
    const key=a=>a.assignment.map(x=>x.driverId).sort().join('+');
    opts = opts.filter(o=>key(o)!==key(primary));
    opts.unshift(primary);
  }
  return opts;
}
async function createGroupWithDriver(day,direction,girlIds,driverId,extraExclude=[]){
  if(!db){showToast("Geen verbinding met opslag.");return;}
  const alreadyDriving = groupsFor(day,direction).map(([gid,g])=>g.driverFamilyId).filter(Boolean);
  const exclude = new Set([driverId, ...alreadyDriving, ...extraExclude]);
  const reserveIds = eligibleDrivers(day,direction,girlIds.length).map(([id])=>id).filter(id=>!exclude.has(id));
  const gid=`${day}_${direction}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
  const departureTime=computeDepartureTime(day,direction,girlIds);
  try{ await db.doc("groups/"+gid).set({day,direction,girlIds,driverFamilyId:driverId||null,reserveFamilyIds:reserveIds,departureTime}); recordLastUpdate('Rooster'); }
  catch(e){showToast("Kon groep niet opslaan (alleen coördinator kan bewerken): "+(e&&e.message||e));}
}
async function useOption(day,direction,assignment){
  const usedDrivers = assignment.map(a=>a.driverId).filter(Boolean);
  for(const a of assignment){ await createGroupWithDriver(day,direction,a.girlIds,a.driverId, usedDrivers.filter(id=>id!==a.driverId)); }
}
async function createGroupCustom(day,direction,ids){
  if(!ids.length){showToast("Selecteer minstens 1 dochter.");return;}
  const eligible=eligibleDrivers(day,direction,ids.length);
  await createGroupWithDriver(day,direction,ids, eligible[0]?eligible[0][0]:null);
}

// Girls with a time on this day/direction who are in no car. mode 'week' = this week's real
// rides (Wijzigingen applied); 'standard' = the standard schedule.
function unplacedFor(day,direction,mode){
  const cars = mode==='week'? effectiveCars(day,direction) : groupsFor(day,direction).map(([,g])=>g);
  const placed = new Set(cars.flatMap(c=>c.girlIds||[]));
  return girlsFor(day,direction).filter(([id])=>!placed.has(id));
}

    ? effectiveCars(day,d).filter(c=>(c.girlIds||[]).length).length
    : groupsFor(day,d).length), 0);
}

function renderDay(day,label){
  const mode = roosterMode;
  const un = ['heen','terug'].map(d=>[d, unplacedFor(day,d,mode)]).filter(([,l])=>l.length);
  const total = un.reduce((n,[,l])=>n+l.length,0);

      }).join('')}

  return `<div class="daysection"><h3>${label}</h3>
    ${alertHtml}
    ${renderDirection(day,'heen')}

function renderDirection(day,direction){

}
// ---------- Tap-to-WhatsApp (Rooster "Deze week") ----------
// wa.me wants the number in international format, digits only: 06-12345678 -> 31612345678.
function waPhone(p){
  let d = normalizePhone(p);             // Dutch numbers normalised to 06…
  if(!d) return '';
  if(d.startsWith('00')) return d.slice(2);  // other international numbers: 0044… -> 44…
  if(d.startsWith('0')) return '31'+d.slice(1);
  return d;
}
const WA_ICON_SMALL = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#25D366"/><path fill="#fff" d="M12 5.5a6.5 6.5 0 0 0-5.6 9.8L5.5 18.5l3.3-.9A6.5 6.5 0 1 0 12 5.5zm0 1.2a5.3 5.3 0 1 1 0 10.6 5.2 5.2 0 0 1-2.7-.7l-.2-.1-2 .5.5-1.9-.1-.2A5.3 5.3 0 0 1 12 6.7z"/></svg>`;
// A parent's name as a WhatsApp link to their Tel.nr. 1 with a pre-filled message; plain text
// when no Tel.nr. 1 is set (nothing to link to).
function waNameHtml(familyId, text){
  const f = fam(familyId);
  const name = esc(f.parentName||'?');
  const num = waPhone(f.parentPhone1);
  if(!num) return name;
  const href = 'https://wa.me/'+num+'?text='+encodeURIComponent(text);
  return `<a class="waLink" href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp ${name}">${name}${WA_ICON_SMALL}</a>`;
}
// "maandag 28 september" for a weekday key in the current planning week.
function waDayDate(day){ return dateForWeekday(day).toLocaleDateString('nl-NL',{weekday:'long', day:'numeric', month:'long'}); }
function reserveAskText(day,direction,time){
  return `Hi! Zou jij de rit ${direction==='heen'?'heen':'terug'} van ${waDayDate(day)} om ${time||'?'} kunnen doen?`;
}
function driverAskText(day,time){
  return `Hi! Je rijdt de rit van ${waDayDate(day)} om ${time||'?'}. `;
}
// Reserve drivers are a TRIP-wide backup pool, shown once per trip: everyone available for this
// trip (standaard or back-up) who isn't already driving it and has room for at least the
// SMALLEST car of the trip, so they could take over at least one of the rides.
// (Previously the LARGEST car's size was required, which hid every reserve on trips with one
// big car — e.g. a 5- or 6-passenger car — even when 4-seat back-ups could cover the other car.)
function tripReserveIds(day,direction,cars){
  const sizes = cars.map(c=>(c.girlIds||[]).length).filter(n=>n>0);
  if(!sizes.length) return [];
  const smallest = Math.min(...sizes);
  const assigned = new Set(cars.map(c=>c.driverFamilyId).filter(Boolean));
  return eligibleDrivers(day,direction,smallest).map(([id])=>id).filter(id=>!assigned.has(id));
}
// withWhatsApp: names become WhatsApp links asking to take over `askTime`'s ride ("Deze week").
function tripReserveHtml(day,direction,cars,withWhatsApp,askTime){
  const ids = tripReserveIds(day,direction,cars);
  if(!ids.length) return '';
  const names = ids.map(id=> withWhatsApp? waNameHtml(id, reserveAskText(day,direction,askTime)) : esc(fam(id).parentName));
  return `<div class="tripReserve">Reserve: ${names.join(', ')}</div>`;
}
function neededTimesHtml(day,direction,girlIds){

  const range = `${times[0]||'?'}${times[times.length-1]!==times[0]?'–'+times[times.length-1]:''}`;
  return `<div class="subtime">${direction==='heen'? `Aankomst Alkmaar nodig: ${range}` : `Klaar om op te halen: ${range}`}</div>`;
}
function driverLineHtml(driverId,myId,wa){

}

function renderDirectionWeek(day,direction){

name: Robot browsers (Playwright)
description: >-
  Installs Playwright with Chromium and WebKit (the Safari engine) for scripts/smoke-test.mjs. The downloaded browsers are cached per Playwright
  version, so only the first run (and a run after a version bump) downloads them. The version lives here and nowhere else.
runs:
  using: composite
  steps:
    - name: Restore the downloaded browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-1.61.0-chromium-webkit
    - name: Install the robot browsers (Chromium and WebKit, the Safari engine)
      shell: bash
      run: |
        npm install --no-save --no-package-lock playwright@1.61.0
        npx playwright install --with-deps chromium webkit

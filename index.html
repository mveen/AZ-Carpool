<meta charset="UTF-8">

<title>AZ Carpool Aalsmeer</title>
<style>
/* Fonts are served from ./fonts (self-hosted, no request to Google). Latin subset only. */
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/plus-jakarta-sans-v12-latin-regular.woff2') format('woff2');}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:swap;src:url('./fonts/plus-jakarta-sans-v12-latin-500.woff2') format('woff2');}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/plus-jakarta-sans-v12-latin-600.woff2') format('woff2');}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/plus-jakarta-sans-v12-latin-700.woff2') format('woff2');}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:swap;src:url('./fonts/plus-jakarta-sans-v12-latin-800.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/jetbrains-mono-v24-latin-600.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/jetbrains-mono-v24-latin-700.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:800;font-display:swap;src:url('./fonts/jetbrains-mono-v24-latin-800.woff2') format('woff2');}
/* ============================================================
   Design tokens — AZ Carpool Aalsmeer Design System v2.0.0
   ============================================================ */
:root{
  /* AZ brand */
  --az-red:#dc2626; --az-red-dark:#991b1b; --az-red-light:#fee2e2; --az-red-muted:#991b1b;
  /* fonts */
  --font-sans:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  /* radius scale */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:9999px;
  /* shadow */
  --shadow-card:0 2px 8px rgba(15,23,42,0.06);

  /* Light mode surface tokens */
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#586a80; --border:#e2e8f0;
  --control-border:#748399;   /* edges of inputs/selects/buttons: >= 3:1 on page and card */
  --accent-text:#b91c1c;      /* red TEXT on tinted or dark surfaces: >= 4.5:1. The brand red is for fills only. */
  color-scheme:light;
  --accent:var(--az-red); --accent2:var(--az-red-light);
  /* Color language: green = ok / you're driving · amber = a change · neutral = labels.
     --ok and --warn-text are dark enough for small text (>= 4.5:1 on white and on their tints). */
  --ok:#047857; --ok2:#d1fae5; --warn:#d97706; --warn2:#fef3c7; --warn-text:#92400e;
  --danger:#b91c1c;
  --backup:#64748b; --info:#2563eb; --info2:#dbeafe; --pill:#334155; --pill2:#f1f5f9;

  /* Bottom safe-area inset, used everywhere via var(--sab). Firefox for Android reports the
     gesture-bar inset even in a normal browser tab, where its own toolbar already covers that
     area, so the inset got added twice (white gap under the nav). The <head> script sets
     .no-bottom-inset in exactly that case (Firefox Android, not installed), making it 0. */
  --sab:env(safe-area-inset-bottom,0px);

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:var(--sab);
}
:root.no-bottom-inset{--sab:0px}
:root[data-theme="dark"]{
  --bg:#020617; --card:#0f172a; --text:#f8fafc; --muted:#94a3b8; --border:#334155;
  --control-border:#64748b; --accent-text:#fca5a5; color-scheme:dark;
  --shadow-card:0 0 0 1px rgba(148,163,184,.08),0 4px 12px rgba(0,0,0,.45);
  --accent:var(--az-red); --accent2:#3a1414;
  --ok:#34d399; --ok2:#0f2b21; --warn:#fbbf24; --warn2:#3a2e0f; --warn-text:#fbbf24;
  --backup:#94a3b8; --info:#60a5fa; --info2:#122036; --pill:#cbd5e1; --pill2:#1e293b;
  --danger:#f87171;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overflow:hidden}
/* ---------- Flex-shell layout (deliberately NOT position:fixed for header/nav) ----------
   Firefox for Android has a confirmed, still-open bug where position:fixed elements ride up
   and down with the page during its own dynamic address-bar show/hide animation, then "snap"
   back (Mozilla bugzilla #1760924, #1712280, and others — still reproducing in current Firefox
   versions as of this writing). The robust fix is architectural, not a CSS value tweak: make
   header/nav normal flex children of a 100dvh column instead of fixed overlays, with ONLY the
   middle content area scrolling internally. Since nothing here is fixed anymore, Firefox's
   buggy fixed-position-during-toolbar-transition code path never gets involved at all. */
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#topbar{flex-shrink:0}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:linear-gradient(135deg,var(--az-red),var(--az-red-dark));color:#fff}
header h1{margin:0;font-size:20px;font-weight:800;white-space:nowrap}
header p{margin:2px 0 0;font-size:12px;opacity:.95}
#themeToggle,#helpToggle{width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;font-size:18px;padding:0}
/* Help panel ("?" in the header) */
.helpOverlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.helpPanel{background:var(--card);color:var(--text);width:100%;max-width:520px;height:88vh;max-height:88dvh;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:16px 16px calc(16px + var(--sab));box-shadow:0 -6px 24px rgba(0,0,0,.2);display:flex;flex-direction:column}
.helpTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.helpTop h2{margin:0;font-size:18px;font-weight:800}
.helpClose{width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:0}
.helpSearchLabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.helpSearch{width:100%;box-sizing:border-box;min-height:48px;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text)}
.helpBody{flex:1;overflow-y:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.helpHead{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.helpItem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font:inherit;font-size:14px;cursor:pointer;min-height:48px}
.helpBack{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.helpTitle{margin:4px 0 8px;font-size:17px;font-weight:800}
.helpP{margin:0 0 10px;font-size:14px;line-height:1.5}
.helpLine{padding-left:6px}
.helpGo{width:100%;margin-top:6px}
.helpContact,.helpEmpty{font-size:13px;margin-top:14px}
/* ---------- Bottom tab bar (flex item, safe-area aware, thumb-reachable) ---------- */
#bottomnav{flex-shrink:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:var(--sab);height:calc(56px + var(--sab));box-sizing:border-box}
.navtab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;padding:0;height:56px;cursor:pointer;color:var(--muted);position:relative}
.navtab .navicon{font-size:19px;line-height:1}
.navtab .navicon svg{width:22px;height:22px}
.navtab .navicon .ph-fill{display:none}
.navtab.active .navicon .ph-regular{display:none}
.navtab.active .navicon .ph-fill{display:inline}
.navtab .navlabel{font-size:12px;font-weight:600;white-space:nowrap}
.navtab.active{color:var(--accent-text)}
.navtab.active .navlabel{font-weight:700}
.navbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-full);background:var(--accent);color:#fff;font-size:12px;font-weight:800;line-height:18px;text-align:center}
.card.timeChangeCard{border-color:var(--warn);border-left:4px solid var(--warn)}
.timeChangeFam{padding:8px 0;border-top:1px solid var(--border)}
.timeChangeFam:first-of-type{border-top:none}
.timeChangeLine{font-size:14px;font-family:var(--font-mono);margin-top:2px}
.navtab.active::after{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:var(--radius-full);background:var(--accent)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;max-width:760px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.card h2{margin:0 0 10px;font-size:16px;font-weight:800}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:16px;min-height:28px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex-shrink:0;margin-right:4px}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold[open]>summary{margin-bottom:10px}
details.group.fold>summary{font-size:15px}
/* Melding voor iedereen: dunne gele balk bovenaan (alle gebruikers) + kaart in Beheer. Geen knop, dus ruim lager dan de testbalk. */
.noticeBar{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--warn2);color:var(--warn-text);padding:4px 12px;font-size:12px;line-height:1.35;font-weight:600;border-bottom:1px solid var(--border);text-align:center}
.noticeBar svg{flex-shrink:0}
.noticeBar span{min-width:0;overflow-wrap:anywhere}
.noticePreview{border:1px dashed var(--control-border);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg)}
.noticeCount{text-align:right;font-size:12px;margin-top:3px}
.switchRow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:700;color:var(--text);margin:4px 0}
input.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;min-height:0;border-radius:15px;background:var(--control-border);border:none;position:relative;cursor:pointer;flex-shrink:0;padding:0;margin:0;transition:background .15s}
input.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
input.switch:checked{background:var(--ok)}
input.switch:checked::after{left:25px}
input.switch:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.noticeChip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.noticeChip.ok{background:var(--ok2);color:var(--ok)}
.noticeChip.off{background:var(--pill2);color:var(--muted);border:1px solid var(--border)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=tel],input[type=number],select{width:100%;padding:9px 8px;border:1px solid var(--control-border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:14px;min-height:44px;font-family:var(--font-sans)}
input[type=time],input[type=date]{padding:8px 7px;border:1px solid var(--control-border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:14px;width:100%;min-height:44px;font-family:var(--font-mono);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid5>button{min-width:0;padding:8px 4px;font-size:12px;white-space:normal;word-break:break-word;line-height:1.2}
/* ---------- Mijn gezin: day tabs, capacity stepper, drive-toggle buttons ---------- */
.dayTabBtn{min-width:0;padding:10px 2px;font-size:14px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;min-height:44px}
.dayTabBtn.active{background:var(--card);color:var(--accent-text);border-color:var(--accent)}
.dayFormCard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-top:8px}
.stepperCard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-top:6px}
.stepperInfo{display:flex;align-items:center;gap:10px}
.stepperInfo svg{width:22px;height:22px;color:var(--accent);flex-shrink:0}
.stepperTitle{font-size:14px;font-weight:700}
.stepperSub{font-size:12px;color:var(--muted)}
.stepperControls{display:flex;align-items:center;gap:10px;flex-shrink:0}
.stepperBtn{width:44px;height:44px;border-radius:var(--radius-sm);border:1px solid var(--control-border);background:var(--card);color:var(--text);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.stepperValue{font-size:16px;font-weight:800;font-family:var(--font-mono);min-width:1.5em;text-align:center}
.driveToggleInput{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.driveToggleGroup{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.driveToggleBtn{display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--radius-md);border:1px solid var(--control-border);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;min-height:44px;color:var(--text)}
.driveToggleCheck{width:18px;height:18px;border-radius:5px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg)}
.driveToggleCheck svg{width:12px;height:12px;color:transparent}
/* Back-up keeps its own look (blue, dashed, round box) so it never reads as "Beschikbaar",
   but shows a real check mark when selected, just like Beschikbaar does. */
.driveToggleBtn-backup .driveToggleCheck{border-style:dashed;border-radius:50%}
.driveToggleInput:checked+.driveToggleBtn-standard{border-color:var(--ok);background:var(--ok2);color:var(--ok)}
.driveToggleInput:checked+.driveToggleBtn-standard .driveToggleCheck{background:var(--ok);border-color:var(--ok)}
.driveToggleInput:checked+.driveToggleBtn-standard .driveToggleCheck svg{color:#fff}
.driveToggleInput:checked+.driveToggleBtn-backup{border-color:var(--info);background:var(--info2);color:var(--info)}
.driveToggleInput:checked+.driveToggleBtn-backup .driveToggleCheck{background:var(--info);border-color:var(--info);border-style:solid}
.driveToggleInput:checked+.driveToggleBtn-backup .driveToggleCheck svg{color:#fff}
.driveToggleInput:focus-visible+.driveToggleBtn{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:var(--muted)}
.chk input{min-height:18px}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;min-height:44px;font-family:var(--font-sans)}
button.btn.secondary{background:var(--pill2);color:var(--text);border:1px solid var(--control-border)}
button.btn.small{padding:8px 14px;font-size:14px;margin:0;min-height:44px;min-width:44px}
button.btn:disabled{opacity:.35;cursor:default}
/* Button roles: primary = solid red (.btn) · destructive = red outline + red text (.danger)
   · everything else = secondary (.btn.secondary). */
button.btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--danger)}
.iconbtn.danger{color:var(--danger);border-color:var(--danger);display:inline-flex;align-items:center;justify-content:center;background:var(--card)}
.linkbtn{background:none;border:none;padding:8px 0;min-height:44px;display:inline-flex;align-items:center;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--danger)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center}
.iconbtn:disabled{opacity:.35;cursor:default}
/* Neutral direction label: "Heen · Aalsmeer → Alkmaar" */
.dirLabel{display:inline-flex;align-items:center;gap:6px;background:var(--pill2);color:var(--pill);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full)}
.shiftLoc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;font-weight:700}
.shiftLoc .shiftLocText{flex:1;min-width:0}
.shiftLocBtn{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:6px 10px;margin-left:-10px;border:1px dashed var(--border);border-radius:var(--radius-full);background:transparent;color:inherit;font:inherit;font-weight:700;text-align:left;cursor:pointer}
.shiftLocBtn svg{width:14px;height:14px;flex:none}
.devFree{margin-top:6px}
.addrHint{margin:4px 0 0;font-size:12px;color:var(--muted)}
a.geoLink{color:inherit;text-decoration:underline;text-underline-offset:2px}
.matchDist{font-size:12px;color:var(--muted)}
.ovBtn{margin-top:8px}
.changedTag{display:inline-flex;align-items:center;gap:4px;background:var(--warn2);color:var(--warn-text);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full)}
/* Shared small square badge: weekday in Mijn week and the car number in Rooster */
.dayBadge{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--pill2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.dayBadge.accent{background:var(--accent);color:#fff}
/* Segmented control (Rooster: Deze week / Standaardrooster) */
.segmented{display:flex;width:fit-content;max-width:100%;margin:0 auto 12px;background:var(--pill2);border-radius:var(--radius-full);padding:3px}
.segmented button{flex:0 1 auto;border:none;background:none;padding:8px 18px;border-radius:var(--radius-full);font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px}
.segmented button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow-card)}
/* Alert for rides without a car */
.unplacedAlert{background:var(--accent2);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px;color:var(--text)}
.unplacedAlert .ttl{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--danger)}
.unplacedAlert .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(185,28,28,.2);font-size:14px}
.unplacedAlert .row:first-of-type{border-top:none}
/* Bottom sheet (Rooster: tap a passenger to move her) */
.sheetOverlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:520px;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:16px 16px calc(16px + var(--sab));box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sheet .sheetItem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg);color:var(--text);font:inherit;font-size:14px;cursor:pointer;min-height:48px}
.sheet .sheetItem .sub{font-size:12px;color:var(--muted)}
/* ---------- Day-pill carousel (Rooster) ---------- */
.daypills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
.daypill{flex:0 0 auto;min-width:64px;min-height:48px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;padding:6px 10px;position:relative;font-family:var(--font-sans)}
.daypill .daypillTop{display:block;font-size:12px;font-weight:800}
.daypill .daypillSub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.daypill.active{background:var(--accent);border-color:var(--accent)}
.daypill.active .daypillTop{color:#fff}
.daypill.active .daypillSub{color:#fff}
.daypill .daypillToday{position:absolute;top:5px;left:7px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.daypill.active .daypillToday{background:#fff}
.daypill .daypillAlert{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-full);background:var(--danger);color:#fff;font-size:12px;font-weight:800;line-height:16px;text-align:center;border:2px solid var(--bg)}
.daypills{padding-top:8px;padding-right:8px}
/* Mon–Fri pills: 5 equal columns, always fit the screen (period pills keep wrapping) */
.daypills:not(.periodPills){display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;overflow:visible;padding-right:6px}
.daypills:not(.periodPills) .daypill{min-width:0;padding:6px 2px}
.daypills:not(.periodPills) .devDayDot{right:4px}
.daysection>h3{font-size:14px;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:4px;font-weight:800}
.group{border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin:10px 0;background:var(--card);box-shadow:var(--shadow-card)}
/* A coloured left stripe means STATUS only. A plain car (.confirmed) has none, like a Mijn week day card. */
.group.suggestion{border-left:4px solid var(--ok)}
.group.suggestion.primary{border-left:4px solid var(--ok);background:var(--ok2)}
.group.warning{border-left:4px solid var(--warn)}
.group .dir{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.group .time{font-size:18px;font-weight:800;font-family:var(--font-mono)}
.group .subtime{font-size:12px;color:var(--muted)}
.pill{display:inline-block;background:var(--pill2);color:var(--pill);border-radius:var(--radius-full);padding:5px 11px;font-size:12px;font-weight:600;margin:2px 3px 0 0;border:1px solid transparent;font-family:var(--font-sans)}
.pill.mine{background:var(--accent2);color:var(--danger);border-color:var(--accent);font-weight:800}
button.pill{cursor:pointer;min-height:44px}
button.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.driver{color:var(--text);font-weight:600;font-size:14px;margin-top:6px;display:flex;align-items:center;gap:6px}
.driver.me{color:var(--ok);font-weight:800}
.driver select{flex:1;min-height:44px;font-weight:600}
.cap{font-size:12px;color:var(--muted);font-weight:600}
.capbadge{display:inline-block;background:var(--pill2);color:var(--pill);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full);white-space:nowrap}
.group.mineDriving{border-left:4px solid var(--ok)}
.timeBig{font-size:18px!important;font-weight:800;font-family:var(--font-mono);width:auto!important;min-height:44px!important;padding:4px 8px!important}
.tripReserve{font-size:12px;color:var(--muted);margin:2px 0 10px 2px}
/* Tap-to-WhatsApp names (Rooster "Deze week": chauffeur + reserve) */
a.waLink{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;display:inline-flex;align-items:center;gap:3px;min-height:24px}
a.waLink:hover{text-decoration-style:solid}
a.waIntro{display:inline-flex;flex-shrink:0;min-width:32px;min-height:32px;align-items:center;justify-content:center}
a.waIntro[hidden]{display:none}
a.waIntro svg{width:26px;height:26px}
a.waLink svg{width:13px;height:13px;flex-shrink:0}
.reserve{font-size:12px;color:var(--muted);margin-top:4px}
.girlchk{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;background:var(--ok2);color:var(--ok);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full)}
.badge.rec{background:var(--info2);color:var(--info);font-weight:700}   /* COÖRDINATOR / AANBEVOLEN: not an alert, so not red */
.rowflex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fitok{color:var(--ok);font-size:12px;margin-top:4px;font-weight:700}
.fitbad{color:var(--warn-text);font-size:12px;margin-top:4px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:12px}
table.avail{width:100%;border-collapse:collapse;font-size:12px}
table.avail th,table.avail td{padding:6px 4px}
.dayBlock{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden}
.dayBlockHead{padding:10px 12px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);background:var(--card)}
.dayBlockHead .sumInfo{font-weight:400;color:var(--muted);font-size:12px}
.dayDetailsBody{padding:10px 12px}
.iconbtn{background:none;border:1px solid var(--control-border);border-radius:var(--radius-sm);min-width:44px;min-height:44px;font-size:14px;cursor:pointer;color:var(--text)}
.availStd{display:inline-block;min-width:22px;padding:2px 4px;border-radius:6px;background:var(--ok);color:#fff;font-weight:800}
:root[data-theme="dark"] .availStd{color:#022c22}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
/* ---------- Mijn week hero card ---------- */
.heroCard{background:linear-gradient(135deg,var(--az-red),var(--az-red-dark));border-radius:var(--radius-xl);padding:18px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow-card)}
/* Compact hero: one row — daughter + parent on the left, WhatsApp icon button on the right */
.heroCard.compact{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;margin-bottom:12px;border-radius:var(--radius-lg)}
.heroCard.compact .heroText{flex:1;min-width:0;align-self:center;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.heroCard.compact .heroName{font-size:16px;font-weight:800;margin:0;flex-shrink:0}
.heroCard.compact .heroSub{font-size:12px;color:#fff;opacity:.95;margin:0;overflow:hidden;text-overflow:ellipsis}
.waIconBtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;padding:0}
.waIconBtn svg{margin:0!important;width:26px;height:26px}
.legendLine{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:0 2px 12px}
.legendLine span{display:inline-flex;align-items:center;gap:4px}
.heroCard .heroTag{display:inline-block;background:rgba(255,255,255,.2);border-radius:var(--radius-full);padding:4px 10px;font-size:12px;font-weight:800;letter-spacing:.04em}
.heroCard .heroName{font-size:20px;font-weight:800;margin:10px 0 2px}
.heroCard .heroSub{font-size:12px;color:var(--az-red-light);margin:0}
.heroCard .heroLegend{border-top:1px solid rgba(255,255,255,.2);margin-top:14px;padding-top:10px;font-size:12px;font-weight:600;display:flex;flex-wrap:wrap;gap:10px}
.heroCard #wa-hero{background:#fff;color:var(--az-red-dark);border:none;margin-top:12px}
.dayCard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px;box-shadow:var(--shadow-card)}
.dayCard.today{border:2px solid var(--accent)}
.dayCard .dayCardHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dayCard .dayBadge{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--pill2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.dayCard.today .dayBadge{background:var(--accent);color:#fff}
.dayCard .dayCardTitle{font-size:14px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayCard .todayTag{display:inline-flex;align-items:center;background:var(--accent2);color:var(--accent-text);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full)}
.dayCard .dayTimes{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.subride{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 10px;margin-top:6px}
.subride.driving{border-color:var(--ok);border-width:2px}
.subride .subrideHead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.subride .subrideDep{font-family:var(--font-mono);color:var(--text);font-weight:700}   /* neutral: red is for brand, today and destructive actions */
.subride .subrideStatus{font-size:12px;color:var(--muted);margin-top:3px}
/* You drive: the same green chip everywhere (own car, second car, match ride), and a green border on the ride. */
.subride .subrideStatus.driving{display:flex;width:fit-content;align-items:center;gap:6px;background:var(--ok);color:#fff;font-weight:700;padding:3px 10px;border-radius:var(--radius-full)}
:root[data-theme="dark"] .subride .subrideStatus.driving{color:#022c22}
.subride.matchRide .subrideStatus.driving{color:#fff}
:root[data-theme="dark"] .subride.matchRide .subrideStatus.driving{color:#022c22}
/* No driver yet: amber warning chip */
.statusChip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-full);font-weight:700}
.statusChip.warn{background:var(--warn2);color:var(--warn-text);border:1px solid var(--warn)}
.subride.unplanned{border-color:var(--danger);border-width:2px;background:var(--accent2)}
.subride .subrideStatus.unplanned{color:var(--danger);font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px}
.subride .subrideStatus.changed{color:var(--warn-text);font-weight:600}
/* ---------- Dagafwijking (amber "warning" theme) ---------- */
.dayCoordBar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:12px;font-size:14px}
.dayCoordBar>span{flex:1;min-width:0}
.dayCoordBar.you{background:var(--accent2);color:var(--accent-text);font-weight:700}
.dayCoordWa{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0}
.dayCoordWa svg{width:28px;height:28px}
.conclusieCard.forYou{border:2px solid var(--az-red)}
.conclusiePreview{white-space:pre-wrap;background:var(--bg,#f6f6f6);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;font-size:14px;margin:8px 0}
.oneOnOneHint{font-size:12px;color:var(--muted);margin:6px 0 0}
.flexBadge{background:var(--pill2);color:var(--pill);font-weight:700}   /* neutral label, like .capbadge: red is for alerts and 'mine' */
.devAlert{background:var(--warn2);border:1px solid #fcd34d;border-radius:var(--radius-xl);padding:14px 16px;margin-bottom:14px}
:root[data-theme="dark"] .devAlert{border-color:#78350f}
.devFocus{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn2)}
.devIntentList{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--warn-text)}
/* Periode met andere tijden: taak-kaart, ingevuld-kaart en formulier in Wijzigen */
.periodDone{background:var(--ok2);border:1px solid var(--ok);border-radius:var(--radius-xl);padding:14px 16px;margin-bottom:14px}
.periodDone .devAlertBody{font-size:13px;color:var(--text);margin:4px 0 0}
#periodTask button.btn.small,.periodDone button.btn.small{margin-top:12px}
.periodDone .periodDoneTitle{font-size:14px;font-weight:800;color:var(--ok);margin:0}
.periodDayHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.periodDay{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;margin-top:8px;background:var(--card)}
.periodDay.changed{border-color:var(--warn);background:var(--warn2)}
.periodRide{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;margin:0}
.periodRide input{width:22px;height:22px;margin:0}
input[type=time].periodTime.changed{border-color:var(--warn);background:var(--warn2)}
.periodBehalfRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border)}
.periodBehalfName{flex:1;min-width:0}
.periodBehalfDetail{padding:0 0 10px}
.periodBehalf{font-size:13px;font-weight:700;color:var(--warn-text);background:var(--warn2);border-radius:var(--radius-md);padding:8px 10px;margin:8px 0 0}
.periodPill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full);white-space:nowrap}
.periodPill.todo{background:var(--warn2);color:var(--warn-text)}
.periodPill.done{background:var(--ok2);color:var(--ok)}
.periodListRow{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--border);margin-top:6px}
.periodListRow .iconbtn{flex-shrink:0}
.periodFormCard{border-top:1px solid var(--border);margin-top:10px}
.periodChips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.periodChip{border:1px solid var(--border);border-radius:var(--radius-md);padding:6px 2px;text-align:center;font-size:11px;white-space:nowrap;background:var(--card)}
.periodChipDay{display:block;font-weight:800;font-size:12px}
.periodPills{flex-wrap:wrap}
.periodTimeRow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--border)}
.periodChanged{color:var(--warn-text);font-weight:800}
.periodLbl{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.periodSel{width:100%;min-height:44px;font-size:14px}
.periodRider{display:flex;align-items:center;gap:8px;margin-top:6px}
.periodRider .periodSel{flex:1;min-width:0}
.periodSummary{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.devAlert .devAlertTitle{font-size:14px;font-weight:800;color:var(--warn-text);margin:0}
.devAlert .devAlertBody{font-size:12px;color:var(--warn-text);margin:4px 0 0}
.devCard{border-color:var(--warn) !important;border-left-width:4px}
.devDayDot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.devDayBtn.changed{border-color:var(--warn)}
/* ---------- Wedstrijdcarpool (violet "match" theme + football icon) ----------
   Deliberately a different color family than the weekday carpool (red/green) and the
   Dagafwijking (amber), so a match ride is recognisable at a glance everywhere it shows up. */
:root{--match:#7c3aed;--match2:#ede9fe;--match-text:#5b21b6}
:root[data-theme="dark"]{--match:#a78bfa;--match2:#221a3a;--match-text:#c4b5fd}
.group.matchGroup{border-left:4px solid var(--match)}
.matchTitle{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.matchTitle .matchBall{color:var(--match);display:inline-flex}
.matchTag{display:inline-flex;align-items:center;gap:4px;background:var(--match2);color:var(--match-text);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full)}
.matchCarRow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:12px}
.matchCarRow .matchCarDep{font-family:var(--font-mono);font-weight:700;color:var(--match-text);flex-shrink:0}
.matchCarRow.mine{background:var(--match2);border-radius:var(--radius-sm);padding:6px 8px;border-top-color:transparent}
.matchCapWarn{color:var(--warn);font-size:12px;font-weight:700;margin-top:6px}
.subride.matchRide{background:var(--match2);border:2px solid var(--match)}
.subride.matchRide .subrideHead{color:var(--match-text)}
.subride.matchRide .subrideDep{color:var(--match-text)}
.subride.matchRide .subrideStatus{color:var(--match-text)}
.subride.matchRide .subrideStatus.driving{font-weight:700}
.dayCard.matchDay{border-color:var(--match)}
.dayCard.matchOnly .dayBadge{background:var(--match);color:#fff}
.trashBtn{color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
/* Wedstrijden tab: violet, like every match ride elsewhere */
.navtab[data-tab="matches"]{flex-grow:1.2}
@media (max-width:380px){.navtab .navlabel{letter-spacing:-.025em}}   /* six tabs on a narrow phone: keep the labels from touching */   /* the longest label ("Wedstrijden") needs a little more room when the coordinator has six tabs */
.navtab[data-tab="matches"].active{color:var(--match-text)}
.navtab[data-tab="matches"].active::after{background:var(--match)}
.card.matchesCard{border-color:var(--match)}
.card.matchesCard h2{color:var(--match-text)}
.matchNote{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:12px;color:var(--match-text)}
:root[data-theme="dark"] .heroCard{background:linear-gradient(135deg,#7f1d1d,#450a0a)}
:root[data-theme="dark"] .waIconBtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
:root[data-theme="dark"] .dayCard.today{border-color:var(--accent)}
:root[data-theme="dark"] .daypill .daypillAlert{color:#450a0a}   /* white on the light dark-mode red was only 2.8:1 */
input[type=time]::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer}
/* Weekoverzicht (Rooster): the PDF layout on screen; print = one A4 landscape page */
.ovLink{float:right;display:inline-flex;align-items:center;gap:4px;margin:-14px -8px -14px 8px;padding:14px 8px;border:none;background:none;font:inherit;font-size:12px;font-weight:700;line-height:1.3;color:var(--accent-text);cursor:pointer}
.ovLink svg{width:1.2em;height:1.2em}
.ovOverlay{position:fixed;inset:0;z-index:70;background:#fff;color:#111;overflow:auto;-webkit-overflow-scrolling:touch}
.ovBar{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #ccc}
.ovDoc{padding:12px 16px 32px;max-width:1200px;margin:0 auto;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ovHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.ovHead h1{font-size:15px;margin:0 0 2px}
.ovHead p{margin:0 0 2px;font-size:12px;font-weight:700}
.ovVersion{font-size:12px;font-weight:700}
.ovTop{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.ovMain{flex:1 1 640px;min-width:0}
.ovSide{flex:0 0 auto}
.ovScroll{overflow-x:auto}
.ovTable{border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;color:#111;background:#fff}
.ovMain .ovTable{width:100%}
.ovTable th,.ovTable td{border:1px dotted #777;padding:2px 6px;text-align:left;white-space:nowrap}
.ovTable th{border:1px solid #000;font-weight:700}
.ovTable td.ovWrap{white-space:normal;min-width:110px}
.ovTable tr.ovDay td{border-top:2px solid #000;font-weight:800;font-style:italic}
.ovCoord{font-weight:400;color:#8a8a8a}
.ovNo{color:#b42318;font-style:italic}
.ovNote{font-size:11px;margin:4px 0 0}
.ovGirls .ovTable{width:auto}
.ovGirls th{text-align:center}
.ovGirls td{text-align:right}
.ovGirls td:first-child{text-align:left}
.ovHeen{background:#e3f2dc}
.ovTerug{background:#dbe8f7}
.ovTable th,.ovTable td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body>*:not(#ovOverlay){display:none!important}
  .ovOverlay{position:static;overflow:visible}
  .noPrint{display:none!important}
  .ovDoc{padding:0;max-width:none}
  .ovScroll{overflow:visible}
  .ovTable{font-size:9px}
  .ovTable th,.ovTable td{padding:1px 4px}
  .ovTable,.ovHead,.ovTop{page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="topbar">
<div id="impersonateBanner" style="display:none"></div>
<div id="noticeBanner" class="noticeBar" style="display:none"></div>

<script type="module">
// The app itself lives in the modules next to this file (see README). This inline script only
// connects the real Firebase and starts the app. Absolute URLs on purpose: a relative module
// specifier triggered a Firefox security error for at least one user ("may not load or link to
// file:///"). If this site's URL ever changes, the URLs in this script need to change with it.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import * as firestoreSdk from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
// Whole module on purpose: an older firebase-config.js must not break start-up. (The OpenRouteService key is not in this file: it is in the database, see settings/apiKeys.)
import * as appConfig from "https://mveen.github.io/AZ-Carpool/firebase-config.js";
import { initDb, createFirestoreDb } from "https://mveen.github.io/AZ-Carpool/data.js";
import { startApp } from "https://mveen.github.io/AZ-Carpool/app.js";

const { firebaseConfig, googleCalendarApiKey } = appConfig;
const fbApp = initializeApp(firebaseConfig);
initDb(createFirestoreDb({
  sdk: { ...firestoreSdk, signInAnonymously },
  firestoreDb: firestoreSdk.getFirestore(fbApp),
  auth: getAuth(fbApp),
  calendarApiKey: googleCalendarApiKey
}));
startApp();
</script>

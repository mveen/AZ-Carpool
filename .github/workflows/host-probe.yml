name: Probe mijn.host (read-only)

# Only by hand: Actions -> Probe mijn.host (read-only) -> Run workflow.
# Finds out whether the wait page of the host (Imunify360 WebShield, a bot check) can be bypassed from the inside: curl on the host itself,
# and an SSH port forward. READ-ONLY: it uploads, changes and deletes nothing. See .github/scripts/probe-host.sh and README (Test environment).
# (GitHub only lists this workflow once it is on main.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_HOST: test.azcarpool.nl
      SSH_HOST: h70.mijn.host
      SSH_PORT: '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Probe the host (read-only)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp .github/deploy/known_hosts ~/.ssh/known_hosts
          export SSH_CMD="ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519"
          export SSH_DEST="$user@$SSH_HOST"
          bash .github/scripts/probe-host.sh "$SITE_HOST"

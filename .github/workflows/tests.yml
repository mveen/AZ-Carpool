name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the cache check below compares with the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check that CACHE_NAME was bumped
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-cache-bump.sh "origin/${{ github.base_ref }}"

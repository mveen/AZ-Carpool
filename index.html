<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AZ Carpool Aalsmeer</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1c1e21;--muted:#5b6472;--border:#e3e5e8;
  --accent:#dc2626;--accent2:#fee2e2;--ok:#059669;--ok2:#d1fae5;--warn:#b45309;--warn2:#fef3c7;
  --backup:#4b5563;--info:#2563eb;--info2:#dbeafe;--pill:#1d4ed8;--pill2:#dbeafe;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--text:#eceef0;--muted:#9aa1ab;--border:#2c2f34;--accent:#ef4444;--accent2:#3a1414;--ok:#34d399;--ok2:#0f2b21;--warn:#fbbf24;--warn2:#3a2e0f;--backup:#9aa1ab;--info:#60a5fa;--info2:#122036;--pill:#60a5fa;--pill2:#122036;}
}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--text:#eceef0;--muted:#9aa1ab;--border:#2c2f34;--accent:#ef4444;--accent2:#3a1414;--ok:#34d399;--ok2:#0f2b21;--warn:#fbbf24;--warn2:#3a2e0f;--backup:#9aa1ab;--info:#60a5fa;--info2:#122036;--pill:#60a5fa;--pill2:#122036;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:5}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--accent);color:#fff}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
nav button{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:8px 12px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;min-height:38px}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:14px 16px 40px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=number],select{width:100%;padding:9px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;min-height:38px}
input[type=time]{padding:8px 7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;width:100%;min-height:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:var(--muted)}
.chk input{min-height:18px}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:10px;min-height:40px}
button.btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
button.btn.small{padding:8px 12px;font-size:12.5px;margin:0;min-height:36px}
button.btn:disabled{opacity:.35;cursor:default}
.daysection{margin-bottom:16px}
.daysection>h3{font-size:14px;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:4px}
.group{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}
.group.confirmed{border-left-color:var(--info)}
.group.suggestion{border-left-color:var(--ok)}
.group.suggestion.primary{border-left-color:var(--ok);background:var(--ok2)}
.group.warning{border-left-color:var(--warn)}
.group .dir{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.group .time{font-size:18px;font-weight:600}
.group .subtime{font-size:12px;color:var(--muted)}
.pill{display:inline-block;background:var(--pill2);color:var(--pill);border-radius:12px;padding:3px 9px;font-size:12px;margin:2px 3px 0 0}
.driver{color:var(--ok);font-weight:600;font-size:13px;margin-top:4px}
.cap{font-size:12px;color:var(--muted)}
.reserve{font-size:12px;color:var(--muted);margin-top:4px}
.girlchk{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.muted{color:var(--muted);font-size:12px}
.badge{background:var(--ok2);color:var(--ok);font-size:11px;padding:2px 7px;border-radius:10px}
.badge.rec{background:var(--accent2);color:var(--accent);font-weight:700}
.rowflex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fitok{color:var(--ok);font-size:12px;margin-top:4px;font-weight:600}
.fitbad{color:var(--warn);font-size:12px;margin-top:4px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:12px}
table.avail{width:100%;border-collapse:collapse;font-size:12px}
table.avail th,table.avail td{padding:6px 4px}
.dayBlock{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden}
.dayBlockHead{padding:10px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);background:var(--card)}
.dayBlockHead .sumInfo{font-weight:400;color:var(--muted);font-size:12px}
.dayDetailsBody{padding:10px 12px}
.iconbtn{background:none;border:1px solid var(--border);border-radius:8px;min-width:38px;min-height:38px;font-size:14px;cursor:pointer;color:var(--text)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style>
</head>
<body>
<div id="topbar">
<header>
  <h1>🚗 AZ Carpool Aalsmeer–Alkmaar</h1>
  <p id="whoami">Laden…</p>
</header>
<nav aria-label="Hoofdnavigatie">
  <button type="button" data-tab="schedule" class="active">Rooster</button>
  <button type="button" data-tab="myweek">Mijn week</button>
  <button type="button" data-tab="profile">Mijn gezin</button>
  <button type="button" data-tab="beheer" id="navBeheer" style="display:none">Beheer</button>
</nav>
</div>
<main>
  <div id="tab-schedule"></div>
  <div id="tab-myweek" style="display:none"></div>
  <div id="tab-profile" style="display:none"></div>
  <div id="tab-beheer" style="display:none"></div>
  <div id="tab-gate" style="display:none"></div>
</main>

<script type="module">
// ============================================================
// FIREBASE SETUP — paste your own project's config below.
// Firebase console → gear icon → Project settings → scroll to
// "Your apps" → the </> (web) icon → copy the firebaseConfig object.
// These values are meant to be public; real security comes from
// the Firestore rules you'll paste in the console, not from hiding this.
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD06qcffnbm2VFl-3JYEf16BrkTGsqQr70",
  authDomain: "az-carpool.firebaseapp.com",
  projectId: "az-carpool",
  storageBucket: "az-carpool.firebasestorage.app",
  messagingSenderId: "366961042772",
  appId: "1:366961042772:web:7bcbf144fa4316146814c1",
  measurementId: "G-B1VT4T621M"
};


const fbApp = initializeApp(firebaseConfig);
const firestoreDb = getFirestore(fbApp);
const fbAuth = getAuth(fbApp);

// ---- Compatibility shim: gives the rest of this app the exact same
// db.doc(...)/db.collection(...) API it used with Claude's built-in
// database, so none of the app logic below had to change. ----
function wrapDocSnap(s){ return { id:s.id, exists:s.exists(), data:()=>s.data() }; }
function wrapQuerySnap(s){ return { docs: s.docs.map(wrapDocSnap) }; }
function docRef(path){
  const ref = doc(firestoreDb, ...path.split('/'));
  return {
    get: ()=>getDoc(ref).then(wrapDocSnap),
    set: (data)=>setDoc(ref, data),
    update: (data)=>updateDoc(ref, data),
    delete: ()=>deleteDoc(ref),
    onSnapshot: (onNext,onErr)=>onSnapshot(ref, s=>onNext(wrapDocSnap(s)), onErr)
  };
}
function collRef(path){
  const ref = collection(firestoreDb, path);
  return {
    get: ()=>getDocs(ref).then(wrapQuerySnap),
    onSnapshot: (onNext,onErr)=>onSnapshot(ref, s=>onNext(wrapQuerySnap(s)), onErr),
    doc: (id)=>docRef(path+'/'+id)
  };
}
const db = { doc: docRef, collection: collRef };
// ============================================================

const DAYS=[["Ma","Maandag"],["Di","Dinsdag"],["Wo","Woensdag"],["Do","Donderdag"],["Vr","Vrijdag"]];
let me=null,canEdit=false,coordinatorExists=false;
let families={}, groups={}, links={};
let settings={gapThresholdHours:3, travelLeadMinutes:60, prefWindowMinutes:30};
let prefs={rules:[]};
let shiftPriority={}; // { "Ma_heen": {familyId: rank}, ... }

function fam(id){return families[id]||{parentName:"?",girlName:"?",capacity:4,schedule:{},availability:{}};}
function girlName(id){ return fam(id).girlName||fam(id).parentName||id; }
function myFamilyId(){ return (links[me] && links[me].familyId) || me; }
function shiftKeyOf(day,direction){ return day+'_'+direction; }
function shiftPriorityOf(day,direction,id){
  const map = shiftPriority[shiftKeyOf(day,direction)] || {};
  return map[id]!=null? map[id] : 999;
}
function sortByShiftPriority(day,direction,entries){
  return [...entries].sort((a,b)=>shiftPriorityOf(day,direction,a[0])-shiftPriorityOf(day,direction,b[0]));
}
function backupField(direction){ return direction==='heen' ? 'backupHeen' : 'backupTerug'; }
function isAvailable(f,day,direction){
  const a=(f.availability&&f.availability[day])||{};
  return !!(a[direction] || a[backupField(direction)]);
}

function setStatus(msg){ const el=document.getElementById('whoami'); if(el) el.textContent=msg; adjustMainPadding(); }
function adjustMainPadding(){
  const topbar=document.getElementById('topbar');
  const main=document.querySelector('main');
  if(topbar && main) main.style.paddingTop = (topbar.offsetHeight + 14) + 'px';
}
window.addEventListener('resize', adjustMainPadding);
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
    t.style.cssText='position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:20px;font-size:13px;max-width:90%;text-align:center;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2)';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display='none';},4000);
}
function twoStepConfirm(btn, confirmLabel, action){
  if(btn.dataset.confirming==='1'){
    clearTimeout(btn._resetTimer);
    btn.dataset.confirming=''; btn.textContent=btn.dataset.origLabel;
    action();
  } else {
    btn.dataset.origLabel = btn.textContent;
    btn.dataset.confirming='1';
    btn.textContent = confirmLabel;
    btn._resetTimer = setTimeout(()=>{ btn.dataset.confirming=''; btn.textContent=btn.dataset.origLabel; }, 4000);
  }
}

async function init(){
  renderAll();
  setStatus("Verbinden…");
  try{
    const cred = await signInAnonymously(fbAuth);
    me = cred.user.uid;
  }catch(e){
    setStatus("⚠️ Niet verbonden.");
    showConnectionError(e);
    return;
  }
  try{
    const coordSnap = await db.doc("config/coordinator").get();
    coordinatorExists = coordSnap.exists;
    canEdit = coordSnap.exists && coordSnap.data().uid === me;
  }catch(e){ coordinatorExists=false; canEdit=false; }
  setStatus(canEdit? "Coördinator (kan rooster bewerken)" : "Ouder (alleen-lezen rooster)");
  const navB=document.getElementById('navBeheer');
  if(navB) navB.style.display = canEdit? 'inline-block':'none';
  renderAll();
  try{
    db.collection("families").onSnapshot(snap=>{ families={}; snap.docs.forEach(d=>families[d.id]=d.data()); renderAll(); },
      err=>{ setStatus("⚠️ Fout bij laden gezinnen: "+(err&&err.message||err)); });
    db.collection("groups").onSnapshot(snap=>{ groups={}; snap.docs.forEach(d=>groups[d.id]=d.data()); renderSchedule(); renderMyWeek(); },
      err=>{ setStatus("⚠️ Fout bij laden rooster: "+(err&&err.message||err)); });
    db.collection("links").onSnapshot(snap=>{ links={}; snap.docs.forEach(d=>links[d.id]=d.data()); renderProfile(); renderBeheer(); renderMyWeek(); },
      err=>{ setStatus("⚠️ Fout bij laden koppelingen: "+(err&&err.message||err)); });
    db.doc("settings/planning").onSnapshot(snap=>{ if(snap.exists) settings={...settings, ...snap.data()}; renderBeheer(); renderSchedule(); },
      err=>{ setStatus("⚠️ Fout bij laden instellingen: "+(err&&err.message||err)); });
    db.doc("settings/prefs").onSnapshot(snap=>{ prefs = snap.exists? (snap.data()||{rules:[]}) : {rules:[]}; if(!prefs.rules) prefs.rules=[]; renderBeheer(); renderSchedule(); },
      err=>{ setStatus("⚠️ Fout bij laden voorkeuren: "+(err&&err.message||err)); });
    db.doc("settings/priority").onSnapshot(snap=>{ shiftPriority = snap.exists? (snap.data()||{}) : {}; renderBeheer(); renderSchedule(); },
      err=>{ setStatus("⚠️ Fout bij laden prioriteit: "+(err&&err.message||err)); });
  }catch(e){ setStatus("⚠️ Kon niet live verbinden: "+(e&&e.message||e)); }
  adjustMainPadding();
}
function renderAll(){ renderProfile(); renderSchedule(); renderBeheer(); renderMyWeek(); }

document.querySelectorAll('nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['schedule','myweek','profile','beheer'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.style.display = (b.dataset.tab===t)?'block':'none';
  });
}));

// ---------- Shared family form: per-day <details> instead of a 5-column grid, so it's usable on phones ----------
function familyFormHtml(prefix,f){
  f = f || {parentName:"",girlName:"",capacity:4,schedule:{},availability:{}};
  const dayBlocks = DAYS.map(([k,label])=>{
    const s=(f.schedule&&f.schedule[k])||{};
    const a=(f.availability&&f.availability[k])||{};
    const summary = (s.heen||s.terug) ? `${s.heen||'–'} / ${s.terug||'–'}` : 'geen rit';
    return `<div class="dayBlock">
      <div class="dayBlockHead">${label} <span class="sumInfo">${summary}</span></div>
      <div class="dayDetailsBody">
        <div class="grid2">
          <div><label style="margin-top:0">Heen aank.</label><input type="time" id="${prefix}_sch_${k}_heen" value="${s.heen||''}"></div>
          <div><label style="margin-top:0">Terug klaar</label><input type="time" id="${prefix}_sch_${k}_terug" value="${s.terug||''}"></div>
        </div>
        <div class="chk"><input type="checkbox" id="${prefix}_av_${k}_heen" ${a.heen?'checked':''}><label for="${prefix}_av_${k}_heen" style="margin:0;color:inherit;font-size:12px">Rijdt heen</label></div>
        <div class="chk"><input type="checkbox" id="${prefix}_av_${k}_terug" ${a.terug?'checked':''}><label for="${prefix}_av_${k}_terug" style="margin:0;color:inherit;font-size:12px">Rijdt terug</label></div>
        <div class="chk"><input type="checkbox" id="${prefix}_bkH_${k}" ${a.backupHeen?'checked':''}><label for="${prefix}_bkH_${k}" style="margin:0;color:inherit;font-size:12px">Back-up heen</label></div>
        <div class="chk"><input type="checkbox" id="${prefix}_bkT_${k}" ${a.backupTerug?'checked':''}><label for="${prefix}_bkT_${k}" style="margin:0;color:inherit;font-size:12px">Back-up terug</label></div>
      </div>
    </div>`;
  }).join('');
  return `
    <label>Naam ouder</label><input type="text" id="${prefix}_parentName" value="${f.parentName||''}">
    <label>Naam dochter</label><input type="text" id="${prefix}_girlName" value="${f.girlName||''}">
    <label>Autocapaciteit (incl. bestuurder)</label><input type="number" id="${prefix}_capacity" min="1" max="9" value="${f.capacity||4}">
    <p class="muted" style="margin-top:10px">Weekschema, beschikbaarheid &amp; back-up:</p>
    ${dayBlocks}`;
}
// "Rijdt X" and "Back-up X" are mutually exclusive: ticking one unticks the other.
function wireExclusiveAvailability(prefix){
  DAYS.forEach(([k])=>{
    const heen=document.getElementById(`${prefix}_av_${k}_heen`);
    const bkH=document.getElementById(`${prefix}_bkH_${k}`);
    const terug=document.getElementById(`${prefix}_av_${k}_terug`);
    const bkT=document.getElementById(`${prefix}_bkT_${k}`);
    if(heen && bkH){
      heen.addEventListener('change', ()=>{ if(heen.checked) bkH.checked=false; });
      bkH.addEventListener('change', ()=>{ if(bkH.checked) heen.checked=false; });
    }
    if(terug && bkT){
      terug.addEventListener('change', ()=>{ if(terug.checked) bkT.checked=false; });
      bkT.addEventListener('change', ()=>{ if(bkT.checked) terug.checked=false; });
    }
  });
}
function readFamilyForm(prefix){
  const schedule={}, availability={};
  DAYS.forEach(([k])=>{
    schedule[k]={heen:document.getElementById(`${prefix}_sch_${k}_heen`).value, terug:document.getElementById(`${prefix}_sch_${k}_terug`).value};
    availability[k]={
      heen:document.getElementById(`${prefix}_av_${k}_heen`).checked,
      terug:document.getElementById(`${prefix}_av_${k}_terug`).checked,
      backupHeen:document.getElementById(`${prefix}_bkH_${k}`).checked,
      backupTerug:document.getElementById(`${prefix}_bkT_${k}`).checked
    };
  });
  return {
    parentName:document.getElementById(`${prefix}_parentName`).value.trim(),
    girlName:document.getElementById(`${prefix}_girlName`).value.trim(),
    capacity:parseInt(document.getElementById(`${prefix}_capacity`).value)||4,
    schedule, availability
  };
}

// ---------- Mijn gezin tab ----------
// ---------- Firebase connection failed (bad config, offline, etc.) ----------
function showConnectionError(err){
  const nav=document.querySelector('nav');
  if(nav) nav.style.display='none';
  ['schedule','myweek','profile','beheer'].forEach(t=>{ const el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
  const gateDiv=document.getElementById('tab-gate');
  if(gateDiv){
    gateDiv.style.display='block';
    gateDiv.innerHTML = `<div style="max-width:420px;margin:30px auto 0">
      <div class="card">
        <h2>Geen verbinding</h2>
        <p class="muted">Kan geen verbinding maken met de database. Dit betekent meestal dat het Firebase-configuratieblok bovenaan het bestand nog niet is ingevuld, of dat er geen internetverbinding is.</p>
        <p class="muted" style="margin-top:8px">Foutmelding: ${err&&err.message? err.message : String(err)}</p>
      </div>
    </div>`;
  }
  adjustMainPadding();
}

// ---------- First-run: nobody has claimed coordinator yet ----------
function renderClaimCoordinator(){
  const box=document.getElementById('tab-gate');
  if(!box) return;
  box.innerHTML = `<div style="max-width:420px;margin:30px auto 0">
    <div class="card">
      <h2>Welkom bij AZ Carpool</h2>
      <p class="muted">Er is nog geen coördinator ingesteld voor deze app. Ben jij dat?</p>
      <button type="button" class="btn" id="claimCoordBtn">Ik ben de coördinator</button>
      <p class="muted" style="margin-top:10px">Ben je een ouder en geen coördinator? Wacht tot de coördinator dit heeft ingesteld en de link met een uitnodigingscode met je deelt.</p>
    </div>
  </div>`;
  const btn=document.getElementById('claimCoordBtn');
  if(btn) btn.onclick=async ()=>{
    try{
      await db.doc("config/coordinator").set({uid:me, claimedAt:Date.now()});
      canEdit=true; coordinatorExists=true;
      const navB=document.getElementById('navBeheer'); if(navB) navB.style.display='inline-block';
      showToast("Je bent nu coördinator ✓");
      renderAll();
    }catch(e){ showToast("Mislukt (mogelijk had iemand anders je net voor): "+(e&&e.message||e)); }
  };
}

// ---------- Access gate: phone + daughter + coordinator-issued code, before anything else shows ----------
function genCode(){ return String(Math.floor(100000+Math.random()*900000)); }
function needsGate(){ return !!me && !canEdit && !(links[me] && links[me].familyId); }
function renderGateOrApp(){
  const nav=document.querySelector('nav');
  const gateDiv=document.getElementById('tab-gate');
  if(!gateDiv) return;
  if(!coordinatorExists && !canEdit){
    if(nav) nav.style.display='none';
    ['schedule','myweek','profile','beheer'].forEach(t=>{ const el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
    gateDiv.style.display='block';
    renderClaimCoordinator();
    adjustMainPadding();
    return;
  }
  if(needsGate()){
    if(nav) nav.style.display='none';
    ['schedule','myweek','profile','beheer'].forEach(t=>{ const el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
    gateDiv.style.display='block';
    renderGate();
  } else {
    if(nav) nav.style.display='flex';
    gateDiv.style.display='none';
    const activeBtn=document.querySelector('nav button.active');
    const activeTab=activeBtn? activeBtn.dataset.tab : 'schedule';
    ['schedule','myweek','profile','beheer'].forEach(t=>{
      const el=document.getElementById('tab-'+t);
      if(el) el.style.display=(t===activeTab)?'block':'none';
    });
  }
  adjustMainPadding();
}
function renderGate(){
  const box=document.getElementById('tab-gate');
  if(!box) return;
  const options = Object.entries(families);

async function submitGate(){
  if(!db||!me){ showToast("Geen verbinding. Herlaad de pagina."); return; }
  const phone=(document.getElementById('gatePhone').value||'').trim();
  const girlSel=document.getElementById('gateGirl');
  const girlId=girlSel? girlSel.value : null;
  const code=(document.getElementById('gateCode').value||'').trim();
  const msg=document.getElementById('gateMsg');
  if(!phone||!girlId||!code){ if(msg) msg.textContent="Vul alle velden in."; return; }
  const expected=(fam(girlId).inviteCode||'').trim();
  if(!expected){ if(msg) msg.textContent="Voor dit gezin is nog geen code ingesteld. Vraag de coördinator."; return; }
  if(code!==expected){ if(msg) msg.textContent="Code klopt niet. Controleer en probeer opnieuw."; return; }
  try{
    await db.doc("links/"+me).set({familyId:girlId, phone});
    try{ await db.doc("families/"+girlId).update({parentPhone:phone}); }catch(e){}
    showToast("Toegang verleend ✓");
  }catch(e){ if(msg) msg.textContent="Mislukt: "+(e&&e.message||e); }
}

// ---------- Mijn week: a compact, scroll-free view of just what a parent needs ----------
function renderMyWeek(){
  const box=document.getElementById('tab-myweek');
  if(!box) return;
  if(!me){ box.innerHTML=`<div class="card"><h2>Mijn week</h2><p class="muted">Kon je account niet herkennen. Herlaad de pagina.</p></div>`; return; }
  const linked = !!(links[me] && links[me].familyId);
  if(!linked){ box.innerHTML=`<div class="card"><h2>Mijn week</h2><p class="muted">Koppel eerst je dochter via 'Mijn gezin' om hier je weekoverzicht te zien.</p></div>`; return; }
  const myId = myFamilyId();
  function cell(day,direction){
    const s = fam(myId).schedule && fam(myId).schedule[day] && fam(myId).schedule[day][direction];
    const daughterGrp = groupsFor(day,direction).find(([gid,g])=>g.girlIds.includes(myId));
    const drivingGrp = groupsFor(day,direction).find(([gid,g])=>g.driverFamilyId===myId);
    const parts=[];
    if(s){
      if(daughterGrp){
        const [,g]=daughterGrp;
        const dep=g.departureTime||'?';
        const isMe=g.driverFamilyId===myId;
        const driverName=g.driverFamilyId? fam(g.driverFamilyId).parentName : 'geen chauffeur';
        parts.push(`<div><div style="font-weight:700;font-size:14px">${dep}</div><div style="font-size:11px;${isMe? 'color:var(--accent);font-weight:700' : 'color:var(--muted)'}">👧 ${isMe? 'Jij rijdt haar!' : driverName}</div></div>`);
      } else {
        parts.push(`<div><div style="font-weight:700;font-size:14px">${s}</div><div class="fitbad" style="font-size:11px">nog niet ingepland</div></div>`);
      }
    }
    // Show the parent's own driving duty separately whenever it's a DIFFERENT car than the
    // daughter's ride (or the daughter isn't travelling that shift at all) — these are not the same thing.
    if(drivingGrp && (!daughterGrp || drivingGrp[0]!==daughterGrp[0])){
      const [,dg]=drivingGrp;
      const dep=dg.departureTime||'?';
      const names=dg.girlIds.map(id=>fam(id).girlName||fam(id).parentName).join(', ');
      parts.push(`<div style="margin-top:4px;padding-top:4px;border-top:1px dashed var(--border);font-size:11px;color:var(--accent);font-weight:700">🚗 Jij rijdt om ${dep}<br><span style="font-weight:400">${names}</span></div>`);
    }
    return parts.length? parts.join('') : '<span class="muted">–</span>';
  }
  const rows = DAYS.map(([k,label])=>`
    <tr style="border-top:1px solid var(--border)">
      <td style="padding:12px 6px;font-weight:600">${label}</td>
      <td style="padding:12px 6px;text-align:center">${cell(k,'heen')}</td>
      <td style="padding:12px 6px;text-align:center">${cell(k,'terug')}</td>
    </tr>`).join('');
  box.innerHTML = `<div class="card">
    <h2>Mijn week — ${fam(myId).girlName||''}</h2>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr><th style="text-align:left;padding:6px">Dag</th><th style="padding:6px">Heen</th><th style="padding:6px">Terug</th></tr>
      ${rows}
    </table></div>
    <p class="muted" style="margin-top:8px">👧 = de rit van je dochter (🚗 ernaast als jij die zelf rijdt). Los daarvan: 🚗 <em>Jij rijdt om …</em> = jouw eigen chauffeursbeurt, ook als dat een andere auto is dan die van je dochter.</p>
  </div>`;
}

let selectedShiftKey='Ma_heen';
function renderPriorityCard(){
  const shifts=[];
  DAYS.forEach(([k,label])=>{ shifts.push([k+'_heen', label+' – Heen']); shifts.push([k+'_terug', label+' – Terug']); });
  const options = shifts.map(([key,label])=>`<option value="${key}" ${key===selectedShiftKey?'selected':''}>${label}</option>`).join('');
  return `<p class="muted">Bepaal per shift in welke volgorde beschikbare chauffeurs worden voorgesteld.</p>
    <label>Shift</label><select id="shiftPrioritySelect">${options}</select>
    <div id="shiftPriorityRows" style="margin-top:8px"></div>`;
}
function renderShiftPriorityRows(shiftKeyVal){
  const div=document.getElementById('shiftPriorityRows');
  if(!div) return;
  const [day,direction]=shiftKeyVal.split('_');
  const rows = sortByShiftPriority(day,direction, availableDrivers(day,direction));
  if(!rows.length){ div.innerHTML=`<p class="muted">Geen beschikbare chauffeurs voor deze shift.</p>`; return; }
  div.innerHTML = rows.map(([id,f],i)=>`
    <div class="rowflex" style="padding:8px 6px;border-bottom:1px solid var(--border)">
      <span>${i+1}. ${f.parentName||'?'} <span class="muted">(${f.girlName||''}, ${f.capacity} pl.)</span></span>
      <span style="display:flex;gap:4px">
        <button type="button" class="iconbtn" data-prioup="${id}" aria-label="${(f.parentName||'chauffeur')} hoger in prioriteit" ${i===0?'disabled':''}>▲</button>
        <button type="button" class="iconbtn" data-priodown="${id}" aria-label="${(f.parentName||'chauffeur')} lager in prioriteit" ${i===rows.length-1?'disabled':''}>▼</button>
      </span>
    </div>`).join('');
  const ids=rows.map(([id])=>id);
  div.querySelectorAll('[data-prioup]').forEach(btn=>btn.onclick=()=>movePriority(shiftKeyVal,ids,btn.dataset.prioup,-1));
  div.querySelectorAll('[data-priodown]').forEach(btn=>btn.onclick=()=>movePriority(shiftKeyVal,ids,btn.dataset.priodown,1));
}
async function movePriority(shiftKeyVal,ids,id,delta){
  const idx=ids.indexOf(id);
  const newIdx=idx+delta;
  if(newIdx<0||newIdx>=ids.length) return;
  const newIds=[...ids];
  [newIds[idx],newIds[newIdx]]=[newIds[newIdx],newIds[idx]];
  const map={}; newIds.forEach((gid,i)=>map[gid]=i+1);
  if(!db){showToast("Geen verbinding met opslag.");return;}
  try{ await db.doc("settings/priority").set({...shiftPriority,[shiftKeyVal]:map}); showToast("Volgorde opgeslagen ✓"); }
  catch(e){ showToast("Mislukt: "+(e&&e.message||e)); }
}

// ---------- Rooster tab ----------
function girlsFor(day,direction){
  return Object.entries(families).filter(([id,f])=>f.schedule && f.schedule[day] && f.schedule[day][direction]);
}
function groupsFor(day,direction){
  return Object.entries(groups).filter(([id,g])=>g.day===day && g.direction===direction);
}
function alreadyGrouped(day,direction){
  const ids=new Set();
  groupsFor(day,direction).forEach(([id,g])=>g.girlIds.forEach(gid=>ids.add(gid)));
  return ids;
}
function eligibleDrivers(day,direction,count){
  return sortByShiftPriority(day,direction, Object.entries(families).filter(([id,f])=>
    isAvailable(f,day,direction) && (f.capacity||0)>=count
  ));
}
function availableDrivers(day,direction){
  return Object.entries(families).filter(([id,f])=> isAvailable(f,day,direction));
}
function timeToMinutes(t){ if(!t) return null; const p=t.split(':'); return (+p[0])*60+(+p[1]); }
function minutesToTime(min){ min=((Math.round(min)%1440)+1440)%1440; const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function computeDepartureTime(day,direction,girlIds){
  const times = girlIds.map(id=>timeToMinutes(fam(id).schedule[day]&&fam(id).schedule[day][direction])).filter(v=>v!=null);
  if(!times.length) return '';
  // Heen: leave early enough for the earliest arrival requirement. Terug: can't leave Alkmaar
  // until the LAST passenger is actually ready, so use the latest "klaar" time, not the earliest.
  return direction==='heen' ? minutesToTime(Math.min(...times) - (settings.travelLeadMinutes||60)) : minutesToTime(Math.max(...times));
}
function scoreSplitPrefs(c1,c2,gap){
  let broken=0, satisfied=0;
  (prefs.rules||[]).forEach(r=>{
    if(r.type==='together'){
      const ids=r.ids||[];
      const present = ids.filter(id=>c1.includes(id)||c2.includes(id));
      if(present.length<2) return;
      const inC1=ids.filter(id=>c1.includes(id)).length, inC2=ids.filter(id=>c2.includes(id)).length;
      if(inC1>0 && inC2>0) broken++;
    } else if(r.type==='prefer'){
      const girlIn1=c1.includes(r.girlId), girlIn2=c2.includes(r.girlId);
      if(!girlIn1 && !girlIn2) return;
      const anyIn1=(r.withAny||[]).some(id=>c1.includes(id));
      const anyIn2=(r.withAny||[]).some(id=>c2.includes(id));
      if((girlIn1&&anyIn1)||(girlIn2&&anyIn2)) satisfied++;
    }
  });
  const prefWindow = settings.prefWindowMinutes!=null? settings.prefWindowMinutes : 30;
  const prefWeight = gap<=prefWindow ? 500 : 10;
  return {broken,satisfied,prefWeight};
}
function planClusters(day,direction,list){
  if(!list.length) return [];
  const gapLimit = (settings.gapThresholdHours||3)*60;
  const withMin = list.map(([id,f])=>({id,min:timeToMinutes(f.schedule[day][direction])})).sort((a,b)=>a.min-b.min);
  const totalGap = withMin[withMin.length-1].min - withMin[0].min;
  const oneCarOk = eligibleDrivers(day,direction,withMin.length).length>0;
  if(oneCarOk && totalGap<=gapLimit) return [withMin.map(x=>x.id)];
  const avail = availableDrivers(day,direction);
  const splitCoverable = (n1,n2) => avail.some(([idA,fA])=>avail.some(([idB,fB])=> idA!==idB &&
    ((fA.capacity>=n1 && fB.capacity>=n2) || (fB.capacity>=n1 && fA.capacity>=n2))));
  let best=null, bestScore=-Infinity;
  for(let k=1;k<withMin.length;k++){
    const c1=withMin.slice(0,k).map(x=>x.id), c2=withMin.slice(k).map(x=>x.id);
    if(!splitCoverable(c1.length,c2.length)) continue;
    const gap=withMin[k].min-withMin[k-1].min;
    const {broken,satisfied,prefWeight}=scoreSplitPrefs(c1,c2,gap);
    const score = -broken*1000 + satisfied*prefWeight + gap*0.01;
    if(score>bestScore){ bestScore=score; best=[c1,c2]; }
  }
  if(best) return best;
  let bestSplit=1,bestG=-1;
  for(let k=1;k<withMin.length;k++){ const gap=withMin[k].min-withMin[k-1].min; if(gap>bestG){bestG=gap;bestSplit=k;} }
  return [withMin.slice(0,bestSplit).map(x=>x.id), withMin.slice(bestSplit).map(x=>x.id)];
}
function planPrimaryOption(day,direction,list){
  if(!list.length) return null;
  const gapLimit=(settings.gapThresholdHours||3)*60;
  const withMin=list.map(([id,f])=>({id,min:timeToMinutes(f.schedule[day][direction])})).sort((a,b)=>a.min-b.min);
  const n=withMin.length;
  const totalGap=withMin[n-1].min-withMin[0].min;
  const priorityOrder=sortByShiftPriority(day,direction, availableDrivers(day,direction));
  if(!priorityOrder.length) return null;
  const [id1,f1]=priorityOrder[0];
  if(f1.capacity>=n && totalGap<=gapLimit){
    return {label:`${f1.parentName} (${n}/${f1.capacity} pl.)`, assignment:[{driverId:id1,girlIds:withMin.map(x=>x.id)}]};
  }
  if(priorityOrder.length<2) return null;
  const [id2,f2]=priorityOrder[1];
  let best=null,bestScore=-Infinity;
  for(let k=1;k<n;k++){
    const c1=withMin.slice(0,k).map(x=>x.id), c2=withMin.slice(k).map(x=>x.id);
    const fitsAB=f1.capacity>=c1.length && f2.capacity>=c2.length;
    const fitsBA=f2.capacity>=c1.length && f1.capacity>=c2.length;
    if(!fitsAB && !fitsBA) continue;
    const gap=withMin[k].min-withMin[k-1].min;
    const {broken,satisfied,prefWeight}=scoreSplitPrefs(c1,c2,gap);
    const score=-broken*1000+satisfied*prefWeight+gap*0.01;
    if(score>bestScore){bestScore=score;best={c1,c2,fitsAB,fitsBA};}
  }
  if(!best) return null;
  let g1=best.c1,g2=best.c2;
  if(!best.fitsAB && best.fitsBA){ g1=best.c2; g2=best.c1; }
  return {label:`${f1.parentName} &amp; ${f2.parentName}`, assignment:[{driverId:id1,girlIds:g1},{driverId:id2,girlIds:g2}]};
}
function planOptions(day,direction,list){
  const clusters = planClusters(day,direction,list);
  let opts;
  if(clusters.length===1){
    const c=clusters[0];
    opts = eligibleDrivers(day,direction,c.length).map(([id,f])=>({label:`${f.parentName} (${c.length}/${f.capacity} pl.)`, assignment:[{driverId:id,girlIds:c}]}));
  } else if(clusters.length===2){
    const [c1,c2]=clusters;
    const avail=availableDrivers(day,direction);
    opts=[]; const seen=new Set();
    for(let i=0;i<avail.length;i++)for(let j=i+1;j<avail.length;j++){
      const [idA,fA]=avail[i], [idB,fB]=avail[j];
      let pick=null;
      if(fA.capacity>=c1.length && fB.capacity>=c2.length) pick=[{driverId:idA,girlIds:c1},{driverId:idB,girlIds:c2}];
      else if(fB.capacity>=c1.length && fA.capacity>=c2.length) pick=[{driverId:idB,girlIds:c1},{driverId:idA,girlIds:c2}];
      if(pick){
        const key=[pick[0].driverId,pick[1].driverId].sort().join('+');
        if(!seen.has(key)){ seen.add(key); opts.push({label:`${fA.parentName} &amp; ${fB.parentName}`, assignment:pick}); }
      }
    }
  } else opts=[];
  opts.sort((a,b)=>{
    const pa=a.assignment.reduce((s,x)=>s+shiftPriorityOf(day,direction,x.driverId),0);
    const pb=b.assignment.reduce((s,x)=>s+shiftPriorityOf(day,direction,x.driverId),0);
    return pa-pb;
  });
  const primary = planPrimaryOption(day,direction,list);
  if(primary){
    const key=a=>a.assignment.map(x=>x.driverId).sort().join('+');
    opts = opts.filter(o=>key(o)!==key(primary));
    opts.unshift(primary);
  }
  return opts;
}
async function createGroupWithDriver(day,direction,girlIds,driverId,extraExclude=[]){
  if(!db){showToast("Geen verbinding met opslag.");return;}
  const alreadyDriving = groupsFor(day,direction).map(([gid,g])=>g.driverFamilyId).filter(Boolean);
  const exclude = new Set([driverId, ...alreadyDriving, ...extraExclude]);
  const reserveIds = eligibleDrivers(day,direction,girlIds.length).map(([id])=>id).filter(id=>!exclude.has(id));
  const gid=`${day}_${direction}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
  const departureTime=computeDepartureTime(day,direction,girlIds);
  try{ await db.doc("groups/"+gid).set({day,direction,girlIds,driverFamilyId:driverId||null,reserveFamilyIds:reserveIds,departureTime}); }
  catch(e){showToast("Kon groep niet opslaan (alleen coördinator kan bewerken): "+(e&&e.message||e));}
}
async function useOption(day,direction,assignment){
  const usedDrivers = assignment.map(a=>a.driverId).filter(Boolean);
  for(const a of assignment){ await createGroupWithDriver(day,direction,a.girlIds,a.driverId, usedDrivers.filter(id=>id!==a.driverId)); }
}
async function createGroupCustom(day,direction,ids){
  if(!ids.length){showToast("Selecteer minstens 1 dochter.");return;}
  const eligible=eligibleDrivers(day,direction,ids.length);
  await createGroupWithDriver(day,direction,ids, eligible[0]?eligible[0][0]:null);
}

  }
  return `<div style="margin-bottom:10px"><span class="badge">${title}</span>${groupHtml}${suggestHtml}${pickerHtml}</div>`;
}

function attachScheduleHandlers(){
 try{
  document.querySelectorAll('[data-makegroup]').forEach(btn=>btn.onclick=async ()=>{
    const [day,direction]=btn.dataset.makegroup.split('|');
    const box=btn.closest('.group');
    const picked=[...box.querySelectorAll('.girlpick:checked')].map(c=>c.value);
    await createGroupCustom(day,direction,picked);
  });
  document.querySelectorAll('[data-useoption]').forEach(btn=>btn.onclick=async ()=>{
    const [day,direction,idxStr]=btn.dataset.useoption.split('|');
    const opts=(window.__planOptions||{})[day+'|'+direction]||[];
    const opt=opts[+idxStr];
    if(opt) await useOption(day,direction,opt.assignment);
  });
  document.querySelectorAll('[data-delgroup]').forEach(btn=>btn.onclick=async ()=>{
    try{ await db.doc("groups/"+btn.dataset.delgroup).delete(); }catch(e){showToast("Verwijderen mislukt: "+(e&&e.message||e));}
  });
  document.querySelectorAll('[data-swap]').forEach(sel=>sel.onchange=async ()=>{
    const gid=sel.dataset.swap; const g=groups[gid]; if(!g)return;
    const newDriver=sel.value;
    try{
      await db.doc("groups/"+gid).update({driverFamilyId:newDriver});
      const siblings = groupsFor(g.day,g.direction).filter(([oid,og])=>oid!==gid && og.driverFamilyId===newDriver);
      for(const [oid,og] of siblings){
        const usedElsewhere = new Set(groupsFor(g.day,g.direction).filter(([xid])=>xid!==oid).map(([xid,xg])=>xg.driverFamilyId).filter(Boolean));
        usedElsewhere.add(newDriver);
        const alt = eligibleDrivers(g.day,g.direction,og.girlIds.length).map(([id])=>id).find(id=>!usedElsewhere.has(id));
        await db.doc("groups/"+oid).update({driverFamilyId: alt||null});
      }
      showToast(siblings.length? "Chauffeur gewisseld — dubbele boeking automatisch opgelost ✓" : "Chauffeur gewisseld ✓");
    }catch(e){showToast("Wisselen mislukt: "+(e&&e.message||e));}
  });
  document.querySelectorAll('[data-deptime]').forEach(inp=>inp.onchange=async ()=>{
    const gid=inp.dataset.deptime;
    try{ await db.doc("groups/"+gid).update({departureTime:inp.value}); }catch(e){showToast("Aanpassen mislukt: "+(e&&e.message||e));}
  });
  document.querySelectorAll('[data-moveConfirm]').forEach(btn=>btn.onclick=async ()=>{
    const gid=btn.dataset.moveconfirm;
    const box=btn.closest('.group');
    const girlSel=box.querySelector(`[data-moveFromGirl="${gid}"]`);
    const toSel=box.querySelector(`[data-moveToGroup="${gid}"]`);
    const girlId=girlSel&&girlSel.value, toGid=toSel&&toSel.value;
    if(!girlId||!toGid){ showToast("Kies eerst een dochter én een bestemming."); return; }
    const from=groups[gid], to=groups[toGid];
    if(!from||!to) return;
    try{
      const newFrom=from.girlIds.filter(id=>id!==girlId);
      const newTo=[...to.girlIds, girlId];
      if(newFrom.length){ await db.doc("groups/"+gid).update({girlIds:newFrom}); }
      else { await db.doc("groups/"+gid).delete(); }
      await db.doc("groups/"+toGid).update({girlIds:newTo});
      showToast("Verplaatst ✓");
    }catch(e){showToast("Verplaatsen mislukt: "+(e&&e.message||e));}
  });
 }catch(e){ setStatus("⚠️ Fout bij koppelen roosterknoppen: "+(e&&e.message||e)); }
}

init();
</script>
</body>
</html>

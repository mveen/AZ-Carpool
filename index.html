<!DOCTYPE html>
<html lang="nl">
<head>
<script>(function(){try{var p=localStorage.getItem('theme-pref');document.documentElement.setAttribute('data-theme', p==='dark'?'dark':'light');}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AZ Carpool Aalsmeer</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1c1e21;--muted:#5b6472;--border:#e3e5e8;
  --accent:#dc2626;--accent2:#fee2e2;--ok:#059669;--ok2:#d1fae5;--warn:#b45309;--warn2:#fef3c7;
  --backup:#4b5563;--info:#2563eb;--info2:#dbeafe;--pill:#1d4ed8;--pill2:#dbeafe;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* data-theme is now always explicitly "light" or "dark" (see the head script and initTheme()),
   so the old prefers-color-scheme media query is dead code and has been removed. */
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--text:#eceef0;--muted:#9aa1ab;--border:#2c2f34;--accent:#ef4444;--accent2:#3a1414;--ok:#34d399;--ok2:#0f2b21;--warn:#fbbf24;--warn2:#3a2e0f;--backup:#9aa1ab;--info:#60a5fa;--info2:#122036;--pill:#60a5fa;--pill2:#122036;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:5}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--accent);color:#fff}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12px;opacity:.9}
nav{display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto}
nav button{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:8px 12px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;min-height:38px}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:14px 16px 40px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=number],select{width:100%;padding:9px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;min-height:38px}
input[type=time]{padding:8px 7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;width:100%;min-height:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:var(--muted)}
.chk input{min-height:18px}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:10px;min-height:40px}
button.btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
button.btn.small{padding:8px 12px;font-size:12.5px;margin:0;min-height:36px}
button.btn:disabled{opacity:.35;cursor:default}
.daysection{margin-bottom:16px}
.daysection>h3{font-size:14px;color:var(--text);border-bottom:2px solid var(--accent);padding-bottom:4px}
.group{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}
.group.confirmed{border-left-color:var(--info)}
.group.suggestion{border-left-color:var(--ok)}
.group.suggestion.primary{border-left-color:var(--ok);background:var(--ok2)}
.group.warning{border-left-color:var(--warn)}
.group .dir{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.group .time{font-size:18px;font-weight:600}
.group .subtime{font-size:12px;color:var(--muted)}
.pill{display:inline-block;background:var(--pill2);color:var(--pill);border-radius:12px;padding:3px 9px;font-size:12px;margin:2px 3px 0 0}
.driver{color:var(--ok);font-weight:600;font-size:13px;margin-top:4px}
.cap{font-size:12px;color:var(--muted)}
.reserve{font-size:12px;color:var(--muted);margin-top:4px}
.girlchk{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.muted{color:var(--muted);font-size:12px}
.badge{background:var(--ok2);color:var(--ok);font-size:11px;padding:2px 7px;border-radius:10px}
.badge.rec{background:var(--accent2);color:var(--accent);font-weight:700}
.rowflex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fitok{color:var(--ok);font-size:12px;margin-top:4px;font-weight:600}
.fitbad{color:var(--warn);font-size:12px;margin-top:4px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:12px}
table.avail{width:100%;border-collapse:collapse;font-size:12px}
table.avail th,table.avail td{padding:6px 4px}
.dayBlock{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden}
.dayBlockHead{padding:10px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);background:var(--card)}
.dayBlockHead .sumInfo{font-weight:400;color:var(--muted);font-size:12px}
.dayDetailsBody{padding:10px 12px}
.iconbtn{background:none;border:1px solid var(--border);border-radius:8px;min-width:38px;min-height:38px;font-size:14px;cursor:pointer;color:var(--text)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style>
</head>
<body>
<div id="topbar">
<div id="impersonateBanner" style="display:none"></div>
<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
  <div>
    <h1>🚗 AZ Carpool Aalsmeer–Alkmaar</h1>
    <p id="whoami">Laden…</p>
  </div>
  <button type="button" id="themeToggle" class="iconbtn" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff;flex-shrink:0" aria-label="Licht/donker thema wisselen"></button>
</header>
<nav aria-label="Hoofdnavigatie">
  <button type="button" data-tab="schedule" class="active">Rooster</button>
  <button type="button" data-tab="myweek">Mijn week</button>
  <button type="button" data-tab="deviation">Dagafwijking</button>
  <button type="button" data-tab="profile">Mijn gezin</button>
  <button type="button" data-tab="beheer" id="navBeheer" style="display:none">Beheer</button>
</nav>
</div>
<main>
  <div id="tab-schedule"></div>
  <div id="tab-myweek" style="display:none"></div>
  <div id="tab-deviation" style="display:none"></div>
  <div id="tab-profile" style="display:none"></div>
  <div id="tab-beheer" style="display:none"></div>
  <div id="tab-gate" style="display:none"></div>
</main>

<script type="module">
// ============================================================
// FIREBASE SETUP — the actual config values live in firebase-config.js,
// a separate file next to this one, so you only ever fill it in once.
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
// Absolute URLs here (not "./firebase-config.js" / "./planning.js") on purpose: a relative
// module specifier triggered a Firefox security error for at least one user ("may not load
// or link to file:///"), which a fully-qualified URL sidesteps entirely regardless of cause.
// If this site's URL ever changes, these two lines need to be updated to match.
import { firebaseConfig } from "https://mveen.github.io/AZ-Carpool/firebase-config.js";
import {
  timeToMinutes as pureTimeToMinutes, minutesToTime as pureMinutesToTime,
  computeDepartureTime as pureComputeDepartureTime,
  planClusters as pureplanClusters, planPrimaryAssignment, planAlternativeAssignments
} from "https://mveen.github.io/AZ-Carpool/planning.js";

const fbApp = initializeApp(firebaseConfig);
const firestoreDb = getFirestore(fbApp);
const fbAuth = getAuth(fbApp);

// ---- Compatibility shim: gives the rest of this app the exact same
// db.doc(...)/db.collection(...) API it used with Claude's built-in
// database, so none of the app logic below had to change. ----
function wrapDocSnap(s){ return { id:s.id, exists:s.exists(), data:()=>s.data() }; }
function wrapQuerySnap(s){ return { docs: s.docs.map(wrapDocSnap) }; }
function docRef(path){
  const ref = doc(firestoreDb, ...path.split('/'));
  return {
    get: ()=>getDoc(ref).then(wrapDocSnap),
    set: (data)=>setDoc(ref, data),
    update: (data)=>updateDoc(ref, data),
    delete: ()=>deleteDoc(ref),
    onSnapshot: (onNext,onErr)=>onSnapshot(ref, s=>onNext(wrapDocSnap(s)), onErr)
  };
}
function collRef(path){
  const ref = collection(firestoreDb, path);
  return {
    get: ()=>getDocs(ref).then(wrapQuerySnap),
    onSnapshot: (onNext,onErr)=>onSnapshot(ref, s=>onNext(wrapQuerySnap(s)), onErr),
    doc: (id)=>docRef(path+'/'+id)
  };
}
const db = { doc: docRef, collection: collRef };
// ============================================================

const DAYS=[["Ma","Maandag"],["Di","Dinsdag"],["Wo","Woensdag"],["Do","Donderdag"],["Vr","Vrijdag"]];
let me=null,canEdit=false,coordinatorExists=false,coordinatorConfig=null,appReady=false,impersonateFamilyId=null;
let families={}, groups={}, links={}, deviations={};
let lastUpdateRooster=null, lastUpdateDeviation=null;
// ISO week (e.g. "2026-W14") — deviations are tagged with this so they can never apply to
// any week but the one they were made for, regardless of when the app happens to be opened.
function getISOWeekKey(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const weekNum = 1+Math.round(((d-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return d.getUTCFullYear()+'-W'+String(weekNum).padStart(2,'0');
}
const currentWeekKey = getISOWeekKey(new Date());
function deviationKey(day,direction){ return day+'_'+direction; }
function activeDeviation(day,direction){
  const dev = deviations[deviationKey(day,direction)];
  return (dev && dev.weekKey===currentWeekKey && dev.cars && dev.cars.length) ? dev : null;
}
// The single source of truth for "what cars actually run today" — the default Rooster groups,
// unless a still-current-week deviation overrides them. Used by Mijn week and the editor itself;
// Rooster always shows the real default groups regardless, per the requirement that deviations
// never touch the default schedule.
function effectiveCars(day,direction){
  const dev = activeDeviation(day,direction);
  if(dev) return dev.cars.map(c=>({...c}));
  return groupsFor(day,direction).map(([gid,g])=>({...g, baseGroupId:gid}));
}
async function purgeStaleDeviations(){
  for(const [key,dev] of Object.entries(deviations)){
    if(dev.weekKey!==currentWeekKey){
      try{ await db.doc("deviations/"+key).delete(); }catch(e){}
    }
  }
}
let settings={gapThresholdHours:3, travelLeadMinutes:60, prefWindowMinutes:30, parentPrefWindowMinutes:60};
let prefs={rules:[]};
let shiftPriority={}; // { "Ma_heen": {familyId: rank}, ... }

function fam(id){return families[id]||{parentName:"?",girlName:"?",capacity:4,schedule:{},availability:{}};}
// "capacity" as entered/stored is the TOTAL car capacity including the driver's own seat.
// Every scheduling/display calculation needs the PASSENGER seat count, which is one less.
function seats(f){ return Math.max(0, (f.capacity||0) - 1); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function girlName(id){ return esc(fam(id).girlName||fam(id).parentName||id); }
// Who's making this change right now, for the "laatst bijgewerkt door" footers.
function myDisplayInfo(){
  const linked = !!(links[me] && links[me].familyId) || !!impersonateFamilyId;
  if(linked){
    const f = fam(myFamilyId());
    return { name: f.parentName||'Onbekend', phone: f.parentPhone1||f.parentPhone2||'' };
  }
  return { name: canEdit? 'Coördinator' : 'Onbekend', phone: '' };
}
async function recordLastUpdate(kind){
  if(!db) return;
  try{
    const info=myDisplayInfo();
    await db.doc("settings/lastUpdate"+kind).set({by:info.name, phone:info.phone, at:Date.now()});
  }catch(e){ /* best-effort only — never block the real action on this */ }
}
function lastUpdateFooter(info){
  if(!info || !info.at) return '';
  const d = new Date(info.at);
  const dateStr = d.toLocaleString('nl-NL', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  return `<p class="muted" style="margin-top:10px;font-size:11px">Laatst bijgewerkt door: ${esc(info.by||'onbekend')}${info.phone?` (${esc(info.phone)})`:''} — ${dateStr}</p>`;
}
function myFamilyId(){ return impersonateFamilyId || (links[me] && links[me].familyId) || me; }
function shiftKeyOf(day,direction){ return day+'_'+direction; }
function shiftPriorityOf(day,direction,id){
  const map = shiftPriority[shiftKeyOf(day,direction)] || {};
  return map[id]!=null? map[id] : 999;
}
function sortByShiftPriority(day,direction,entries){
  return [...entries].sort((a,b)=>shiftPriorityOf(day,direction,a[0])-shiftPriorityOf(day,direction,b[0]));
}
function backupField(direction){ return direction==='heen' ? 'backupHeen' : 'backupTerug'; }
function isAvailable(f,day,direction){
  const a=(f.availability&&f.availability[day])||{};
  return !!(a[direction] || a[backupField(direction)]);
}

// ---------- Theme: Licht / Donker only. New users start on Licht; their choice is remembered. ----------
function applyTheme(pref){
  document.documentElement.setAttribute('data-theme', pref==='dark'?'dark':'light');
  const btn=document.getElementById('themeToggle');
  if(btn) btn.textContent = pref==='dark' ? '🌙 Donker' : '☀️ Licht';
}
function cycleTheme(){
  const cur = (()=>{ try{ return localStorage.getItem('theme-pref')||'light'; }catch(e){ return 'light'; } })();
  const next = cur==='light' ? 'dark' : 'light';
  try{ localStorage.setItem('theme-pref',next); }catch(e){}
  applyTheme(next);
}
(function initTheme(){
  let pref='light'; try{ pref=localStorage.getItem('theme-pref')||'light'; }catch(e){}
  applyTheme(pref);
  const btn=document.getElementById('themeToggle');
  if(btn) btn.onclick=cycleTheme;
})();

function setStatus(msg){ const el=document.getElementById('whoami'); if(el) el.textContent=msg; adjustMainPadding(); }
function adjustMainPadding(){
  const topbar=document.getElementById('topbar');
  const main=document.querySelector('main');
  if(topbar && main) main.style.paddingTop = (topbar.offsetHeight + 14) + 'px';
}
window.addEventListener('resize', adjustMainPadding);
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite');
    t.style.cssText='position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:20px;font-size:13px;max-width:90%;text-align:center;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2)';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display='none';},4000);
}
function twoStepConfirm(btn, confirmLabel, action){
  if(btn.dataset.confirming==='1'){
    clearTimeout(btn._resetTimer);
    btn.dataset.confirming=''; btn.textContent=btn.dataset.origLabel;
    action();
  } else {
    btn.dataset.origLabel = btn.textContent;
    btn.dataset.confirming='1';
    btn.textContent = confirmLabel;
    btn._resetTimer = setTimeout(()=>{ btn.dataset.confirming=''; btn.textContent=btn.dataset.origLabel; }, 4000);
  }
}

async function init(){
  renderAll();
  setStatus("Verbinden…");
  try{
    const cred = await signInAnonymously(fbAuth);
    me = cred.user.uid;
  }catch(e){
    setStatus("⚠️ Niet verbonden.");
    showConnectionError(e);
    return;
  }
  try{
    const coordSnap = await db.doc("config/coordinator").get();
    coordinatorExists = coordSnap.exists;
    coordinatorConfig = coordSnap.exists? coordSnap.data() : null;
    appReady = true;
  }catch(e){
    setStatus("⚠️ Niet verbonden.");
    showConnectionError(e);
    return;
  }
  recomputeCanEdit();
  // (status line itself is now set by recomputeCanEdit() -> updateStatusLine(), always in sync)
  const navB=document.getElementById('navBeheer');
  if(navB) navB.style.display = canEdit? 'inline-block':'none';
  renderAll();
  try{
    db.collection("families").onSnapshot(snap=>{ families={}; snap.docs.forEach(d=>families[d.id]=d.data()); renderAll(); },
      err=>{ setStatus("⚠️ Fout bij laden gezinnen: "+(err&&err.message||err)); });
    db.collection("groups").onSnapshot(snap=>{ groups={}; snap.docs.forEach(d=>groups[d.id]=d.data()); renderSchedule(); renderMyWeek(); },
      err=>{ setStatus("⚠️ Fout bij laden rooster: "+(err&&err.message||err)); });
    db.collection("links").onSnapshot(snap=>{ links={}; snap.docs.forEach(d=>links[d.id]=d.data());
      const navB=document.getElementById('navBeheer');
      recomputeCanEdit(); if(navB) navB.style.display = canEdit? 'inline-block':'none';
      renderProfile(); renderBeheer(); renderMyWeek(); },
      err=>{ setStatus("⚠️ Fout bij laden koppelingen: "+(err&&err.message||err)); });
    db.doc("settings/planning").onSnapshot(snap=>{ if(snap.exists) settings={...settings, ...snap.data()}; renderBeheer(); renderSchedule(); },
      err=>{ setStatus("⚠️ Fout bij laden instellingen: "+(err&&err.message||err)); });
    db.doc("settings/prefs").onSnapshot(snap=>{ prefs = snap.exists? (snap.data()||{rules:[]}) : {rules:[]}; if(!prefs.rules) prefs.rules=[]; renderBeheer(); renderSchedule(); },
      err=>{ setStatus("⚠️ Fout bij laden voorkeuren: "+(err&&err.message||err)); });
    db.doc("settings/priority").onSnapshot(snap=>{ shiftPriority = snap.exists? (snap.data()||{}) : {}; renderBeheer(); renderSchedule(); },
      err=>{ setStatus("⚠️ Fout bij laden prioriteit: "+(err&&err.message||err)); });
    db.collection("deviations").onSnapshot(snap=>{
      deviations={}; snap.docs.forEach(d=>deviations[d.id]=d.data());
      purgeStaleDeviations();
      renderSchedule(); renderMyWeek(); renderDeviationTab();
    }, err=>{ setStatus("⚠️ Fout bij laden dagafwijkingen: "+(err&&err.message||err)); });
    db.doc("settings/lastUpdateRooster").onSnapshot(snap=>{ lastUpdateRooster = snap.exists? snap.data() : null; renderSchedule(); renderMyWeek(); },
      err=>{});
    db.doc("settings/lastUpdateDeviation").onSnapshot(snap=>{ lastUpdateDeviation = snap.exists? snap.data() : null; renderDeviationTab(); renderMyWeek(); },
      err=>{});
  }catch(e){ setStatus("⚠️ Kon niet live verbinden: "+(e&&e.message||e)); }
  adjustMainPadding();
}
function renderAll(){ renderProfile(); renderSchedule(); renderBeheer(); renderMyWeek(); renderDeviationTab(); renderImpersonateBanner(); adjustMainPadding(); }

// ---------- Coordinator test mode: view the app as a specific parent, without losing real rights ----------
function renderImpersonateBanner(){
  const el=document.getElementById('impersonateBanner');
  if(!el) return;
  if(impersonateFamilyId){
    el.style.display='block';
    el.style.cssText='display:block;background:var(--warn2);color:var(--warn);padding:8px 16px;font-size:12px;text-align:center;font-weight:600;border-bottom:1px solid var(--border)';
    el.innerHTML = `🧪 Testweergave als: ${esc(fam(impersonateFamilyId).girlName||fam(impersonateFamilyId).parentName||impersonateFamilyId)} <button type="button" class="btn small secondary" id="stopImpersonateBtn" style="margin-left:8px">Stop testen</button>`;
    const btn=document.getElementById('stopImpersonateBtn');
    if(btn) btn.onclick=stopImpersonate;
  } else {
    el.style.display='none'; el.innerHTML='';
  }
}
function startImpersonate(familyId){
  if(!familyId) return;
  impersonateFamilyId=familyId;
  recomputeCanEdit();
  const navB=document.getElementById('navBeheer'); if(navB) navB.style.display='none';
  showToast("Testweergave gestart ✓");
  renderAll();
}
function stopImpersonate(){
  impersonateFamilyId=null;
  recomputeCanEdit();
  const navB=document.getElementById('navBeheer'); if(navB) navB.style.display=canEdit?'inline-block':'none';
  showToast("Terug naar coördinatorweergave ✓");
  renderAll();
}

document.querySelectorAll('nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['schedule','myweek','deviation','profile','beheer'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el) el.style.display = (b.dataset.tab===t)?'block':'none';
  });
}));
// A link like #myweek (used by the WhatsApp update message) opens straight to that tab
// instead of always defaulting to Rooster.
(function applyInitialHashTab(){
  try{
    const hash=(location.hash||'').replace('#','');
    if(!/^[a-z]+$/i.test(hash)) return; // only ever expect plain tab names — anything else is ignored, not risked
    const btn=document.querySelector(`nav button[data-tab="${hash}"]`);
    if(btn){
      document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
    }
  }catch(e){ /* a malformed hash must never be able to break the rest of the app's startup */ }
})();

// ---------- Shared family form: per-day <details> instead of a 5-column grid, so it's usable on phones ----------
function familyFormHtml(prefix,f){
  f = f || {parentName:"",girlName:"",capacity:4,schedule:{},availability:{}};
  const dayBlocks = DAYS.map(([k,label])=>{
    const s=(f.schedule&&f.schedule[k])||{};
    const a=(f.availability&&f.availability[k])||{};
    const summary = (s.heen||s.terug) ? `${s.heen||'–'} / ${s.terug||'–'}` : 'geen rit';
    return `<div class="dayBlock">
      <div class="dayBlockHead">${label} <span class="sumInfo">${summary}</span></div>
      <div class="dayDetailsBody">
        <div class="grid2">
          <div><label style="margin-top:0">Heen aank.</label><input type="time" id="${prefix}_sch_${k}_heen" value="${s.heen||''}"></div>
          <div><label style="margin-top:0">Terug klaar</label><input type="time" id="${prefix}_sch_${k}_terug" value="${s.terug||''}"></div>
        </div>
        <div class="chk"><input type="checkbox" id="${prefix}_av_${k}_heen" ${a.heen?'checked':''}><label for="${prefix}_av_${k}_heen" style="margin:0;color:inherit;font-size:12px">Rijdt heen</label></div>
        <div class="chk"><input type="checkbox" id="${prefix}_av_${k}_terug" ${a.terug?'checked':''}><label for="${prefix}_av_${k}_terug" style="margin:0;color:inherit;font-size:12px">Rijdt terug</label></div>
        <div class="chk"><input type="checkbox" id="${prefix}_bkH_${k}" ${a.backupHeen?'checked':''}><label for="${prefix}_bkH_${k}" style="margin:0;color:inherit;font-size:12px">Back-up heen</label></div>
        <div class="chk"><input type="checkbox" id="${prefix}_bkT_${k}" ${a.backupTerug?'checked':''}><label for="${prefix}_bkT_${k}" style="margin:0;color:inherit;font-size:12px">Back-up terug</label></div>
      </div>
    </div>`;
  }).join('');
  return `
    <label>Naam ouder</label><input type="text" id="${prefix}_parentName" value="${esc(f.parentName||'')}">
    <label>Naam dochter</label><input type="text" id="${prefix}_girlName" value="${esc(f.girlName||'')}">
    <label>Totale autocapaciteit (incl. bestuurder — dus bij 5 stoelen totaal is er plek voor 4 passagiers)</label>
    <input type="number" id="${prefix}_capacity" min="1" max="9" value="${f.capacity||4}" oninput="document.getElementById('${prefix}_capacityHint').textContent = 'Plek voor '+Math.max(0,(parseInt(this.value)||0)-1)+' passagier(s)';">
    <p class="muted" id="${prefix}_capacityHint" style="margin-top:2px">Plek voor ${Math.max(0,(f.capacity||4)-1)} passagier(s)</p>
    <p class="muted" style="margin-top:10px">Weekschema, beschikbaarheid &amp; back-up:</p>
    ${dayBlocks}`;
}
// "Rijdt X" and "Back-up X" are mutually exclusive: ticking one unticks the other.
function wireExclusiveAvailability(prefix){
  DAYS.forEach(([k])=>{
    const heen=document.getElementById(`${prefix}_av_${k}_heen`);
    const bkH=document.getElementById(`${prefix}_bkH_${k}`);
    const terug=document.getElementById(`${prefix}_av_${k}_terug`);
    const bkT=document.getElementById(`${prefix}_bkT_${k}`);
    if(heen && bkH){
      heen.addEventListener('change', ()=>{ if(heen.checked) bkH.checked=false; });
      bkH.addEventListener('change', ()=>{ if(bkH.checked) heen.checked=false; });
    }
    if(terug && bkT){
      terug.addEventListener('change', ()=>{ if(terug.checked) bkT.checked=false; });
      bkT.addEventListener('change', ()=>{ if(bkT.checked) terug.checked=false; });
    }
  });
}
function readFamilyForm(prefix){
  const schedule={}, availability={};
  DAYS.forEach(([k])=>{
    schedule[k]={heen:document.getElementById(`${prefix}_sch_${k}_heen`).value, terug:document.getElementById(`${prefix}_sch_${k}_terug`).value};
    availability[k]={
      heen:document.getElementById(`${prefix}_av_${k}_heen`).checked,
      terug:document.getElementById(`${prefix}_av_${k}_terug`).checked,
      backupHeen:document.getElementById(`${prefix}_bkH_${k}`).checked,
      backupTerug:document.getElementById(`${prefix}_bkT_${k}`).checked
    };
  });
  return {
    parentName:document.getElementById(`${prefix}_parentName`).value.trim(),
    girlName:document.getElementById(`${prefix}_girlName`).value.trim(),
    capacity:parseInt(document.getElementById(`${prefix}_capacity`).value)||4,
    schedule, availability
  };
}

// Coordinator status is either tied to the original claiming browser (uid), or — once the
// coordinator designates one in Beheer — to whichever family is linked as "coordinator gezin",
// so it survives clearing browser data as long as that family re-verifies through the gate.
function recomputeCanEdit(){
  if(impersonateFamilyId){ canEdit=false; updateStatusLine(); return; } // testing as a parent always overrides real coordinator status
  if(!coordinatorConfig){ canEdit=false; updateStatusLine(); return; }
  if(coordinatorConfig.uid && coordinatorConfig.uid===me){ canEdit=true; updateStatusLine(); return; }
  if(coordinatorConfig.familyId && links[me] && links[me].familyId===coordinatorConfig.familyId){ canEdit=true; updateStatusLine(); return; }
  canEdit=false; updateStatusLine();
}
// Single source of truth for the header line, so it can never go stale relative to the real
// permission state — always recomputed together with canEdit, from wherever that changes.
function updateStatusLine(){
  const linked = !!(links[me] && links[me].familyId) || !!impersonateFamilyId;
  let text;
  if(linked){
    const f = fam(myFamilyId());
    text = (f.parentName||'Ouder') + (canEdit? ' (Coördinator)' : '');
  } else if(canEdit){
    text = 'Coördinator';
  } else if(me){
    text = 'Nog niet gekoppeld — ga naar Mijn gezin';
  } else {
    text = '';
  }
  setStatus(text);
}

function genCode(){ return String(Math.floor(100000+Math.random()*900000)); }
function needsGate(){ if(impersonateFamilyId) return false; return !!me && !canEdit && !(links[me] && links[me].familyId); }
function renderGateOrApp(){
  const nav=document.querySelector('nav');
  const gateDiv=document.getElementById('tab-gate');
  if(!gateDiv) return;
  if(!appReady){
    // Still determining auth/coordinator state — never show the claim screen (or anything else)
    // until we actually know whether a coordinator already exists.
    if(nav) nav.style.display='none';
    ['schedule','myweek','deviation','profile','beheer'].forEach(t=>{ const el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
    gateDiv.style.display='block';
    gateDiv.innerHTML = `<div style="max-width:420px;margin:30px auto 0"><div class="card"><p class="muted">Laden…</p></div></div>`;
    adjustMainPadding();
    return;
  }
  if(!coordinatorExists && !canEdit){
    if(nav) nav.style.display='none';
    ['schedule','myweek','deviation','profile','beheer'].forEach(t=>{ const el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
    gateDiv.style.display='block';
    renderClaimCoordinator();
    adjustMainPadding();
    return;
  }
  if(needsGate()){
    if(nav) nav.style.display='none';
    ['schedule','myweek','deviation','profile','beheer'].forEach(t=>{ const el=document.getElementById('tab-'+t); if(el) el.style.display='none'; });
    gateDiv.style.display='block';
    renderGate();
  } else {
    if(nav) nav.style.display='flex';
    gateDiv.style.display='none';
    const activeBtn=document.querySelector('nav button.active');
    const activeTab=activeBtn? activeBtn.dataset.tab : 'schedule';
    ['schedule','myweek','deviation','profile','beheer'].forEach(t=>{
      const el=document.getElementById('tab-'+t);
      if(el) el.style.display=(t===activeTab)?'block':'none';
    });
  }
  adjustMainPadding();
}

    <div class="card">
      <h2>Toegang tot AZ Carpool</h2>
      <p class="muted">Vul je gegevens in. De coördinator heeft je samen met deze link ook een code gegeven.</p>

      <label>Code</label>

      <button type="button" class="btn" id="gateSubmit" ${options.length?'':'disabled'}>Toegang aanvragen</button>
      <p id="gateMsg" class="muted" style="margin-top:8px"></p>
    </div>
  </div>`;
  const btn=document.getElementById('gateSubmit');

async function submitGate(){
  if(!db||!me){ showToast("Geen verbinding. Herlaad de pagina."); return; }
  const phone=(document.getElementById('gatePhone').value||'').trim();
  const girlSel=document.getElementById('gateGirl');
  const girlId=girlSel? girlSel.value : null;
  const code=(document.getElementById('gateCode').value||'').trim();
  const msg=document.getElementById('gateMsg');
  if(!phone||!girlId||!code){ if(msg) msg.textContent="Vul alle velden in."; return; }
  const expectedCode=(fam(girlId).inviteCode||'').trim();
  const expectedPhone1=fam(girlId).parentPhone1||'';
  const expectedPhone2=fam(girlId).parentPhone2||'';
  if(!expectedCode||(!expectedPhone1&&!expectedPhone2)){ if(msg) msg.textContent="Voor dit gezin is nog geen code/telefoonnummer ingesteld. Vraag de coördinator."; return; }
  const enteredNorm=normalizePhone(phone);
  if(enteredNorm!==normalizePhone(expectedPhone1) && enteredNorm!==normalizePhone(expectedPhone2)){ if(msg) msg.textContent="Telefoonnummer komt niet overeen met dit gezin."; return; }
  if(code!==expectedCode){ if(msg) msg.textContent="Code klopt niet. Controleer en probeer opnieuw."; return; }
  try{
    await db.doc("links/"+me).set({familyId:girlId, phone});
    showToast("Toegang verleend ✓");
  }catch(e){ if(msg) msg.textContent="Mislukt: "+(e&&e.message||e); }
}
// Compares Dutch numbers regardless of 06.../ +316.../ 00316... formatting or stray spaces/dashes.
function normalizePhone(p){
  let digits=(p||'').replace(/[^\d]/g,'');
  if(digits.startsWith('0031')) digits='0'+digits.slice(4);
  else if(digits.startsWith('31') && digits.length>=11) digits='0'+digits.slice(2);
  return digits;
}

  } else {

      if(card) card.addEventListener('change', ()=>saveProfile());
      wireExclusiveAvailability('me');
      const ub=document.getElementById('unlinkBtn'); if(ub) ub.onclick=async ()=>{
        try{ await db.doc("links/"+me).delete(); showToast("Ontkoppeld ✓"); }catch(e){showToast("Mislukt: "+(e&&e.message||e));}
      };
    } else {
      const lb=document.getElementById('linkBtn'); if(lb) lb.onclick=async ()=>{
        const sel=document.getElementById('linkSelect'); if(!sel||!db)return;

        catch(e){showToast("Koppelen mislukt: "+(e&&e.message||e));}
      };
    }
  }
  updateStatusLine();

async function saveProfile(){
  if(!db){showToast("Geen verbinding met opslag. Herlaad de pagina en probeer opnieuw.");return;}
  if(!me){showToast("Je account kon niet herkend worden. Herlaad de pagina.");return;}
  const effId = myFamilyId();
  const data = readFamilyForm('me');
  try{ await db.doc("families/"+effId).set(data); showToast("Opgeslagen ✓"); }
  catch(e){showToast("Opslaan mislukt: "+(e&&e.message||e));}
}

// ---------- Mijn week: a compact, scroll-free view of just what a parent needs ----------
function renderMyWeek(){
  const box=document.getElementById('tab-myweek');
  if(!box) return;
  if(!me){ box.innerHTML=`<div class="card"><h2>Mijn week</h2><p class="muted">Kon je account niet herkennen. Herlaad de pagina.</p></div>`; return; }
  const linked = !!(links[me] && links[me].familyId);
  if(!linked){ box.innerHTML=`<div class="card"><h2>Mijn week</h2><p class="muted">Koppel eerst je dochter via 'Mijn gezin' om hier je weekoverzicht te zien.</p></div>`; return; }
  const myId = myFamilyId();
  function cell(day,direction){
    const s = fam(myId).schedule && fam(myId).schedule[day] && fam(myId).schedule[day][direction];
    const cars = effectiveCars(day,direction);
    const daughterIdx = cars.findIndex(c=>c.girlIds.includes(myId));
    const drivingIdx = cars.findIndex(c=>c.driverFamilyId===myId);
    const parts=[];
    if(s){
      if(daughterIdx>=0){
        const g=cars[daughterIdx];
        const dep=g.departureTime||'?';
        const isMe=g.driverFamilyId===myId;
        const driverName=g.driverFamilyId? esc(fam(g.driverFamilyId).parentName) : 'geen chauffeur';
        parts.push(`<div><div style="font-weight:700;font-size:14px">${dep}</div><div style="font-size:11px;color:var(--muted)">👧 ${isMe? 'Jij' : driverName}</div></div>`);
      } else {
        parts.push(`<div><div style="font-weight:700;font-size:14px">${s}</div><div class="fitbad" style="font-size:11px">nog niet ingepland</div></div>`);
      }
    }
    // The car icon ALWAYS appears whenever you're driving this shift, including when it's
    // your own daughter's car — the 👧 line above already shows who's with her; this line is
    // specifically "which shift do I need to drive", so it must never be silently skipped.
    if(drivingIdx>=0){
      const dg=cars[drivingIdx];
      const dep=dg.departureTime||'?';
      const names=dg.girlIds.map(id=>girlName(id)).join(', ');
      parts.push(`<div style="margin-top:4px;padding-top:4px;border-top:1px dashed var(--border);font-size:11px;color:var(--accent);font-weight:700">🚗 Jij rijdt om ${dep}<br><span style="font-weight:400">${names}</span></div>`);
    }
    if(activeDeviation(day,direction)){
      parts.push(`<div style="margin-top:4px;font-size:10px;color:var(--warn)">⚠️ afwijking deze week</div>`);
    }
    return parts.length? parts.join('') : '<span class="muted">–</span>';
  }
  const rows = DAYS.map(([k,label])=>`
    <tr style="border-top:1px solid var(--border)">
      <td style="padding:12px 6px;font-weight:600">${label}</td>
      <td style="padding:12px 6px;text-align:center">${cell(k,'heen')}</td>
      <td style="padding:12px 6px;text-align:center">${cell(k,'terug')}</td>
    </tr>`).join('');
  box.innerHTML = `<div class="card">
    <h2>Mijn week — ${fam(myId).girlName||''}</h2>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <tr><th style="text-align:left;padding:6px">Dag</th><th style="padding:6px">Heen</th><th style="padding:6px">Terug</th></tr>
      ${rows}
    </table></div>
    <p class="muted" style="margin-top:8px">👧 = de rit van je dochter (met wie ze meerijdt). 🚗 = elke shift waarin jij zelf rijdt, ook als dat je eigen dochters auto is.</p>
    ${lastUpdateFooter([lastUpdateRooster,lastUpdateDeviation].filter(Boolean).sort((a,b)=>(b.at||0)-(a.at||0))[0])}
  </div>`;
}

function renderDevDirection(day,direction,title){

  const dev = activeDeviation(day,direction);
  const allFamilies = Object.entries(families);
  const assignedIds = new Set(cars.flatMap(c=>c.girlIds));
  const unassigned = allFamilies.filter(([id])=>!assignedIds.has(id));

  const cardsHtml = cars.map((c,idx)=>{
    const driverOk = c.driverFamilyId? isAvailable(fam(c.driverFamilyId),day,direction) : true;

      allFamilies.map(([id,f])=>`<option value="${id}" ${id===c.driverFamilyId?'selected':''}>${esc(f.parentName)}${isAvailable(f,day,direction)?'':' ⚠️'}</option>`).join('');
    const otherIdxs = cars.map((_,i)=>i).filter(i=>i!==idx);
    const swapOptions = `<option value="">Verplaats naar…</option>` + otherIdxs.map(i=>`<option value="${i}">Auto: ${esc(fam(cars[i].driverFamilyId).parentName||'?')}</option>`).join('');

        <button type="button" class="btn small secondary devRemoveBtn" data-day="${day}" data-direction="${direction}" data-caridx="${idx}" data-girl="${id}">Verwijder uit auto</button>
      </div>`).join('') || '<p class="muted">Geen passagiers meer in deze auto.</p>';
    return `<div class="group" data-devcar="${day}|${direction}|${idx}">
      <div class="dir">${direction==='heen'?'Vertrek':'Vertrek (terug)'}</div>

  const addOptions = cars.length? `<option value="">Voeg toe aan auto…</option>` + cars.map((c,i)=>`<option value="${i}">Auto: ${esc(fam(c.driverFamilyId).parentName||'?')}</option>`).join('') : '';
  const unassignedHtml = unassigned.length? `<div class="group" style="border-style:dashed">
      <h3 style="margin-bottom:6px">Overige dochters</h3>
      <p class="muted" style="margin-top:0">Ook meiden zonder tijd voor dit moment kun je hier alsnog aan een auto toevoegen.</p>
      ${unassigned.map(([id,f])=>`
        <div class="rowflex" style="padding:4px 0;border-bottom:1px solid var(--border)">
          <span style="flex:1">${esc(f.girlName||f.parentName||id)}</span>

        </div>`).join('')}
    </div>` : '';

  return `<div class="card">
    <span class="badge">${title}</span>
    ${cardsHtml}
    ${unassignedHtml}
    ${dev? `<button type="button" class="btn small secondary" data-devreset="${day}|${direction}">Terug naar standaard rooster</button>` : ''}

function attachDeviationHandlers(){
 try{
  document.querySelectorAll('.devDriverSel').forEach(sel=>sel.onchange=async ()=>{
    const {day,direction,caridx}=sel.dataset; const idx=+caridx;
    const cars=effectiveCars(day,direction);
    cars[idx]={...cars[idx], driverFamilyId: sel.value||null};
    await saveDeviationCars(day,direction,cars);
  });
  document.querySelectorAll('.devDeptimeInp').forEach(inp=>inp.onchange=async ()=>{
    const {day,direction,caridx}=inp.dataset; const idx=+caridx;
    const cars=effectiveCars(day,direction);
    cars[idx]={...cars[idx], departureTime: inp.value};
    await saveDeviationCars(day,direction,cars);
  });
  document.querySelectorAll('.devRemoveBtn').forEach(btn=>btn.onclick=async ()=>{
    const {day,direction,caridx,girl}=btn.dataset; const idx=+caridx;
    const cars=effectiveCars(day,direction);
    const newGirlIds=cars[idx].girlIds.filter(id=>id!==girl);
    cars[idx]={...cars[idx], girlIds:newGirlIds, departureTime: computeDepartureTime(day,direction,newGirlIds)};
    await saveDeviationCars(day,direction,cars);
    showToast(girlName(girl)+" verwijderd uit deze auto.");
  });
  document.querySelectorAll('.devSwapSel').forEach(sel=>sel.onchange=async ()=>{
    if(!sel.value) return;
    const {day,direction,caridx,girl}=sel.dataset; const fromIdx=+caridx; const toIdx=+sel.value;
    const cars=effectiveCars(day,direction);
    const newFrom=cars[fromIdx].girlIds.filter(id=>id!==girl);
    const newTo=[...cars[toIdx].girlIds, girl];
    const toSeatsAvail = cars[toIdx].driverFamilyId? seats(fam(cars[toIdx].driverFamilyId)) : null;
    if(toSeatsAvail!=null && newTo.length>toSeatsAvail){
      showToast(`⚠️ Deze auto zit nu vol (${newTo.length}/${toSeatsAvail}) — verplaatsing is wel doorgevoerd.`);
    }
    cars[fromIdx]={...cars[fromIdx], girlIds:newFrom, departureTime: computeDepartureTime(day,direction,newFrom)};
    cars[toIdx]={...cars[toIdx], girlIds:newTo, departureTime: computeDepartureTime(day,direction,newTo)};
    await saveDeviationCars(day,direction,cars);
    showToast(girlName(girl)+" verplaatst.");
  });
  document.querySelectorAll('.devAddSel').forEach(sel=>sel.onchange=async ()=>{
    if(!sel.value) return;
    const {day,direction,girl}=sel.dataset; const toIdx=+sel.value;
    const cars=effectiveCars(day,direction);
    const newTo=[...cars[toIdx].girlIds, girl];
    const toSeatsAvail = cars[toIdx].driverFamilyId? seats(fam(cars[toIdx].driverFamilyId)) : null;
    if(toSeatsAvail!=null && newTo.length>toSeatsAvail){
      showToast(`⚠️ Deze auto zit nu vol (${newTo.length}/${toSeatsAvail}) — toevoeging is wel doorgevoerd.`);
    }
    cars[toIdx]={...cars[toIdx], girlIds:newTo, departureTime: computeDepartureTime(day,direction,newTo)};
    await saveDeviationCars(day,direction,cars);
    showToast(girlName(girl)+" toegevoegd.");
  });
  document.querySelectorAll('[data-devreset]').forEach(btn=>btn.onclick=()=>twoStepConfirm(btn,"Zeker? Terug naar standaard rooster",async ()=>{
    const [day,direction]=btn.dataset.devreset.split('|');
    try{ await db.doc("deviations/"+deviationKey(day,direction)).delete(); recordLastUpdate('Deviation'); showToast("Teruggezet naar standaard ✓"); }
    catch(e){ showToast("Mislukt: "+(e&&e.message||e)); }
  }));
 }catch(e){ showToast("Fout bij koppelen knoppen: "+(e&&e.message||e)); }
}

function renderAvailabilityTable(){
  const rows = Object.entries(families).sort((a,b)=>(a[1].parentName||'').localeCompare(b[1].parentName||''));
  if(!rows.length) return `<p class="muted">Nog geen gezinnen.</p>`;
  const head = `<tr><th style="text-align:left">Ouder</th>${DAYS.map(([k])=>`<th colspan="2">${k}</th>`).join('')}</tr>
    <tr><th></th>${DAYS.map(()=>`<th style="font-size:11px;color:var(--muted)">H</th><th style="font-size:11px;color:var(--muted)">T</th>`).join('')}</tr>`;
  const body = rows.map(([id,f])=>{
    const cells = DAYS.map(([k])=>{
      const a=(f.availability&&f.availability[k])||{};
      const cellFor = (isDefault,isBackup) => isDefault

function renderShiftPriorityRows(shiftKeyVal){
  const div=document.getElementById('shiftPriorityRows');
  if(!div) return;
  const [day,direction]=shiftKeyVal.split('_');
  const rows = sortByShiftPriority(day,direction, availableDrivers(day,direction));
  if(!rows.length){ div.innerHTML=`<p class="muted">Geen beschikbare chauffeurs voor deze shift.</p>`; return; }
  div.innerHTML = rows.map(([id,f],i)=>`
    <div class="rowflex" style="padding:8px 6px;border-bottom:1px solid var(--border)">
      <span>${i+1}. ${esc(f.parentName||'?')} <span class="muted">(${esc(f.girlName||'')}, ${seats(f)} pl.)</span></span>
      <span style="display:flex;gap:4px">
        <button type="button" class="iconbtn" data-prioup="${id}" aria-label="${esc(f.parentName||'chauffeur')} hoger in prioriteit" ${i===0?'disabled':''}>▲</button>
        <button type="button" class="iconbtn" data-priodown="${id}" aria-label="${esc(f.parentName||'chauffeur')} lager in prioriteit" ${i===rows.length-1?'disabled':''}>▼</button>
      </span>
    </div>`).join('');
  const ids=rows.map(([id])=>id);
  div.querySelectorAll('[data-prioup]').forEach(btn=>btn.onclick=()=>movePriority(shiftKeyVal,ids,btn.dataset.prioup,-1));
  div.querySelectorAll('[data-priodown]').forEach(btn=>btn.onclick=()=>movePriority(shiftKeyVal,ids,btn.dataset.priodown,1));
}
async function movePriority(shiftKeyVal,ids,id,delta){
  const idx=ids.indexOf(id);
  const newIdx=idx+delta;
  if(newIdx<0||newIdx>=ids.length) return;
  const newIds=[...ids];
  [newIds[idx],newIds[newIdx]]=[newIds[newIdx],newIds[idx]];
  const map={}; newIds.forEach((gid,i)=>map[gid]=i+1);
  if(!db){showToast("Geen verbinding met opslag.");return;}
  try{ await db.doc("settings/priority").set({...shiftPriority,[shiftKeyVal]:map}); showToast("Volgorde opgeslagen ✓"); }
  catch(e){ showToast("Mislukt: "+(e&&e.message||e)); }
}

async function seedFromPdf(){
  if(!db){showToast("Geen verbinding met opslag.");return;}
  const msg=document.getElementById('seedMsg');
  if(msg) msg.textContent="Bezig met wissen…";
  try{
    const famSnap = await db.collection("families").get();
    await Promise.all(famSnap.docs.map(d=>db.doc("families/"+d.id).delete()));
    const grpSnap = await db.collection("groups").get();
    await Promise.all(grpSnap.docs.map(d=>db.doc("groups/"+d.id).delete()));
    if(msg) msg.textContent="Bezig met invullen…";
    const emptyAvail={heen:false,terug:false,backupHeen:false,backupTerug:false};
    await Promise.all(PDF_SEED.map(g=>{
      const availability={}; DAYS.forEach(([k])=>availability[k]={...emptyAvail});
      return db.doc("families/"+slugify(g.girlName)).set({
        parentName:"Ouder van "+g.girlName, girlName:g.girlName, capacity:4, schedule:g.schedule, availability
      });
    }));
    const check = await db.collection("families").get();
    const docs = check.docs.map(d=>d.data());
    let ok = docs.length===8; let details=[];
    docs.forEach(f=>{
      DAYS.forEach(([k])=>{
        const has = f.schedule && f.schedule[k] && f.schedule[k].heen && f.schedule[k].terug;
        const expectMissing = (f.girlName==='Robbin' && k==='Wo');
        if(expectMissing && has) {ok=false; details.push(f.girlName+" "+k+" had wel een tijd (onverwacht)");}
        if(!expectMissing && !has){ok=false; details.push(f.girlName+" "+k+" mist een tijd");}
      });
    });
    if(msg) msg.textContent = ok
      ? `✅ Klaar: ${docs.length} gezinnen aangemaakt, alle dagen ingevuld behalve Robbin/Woensdag (zoals verwacht).`
      : `⚠️ ${docs.length} gezinnen aangemaakt, maar validatie vond afwijkingen: ${details.join('; ')}`;
  }catch(e){ if(msg) msg.textContent="Fout tijdens laden: "+(e&&e.message||e); }
}

// ---------- Rooster tab ----------
function girlsFor(day,direction){
  return Object.entries(families).filter(([id,f])=>f.schedule && f.schedule[day] && f.schedule[day][direction]);
}
function groupsFor(day,direction){
  return Object.entries(groups).filter(([id,g])=>g.day===day && g.direction===direction);
}
function alreadyGrouped(day,direction){
  const ids=new Set();
  groupsFor(day,direction).forEach(([id,g])=>g.girlIds.forEach(gid=>ids.add(gid)));
  return ids;
}
function eligibleDrivers(day,direction,count){
  return sortByShiftPriority(day,direction, Object.entries(families).filter(([id,f])=>
    isAvailable(f,day,direction) && seats(f)>=count
  ));
}
function availableDrivers(day,direction){
  return Object.entries(families).filter(([id,f])=> isAvailable(f,day,direction));
}
// timeToMinutes/minutesToTime/computeDepartureTime/planClusters/planPrimaryOption/planOptions
// are now thin wrappers around the tested, standalone planning.js module (see that file's
// own test suite — planning.test.js — for the actual algorithm's correctness guarantees).
function timeToMinutes(t){ return pureTimeToMinutes(t); }
function minutesToTime(min){ return pureMinutesToTime(min); }
function computeDepartureTime(day,direction,girlIds){
  const minutesList = girlIds.map(id=>pureTimeToMinutes(fam(id).schedule[day] && fam(id).schedule[day][direction]));
  return pureComputeDepartureTime(direction, minutesList, settings.travelLeadMinutes||60);
}
function planClusters(day,direction,list){
  const girlsInput = list.map(([id,f])=>({id, min: pureTimeToMinutes(f.schedule[day][direction])}));
  const driverSeats = availableDrivers(day,direction).map(([id,f])=>seats(f));
  const togetherRules = (prefs.rules||[]).filter(r=>r.type==='together');
  const preferRules = (prefs.rules||[]).filter(r=>r.type==='prefer');
  const gapLimitMinutes = (settings.gapThresholdHours||3)*60;
  const prefWindowMinutes = settings.prefWindowMinutes!=null? settings.prefWindowMinutes : 30;
  return pureplanClusters({ girls: girlsInput, driverSeats, gapLimitMinutes, togetherRules, preferRules, prefWindowMinutes });
}
function planPrimaryOption(day,direction,list){
  const clusters = planClusters(day,direction,list);
  if(!clusters.length) return null;
  const priorityDrivers = sortByShiftPriority(day,direction, availableDrivers(day,direction))
    .map(([id,f])=>({id, seats: seats(f)}));
  const assignment = planPrimaryAssignment(clusters, priorityDrivers);
  if(!assignment) return null;
  const label = assignment.map(a=>esc(fam(a.driverId).parentName)).join(' &amp; ');
  return {label, assignment};
}
function planOptions(day,direction,list){
  const clusters = planClusters(day,direction,list);
  const availForAlts = availableDrivers(day,direction).map(([id,f])=>({id, seats: seats(f)}));
  const rawAlts = planAlternativeAssignments(clusters, availForAlts);
  let opts = rawAlts.map(assignment=>({
    label: assignment.map(a=>esc(fam(a.driverId).parentName)).join(' &amp; '),
    assignment
  }));
  opts.sort((a,b)=>{
    const pa=a.assignment.reduce((s,x)=>s+shiftPriorityOf(day,direction,x.driverId),0);
    const pb=b.assignment.reduce((s,x)=>s+shiftPriorityOf(day,direction,x.driverId),0);
    return pa-pb;
  });
  const primary = planPrimaryOption(day,direction,list);
  if(primary){
    const key=a=>a.assignment.map(x=>x.driverId).sort().join('+');
    opts = opts.filter(o=>key(o)!==key(primary));
    opts.unshift(primary);
  }
  return opts;
}
async function createGroupWithDriver(day,direction,girlIds,driverId,extraExclude=[]){
  if(!db){showToast("Geen verbinding met opslag.");return;}
  const alreadyDriving = groupsFor(day,direction).map(([gid,g])=>g.driverFamilyId).filter(Boolean);
  const exclude = new Set([driverId, ...alreadyDriving, ...extraExclude]);
  const reserveIds = eligibleDrivers(day,direction,girlIds.length).map(([id])=>id).filter(id=>!exclude.has(id));
  const gid=`${day}_${direction}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
  const departureTime=computeDepartureTime(day,direction,girlIds);
  try{ await db.doc("groups/"+gid).set({day,direction,girlIds,driverFamilyId:driverId||null,reserveFamilyIds:reserveIds,departureTime}); recordLastUpdate('Rooster'); }
  catch(e){showToast("Kon groep niet opslaan (alleen coördinator kan bewerken): "+(e&&e.message||e));}
}
async function useOption(day,direction,assignment){
  const usedDrivers = assignment.map(a=>a.driverId).filter(Boolean);
  for(const a of assignment){ await createGroupWithDriver(day,direction,a.girlIds,a.driverId, usedDrivers.filter(id=>id!==a.driverId)); }
}
async function createGroupCustom(day,direction,ids){
  if(!ids.length){showToast("Selecteer minstens 1 dochter.");return;}
  const eligible=eligibleDrivers(day,direction,ids.length);
  await createGroupWithDriver(day,direction,ids, eligible[0]?eligible[0][0]:null);
}

function renderDirection(day,direction,title){

    const driver = g.driverFamilyId? fam(g.driverFamilyId):null;

    // prevents double-booking instead of fixing it up after the fact.
    const busyElsewhere = new Set(grps.filter(([oid])=>oid!==gid).map(([,og])=>og.driverFamilyId).filter(Boolean));
    const eligible = eligibleDrivers(day,direction,g.girlIds.length).filter(([id])=>!busyElsewhere.has(id));
    const driverOptions = `<option value="" disabled ${!g.driverFamilyId?'selected':''}>-- kies chauffeur --</option>` + eligible.map(([id,f])=>`<option value="${id}" ${id===g.driverFamilyId?'selected':''}>${esc(f.parentName)} (${seats(f)} pl.)</option>`).join('');
    const otherGroups = grps.filter(([oid])=>oid!==gid);
    const moveOptions = otherGroups.map(([oid,og],i)=>{
      const dname = og.driverFamilyId? esc(fam(og.driverFamilyId).parentName) : 'geen chauffeur';
      return `<option value="${oid}" ${i===0?'selected':''}>Auto: ${dname}</option>`;
    }).join('');
    return `<div class="group confirmed" data-gid="${gid}">
      <div class="dir">${direction==='heen'?'Vertrek':'Vertrek (terug)'}</div>
      <div class="time">${departure}${canEdit? ` <input type="time" data-deptime="${gid}" value="${departure!=='--:--'?departure:''}" aria-label="Vertrektijd aanpassen" style="display:inline-block;width:auto;font-size:13px;vertical-align:middle;margin-left:6px;min-height:32px">`:''}</div>
      <div class="subtime">${direction==='heen'? `Aankomst Alkmaar nodig: ${times[0]||'?'}${times[times.length-1]!==times[0]?'–'+times[times.length-1]:''}` : `Klaar om op te halen: ${times[0]||'?'}${times[times.length-1]!==times[0]?'–'+times[times.length-1]:''}`}</div>
      <div>${g.girlIds.map(id=>`<span class="pill">${girlName(id)}</span>`).join('')}</div>
      ${driver? `<div class="driver">🚘 ${esc(driver.parentName)} rijdt <span class="cap">(${g.girlIds.length}/${seats(driver)} bezet)</span></div>` : `<div class="driver" style="color:var(--accent)">Geen chauffeur beschikbaar</div>`}
      ${reserves? `<div class="reserve">Reserve: ${reserves}</div>`:''}
      ${canEdit? `<div class="rowflex" style="margin-top:8px">
          <select data-swap="${gid}" style="flex:1" aria-label="Chauffeur wisselen">${driverOptions||'<option>Geen kandidaten</option>'}</select>
          <button type="button" class="btn small" data-delgroup="${gid}">Verwijder</button>
        </div>`:''}
      ${canEdit && otherGroups.length? `<div class="rowflex" style="margin-top:8px;gap:6px">
          <select data-moveFromGirl="${gid}" style="flex:1" aria-label="Kies dochter om te verplaatsen">
            <option value="">Verplaats passagier…</option>
            ${g.girlIds.map(id=>`<option value="${id}">${girlName(id)}</option>`).join('')}
          </select>
          <select data-moveToGroup="${gid}" style="flex:1" aria-label="Kies bestemming auto">
            <option value="">Naar…</option>${moveOptions}
          </select>
          <button type="button" class="btn small" data-moveConfirm="${gid}">Verplaats</button>
        </div>`:''}
    </div>`;
  }).join('') || `<p class="muted">Nog geen ritten ingepland.</p>`;

  let suggestHtml = '';
  let pickerHtml = '';
  if(canEdit && ungrouped.length){
    const clusters = planClusters(day,direction,ungrouped);
    const options = planOptions(day,direction,ungrouped);
    const clusterLabel = clusters.length===1
      ? `<p class="muted" style="margin:10px 0 4px">Alle ${clusters[0].length} meiden passen logisch in 1 auto. Voorgestelde chauffeur(s):</p>`
      : `<p class="muted" style="margin:10px 0 4px">Meerdere auto's nodig. Optie 1 volgt je selectievolgorde:</p>`;
    if(options.length){
      suggestHtml = clusterLabel + options.map((opt,i)=>{
        const sub = opt.assignment.map(a=>`${esc(fam(a.driverId).parentName)}: ${a.girlIds.map(id=>girlName(id)).join(', ')} (${a.girlIds.length}/${seats(fam(a.driverId))} pl.)`).join(' · ');
        return `<div class="group suggestion${i===0?' primary':''}">

  }
  const devNote = activeDeviation(day,direction)? `<p class="fitbad" style="margin:4px 0">⚠️ Voor deze rit is een tijdelijke wijziging actief in "Dagafwijking" — dit Rooster blijft het standaard schema tonen.</p>` : '';
  return `<div style="margin-bottom:10px"><span class="badge">${title}</span>${devNote}${groupHtml}${suggestHtml}${pickerHtml}</div>`;
}

function attachScheduleHandlers(){
 try{
  document.querySelectorAll('[data-makegroup]').forEach(btn=>btn.onclick=async ()=>{
    const [day,direction]=btn.dataset.makegroup.split('|');
    const box=btn.closest('.group');
    const picked=[...box.querySelectorAll('.girlpick:checked')].map(c=>c.value);
    await createGroupCustom(day,direction,picked);
  });
  document.querySelectorAll('[data-useoption]').forEach(btn=>btn.onclick=async ()=>{
    const [day,direction,idxStr]=btn.dataset.useoption.split('|');
    const opts=(window.__planOptions||{})[day+'|'+direction]||[];
    const opt=opts[+idxStr];
    if(opt) await useOption(day,direction,opt.assignment);
  });
  document.querySelectorAll('[data-delgroup]').forEach(btn=>btn.onclick=async ()=>{
    try{ await db.doc("groups/"+btn.dataset.delgroup).delete(); recordLastUpdate('Rooster'); }catch(e){showToast("Verwijderen mislukt: "+(e&&e.message||e));}
  });
  document.querySelectorAll('[data-swap]').forEach(sel=>sel.onchange=async ()=>{
    const gid=sel.dataset.swap; const g=groups[gid]; if(!g)return;
    const newDriver=sel.value;
    try{
      await db.doc("groups/"+gid).update({driverFamilyId:newDriver});
      const siblings = groupsFor(g.day,g.direction).filter(([oid,og])=>oid!==gid && og.driverFamilyId===newDriver);
      for(const [oid,og] of siblings){
        const usedElsewhere = new Set(groupsFor(g.day,g.direction).filter(([xid])=>xid!==oid).map(([xid,xg])=>xg.driverFamilyId).filter(Boolean));
        usedElsewhere.add(newDriver);
        const alt = eligibleDrivers(g.day,g.direction,og.girlIds.length).map(([id])=>id).find(id=>!usedElsewhere.has(id));
        await db.doc("groups/"+oid).update({driverFamilyId: alt||null});
      }
      showToast(siblings.length? "Chauffeur gewisseld — dubbele boeking automatisch opgelost ✓" : "Chauffeur gewisseld ✓");
      recordLastUpdate('Rooster');
    }catch(e){showToast("Wisselen mislukt: "+(e&&e.message||e));}
  });
  document.querySelectorAll('[data-deptime]').forEach(inp=>inp.onchange=async ()=>{
    const gid=inp.dataset.deptime;
    try{ await db.doc("groups/"+gid).update({departureTime:inp.value}); recordLastUpdate('Rooster'); }catch(e){showToast("Aanpassen mislukt: "+(e&&e.message||e));}
  });
  document.querySelectorAll('[data-moveConfirm]').forEach(btn=>btn.onclick=async ()=>{
    const gid=btn.dataset.moveconfirm;
    const box=btn.closest('.group');
    const girlSel=box.querySelector(`[data-moveFromGirl="${gid}"]`);
    const toSel=box.querySelector(`[data-moveToGroup="${gid}"]`);
    const girlId=girlSel&&girlSel.value, toGid=toSel&&toSel.value;
    if(!girlId||!toGid){ showToast("Kies eerst een dochter én een bestemming."); return; }
    const from=groups[gid], to=groups[toGid];
    if(!from||!to) return;
    // The destination car must actually have a free passenger seat.
    if(to.driverFamilyId){
      const toSeats = seats(fam(to.driverFamilyId));
      if(to.girlIds.length >= toSeats){
        showToast(`Geen plek meer in die auto (${to.girlIds.length}/${toSeats} bezet).`);
        return;
      }
    }
    try{
      const newFrom=from.girlIds.filter(id=>id!==girlId);
      const newTo=[...to.girlIds, girlId];
      // Both cars' departure times depend on who's actually in them — recalculate both.
      const fromDeparture = computeDepartureTime(from.day, from.direction, newFrom);
      const toDeparture = computeDepartureTime(to.day, to.direction, newTo);
      if(newFrom.length){ await db.doc("groups/"+gid).update({girlIds:newFrom, departureTime: fromDeparture}); }
      else { await db.doc("groups/"+gid).delete(); }
      await db.doc("groups/"+toGid).update({girlIds:newTo, departureTime: toDeparture});
      recordLastUpdate('Rooster');
      showToast("Verplaatst ✓");
    }catch(e){showToast("Verplaatsen mislukt: "+(e&&e.message||e));}
  });
 }catch(e){ setStatus("⚠️ Fout bij koppelen roosterknoppen: "+(e&&e.message||e)); }
}

init();
</script>
</body>
</html>

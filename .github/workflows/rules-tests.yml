name: Database rules testen

# Runs the Firestore rules tests (firebase/rules-test/) against the Firestore emulator, with the rules in firebase/firestore.rules.
# Only when the rules, their tests or this runner change. The rules themselves are still published by hand (README, Deploy, step 4).
on:
  pull_request:
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'scripts/run-rules-tests.sh'
      - '.github/workflows/rules-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - 'scripts/run-rules-tests.sh'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'   # firebase-tools refuses Java older than 21
      - name: Run the rules tests on the emulator
        run: bash scripts/run-rules-tests.sh

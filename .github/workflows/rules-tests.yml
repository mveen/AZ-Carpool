name: Rules tests

# The database rules are tried against Google's own Firestore emulator: who may read and write what (firebase/rules-test/).
# Runs when a pull request touches the rules or their tests, and by hand.
on:
  pull_request:
    paths:
      - 'firebase/**'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the emulator and the test helpers (only here, never part of the app)
        run: npm install --no-save --no-package-lock firebase-tools@15 @firebase/rules-unit-testing@6 firebase@13
      - name: Run every rules test against the emulator
        working-directory: firebase
        run: |
          # The emulator needs Java 21; the runner has it installed next to its default Java.
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then export JAVA_HOME="$JAVA_HOME_21_X64"; export PATH="$JAVA_HOME/bin:$PATH"; fi
          java -version
          npx firebase emulators:exec --only firestore --project demo-test \
            'for f in rules-test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done'

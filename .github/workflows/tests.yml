name: Tests

# Only on pull requests: after the merge, deploy.yml runs the same tests (and lint) on main before anything is uploaded, so a second run here
# on the same commit would only cost minutes.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the cache check below compares with the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check that CACHE_NAME was bumped
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-cache-bump.sh "origin/${{ github.base_ref }}"

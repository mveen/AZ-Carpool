name: Deploy azcarpool.nl

# Runs after every merge to main (and by hand: Actions -> Deploy azcarpool.nl -> Run workflow).
# Order: tests + lint (side by side) -> put it on the TEST site -> robot smoke test on the test site -> only then LIVE.
# If a step fails, everything after it is skipped: live stays exactly as it was.
# By hand you can tick "skip_smoke" to go live even when the robot is red (emergency only).
# GitHub Pages is switched off (2026-11-14): this workflow is the only way the app reaches azcarpool.nl.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: 'Emergency only: skip the smoke test and go live straight after the test site'
        type: boolean
        default: false

concurrency:
  group: deploy-azcarpool
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not secret. The server's public identity is pinned in .github/deploy/known_hosts for exactly this host and port.
  SSH_HOST: h70.mijn.host
  SSH_PORT: '26'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Run tests (never upload a broken app)
        run: npm test

  # ESLint (a misspelled name or a forgotten import) is part of the gate too: it runs next to the tests, so it costs no extra time.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Lint (never upload an app with an undefined name)
        run: bash scripts/run-lint.sh

  deploy-test:
    needs: [tests, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://test.azcarpool.nl
      TARGET_DIR: domains/test.azcarpool.nl/public_html/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Database rules: firebase/firestore.rules goes live in the test database by itself (no more pasting in the Firebase console).
      # Skipped with a notice while the secret RULES_KEY_TEST is not set (README -> Database rules).
      - name: Publish the database rules (test database)
        env:
          RULES_KEY: ${{ secrets.RULES_KEY_TEST }}
        run: |
          if [ -z "$RULES_KEY" ]; then echo "::notice::RULES_KEY_TEST is not set: the database rules were NOT published. Paste firebase/firestore.rules in the Firebase console if it changed."; exit 0; fi
          key="$RUNNER_TEMP/rules-key.json"; printf '%s' "$RULES_KEY" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          node scripts/publish-rules.mjs --project az-carpool-test --key "$key" --diff --publish

      - name: Build the test upload folder (own database, test banner)
        run: npm run build:deploy:test

      - name: Check that the secrets are set
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          missing=0
          for name in DEPLOY_USER DEPLOY_KEY; do
            if [ -z "${!name}" ]; then echo "::error::GitHub secret $name is not set (repo Settings -> Secrets and variables -> Actions)"; missing=1; fi
          done
          exit $missing

      - name: Set up the SSH key
        uses: ./.github/actions/ssh-setup
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}

      - name: Upload to the test site
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          export RSYNC_SSH="ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519"
          DEPLOY_CHECK_SITE="$SITE" bash scripts/deploy-rsync.sh dist-test/ "$user@$SSH_HOST:$TARGET_DIR"

      - name: Check that the new version is on the test site
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Asks the site; when the host answers the robot with its wait page (bot check), the files are read on the host itself.
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          SITE_SSH="ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519 $user@$SSH_HOST" REMOTE_DIR="$TARGET_DIR" bash .github/scripts/check-site.sh test "$SITE" dist-test

  smoke:
    needs: deploy-test
    if: ${{ !inputs.skip_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Robot browsers (Chromium and WebKit, the Safari engine; cached)
        uses: ./.github/actions/playwright
      - name: Open the tunnel to the test site (own restricted key; skipped without the TUNNEL_KEY secret)
        env:
          TUNNEL_KEY: ${{ secrets.TUNNEL_KEY }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: h70.mijn.host
          SSH_PORT: '26'
        run: bash .github/scripts/open-site-tunnel.sh test.azcarpool.nl
      - name: Smoke test the test site (coordinator and parent)
        env:
          SMOKE_SITE: https://test.azcarpool.nl
          SMOKE_PHONE: ${{ secrets.SMOKE_PHONE }}
          SMOKE_CODE_COORD: ${{ secrets.SMOKE_CODE_COORD }}
          SMOKE_CODE_PARENT: ${{ secrets.SMOKE_CODE_PARENT }}
        run: node scripts/smoke-test.mjs

  deploy-live:
    needs: [deploy-test, smoke]
    # Runs when the smoke test is green, or when it was skipped on purpose by hand. Never when anything failed.
    if: ${{ !cancelled() && needs.deploy-test.result == 'success' && (needs.smoke.result == 'success' || (needs.smoke.result == 'skipped' && inputs.skip_smoke)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://azcarpool.nl
      TARGET_DIR: domains/azcarpool.nl/public_html/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Database rules: firebase/firestore.rules goes live in the live database by itself (no more pasting in the Firebase console).
      # Skipped with a notice while the secret RULES_KEY_LIVE is not set (README -> Database rules).
      - name: Publish the database rules (live database)
        env:
          RULES_KEY: ${{ secrets.RULES_KEY_LIVE }}
        run: |
          if [ -z "$RULES_KEY" ]; then echo "::notice::RULES_KEY_LIVE is not set: the database rules were NOT published. Paste firebase/firestore.rules in the Firebase console if it changed."; exit 0; fi
          key="$RUNNER_TEMP/rules-key.json"; printf '%s' "$RULES_KEY" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          node scripts/publish-rules.mjs --project az-carpool --key "$key" --diff --publish

      - name: Build the upload folder
        run: npm run build:deploy

      - name: Build the cron jobs
        run: npm run build:cron

      - name: Check that the secrets are set
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          missing=0
          for name in DEPLOY_USER DEPLOY_KEY; do
            if [ -z "${!name}" ]; then echo "::error::GitHub secret $name is not set (repo Settings -> Secrets and variables -> Actions)"; missing=1; fi
          done
          exit $missing

      - name: Set up the SSH key
        uses: ./.github/actions/ssh-setup
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY }}

      - name: Upload to mijn.host
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          export RSYNC_SSH="ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519"
          DEPLOY_CHECK_SITE="$SITE" bash scripts/deploy-rsync.sh dist/ "$user@$SSH_HOST:$TARGET_DIR"

      - name: Check that the new version is live
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Asks the site; when the host answers the robot with its wait page (bot check), the files are read on the host itself.
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          SITE_SSH="ssh -p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519 $user@$SSH_HOST" REMOTE_DIR="$TARGET_DIR" bash .github/scripts/check-site.sh live "$SITE" dist

      # The cron jobs (nightly back-up, daily match calendars) live outside the web folder, in ~/azcarpool-cron/.
      # Their key files are NOT in GitHub: they are put on the host by hand, once (see README).
      - name: Upload the cron jobs and check the host
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          user=$(printf '%s' "$DEPLOY_USER" | tr -d '[:space:]')
          SSH_OPTS="-p $SSH_PORT -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519"
          export RSYNC_SSH="ssh $SSH_OPTS"
          bash scripts/deploy-rsync.sh dist-cron/ "$user@$SSH_HOST:azcarpool-cron/"
          # Does the host have a suitable Node.js, can it log in to Google with the uploaded keys?
          # shellcheck disable=SC2086 # SSH_OPTS is a list of options: it must be split into words
          ssh $SSH_OPTS "$user@$SSH_HOST" "bash azcarpool-cron/run.sh selftest"

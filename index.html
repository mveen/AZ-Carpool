<script type="module">
// The app itself lives in the modules next to this file (see README). This inline script only
// connects the real Firebase and starts the app. Absolute URLs on purpose: a relative module
// specifier triggered a Firefox security error for at least one user ("may not load or link to

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import * as firestoreSdk from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Whole module on purpose: an older firebase-config.js must not break start-up. (The OpenRouteService key is not in this file: it is in the database, see settings/apiKeys.)
import * as appConfig from "https://mveen.github.io/AZ-Carpool/firebase-config.js";
import { initDb, createFirestoreDb } from "https://mveen.github.io/AZ-Carpool/data.js";
import { startApp } from "https://mveen.github.io/AZ-Carpool/app.js";

const { firebaseConfig, googleCalendarApiKey } = appConfig;
const fbApp = initializeApp(firebaseConfig);
initDb(createFirestoreDb({
  sdk: { ...firestoreSdk, signInAnonymously },
  firestoreDb: firestoreSdk.getFirestore(fbApp),
  auth: getAuth(fbApp),
  calendarApiKey: googleCalendarApiKey
}));
startApp();
</script>
